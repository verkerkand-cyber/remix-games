<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05030f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="build" content="BUILD-RS-1.5 · 2026-10-18">
<title>Rock Storm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:#fff;font-family:'Orbitron','Segoe UI',system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;overflow:hidden}
#game{position:absolute;left:0;top:0;display:block}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;color:#fff}
/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;z-index:20;overflow-y:auto}
.screen.dim{background:rgba(3,2,10,.55)}
#screen-loading{background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--a) 22%,transparent),var(--bg) 70%);z-index:60}
.logo{font-size:clamp(34px,9vw,68px);font-weight:900;letter-spacing:.06em;text-align:center;line-height:1.05;
  background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px color-mix(in srgb,var(--a) 70%,transparent))}
.tag{opacity:.8;margin-top:8px;letter-spacing:.2em;font-size:12px;text-align:center;text-transform:uppercase}
.loadbar{width:min(320px,80vw);height:10px;border-radius:6px;background:rgba(255,255,255,.08);margin-top:34px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.loadbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 0 16px var(--b);transition:width .12s}
.tapstart{margin-top:26px;font-size:16px;letter-spacing:.25em;animation:blink 1.1s infinite;opacity:0}
@keyframes blink{50%{opacity:.25}}
.menu-card{width:min(440px,94vw);display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:18px;border-radius:20px;
  background:rgba(8,6,22,.72);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(6px);box-shadow:0 0 40px color-mix(in srgb,var(--a) 25%,transparent)}
.menu-card .logo{font-size:clamp(30px,8vw,46px);margin-bottom:2px}
.diff{display:flex;gap:6px;background:rgba(255,255,255,.06);padding:5px;border-radius:14px}
.diff button{flex:1;padding:10px 4px;border-radius:10px;background:transparent;font-size:13px;font-weight:700;letter-spacing:.08em;opacity:.65}
.diff button.on{background:linear-gradient(90deg,var(--a),var(--b));opacity:1;box-shadow:0 0 14px color-mix(in srgb,var(--b) 60%,transparent);color:#050510}
.big{padding:15px;border-radius:14px;font-size:17px;font-weight:800;letter-spacing:.12em;background:linear-gradient(90deg,var(--a),var(--b));color:#060612;box-shadow:0 0 18px color-mix(in srgb,var(--a) 50%,transparent)}
.big:disabled{opacity:.35;box-shadow:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mid{padding:13px 8px;border-radius:12px;font-size:13px;font-weight:700;letter-spacing:.08em;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}
.mid:hover,.big:hover{filter:brightness(1.15)}
.meta{display:flex;justify-content:space-between;font-size:12px;opacity:.8;padding:0 4px}
.ver{font-size:10px;text-align:center;letter-spacing:.1em;display:flex;flex-direction:column;align-items:center;gap:2px}
.ver .bld{opacity:.45}
/* ---------- support / contact ---------- */
.suplink{background:rgba(255,255,255,.06);border:1px solid color-mix(in srgb,var(--b) 50%,transparent);color:var(--b);font-size:11px;letter-spacing:.04em;padding:9px 12px;border-radius:10px;margin-top:4px}
.supaddr{font-family:'Segoe UI',system-ui,sans-serif;font-size:17px;font-weight:700;padding:12px;border-radius:10px;background:rgba(255,255,255,.08);color:var(--b);word-break:break-all;user-select:text;-webkit-user-select:text}
a.suplnk{display:block;text-decoration:none;color:#fff;text-align:center}
.supnote{font-size:12px!important;opacity:.6!important}
/* ---------- panels ---------- */
.panel{width:min(560px,96vw);max-height:92vh;display:flex;flex-direction:column;border-radius:20px;background:rgba(8,6,22,.92);border:1px solid rgba(255,255,255,.14);overflow:hidden}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.panel-h h2{flex:1;font-size:18px;letter-spacing:.12em;color:var(--b)}
.back{padding:8px 14px;border-radius:10px;background:rgba(255,255,255,.1);font-size:13px}
.panel-b{padding:16px;overflow-y:auto;font-family:'Segoe UI',system-ui,sans-serif;line-height:1.55;font-size:15px}
.panel-b h3{font-family:'Orbitron',sans-serif;color:var(--a);font-size:14px;letter-spacing:.1em;margin:14px 0 6px}
.panel-b h3:first-child{margin-top:0}
.panel-b ul{padding-left:20px}.panel-b li{margin:3px 0}
.panel-b p{margin:6px 0}
.key{display:inline-block;padding:1px 7px;border-radius:5px;background:rgba(255,255,255,.14);font-family:monospace;font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:8px;border-radius:9px;background:rgba(255,255,255,.07);font-size:12px;font-weight:700}
.tabs button.on{background:var(--b);color:#050510}
table.sc{width:100%;border-collapse:collapse;font-size:14px}
table.sc td,table.sc th{padding:7px 6px;text-align:left;border-bottom:1px solid rgba(255,255,255,.07)}
table.sc th{font-size:11px;opacity:.6;letter-spacing:.1em}
table.sc tr:first-child td{color:var(--a);font-weight:700}
.slot{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;margin-bottom:10px;text-align:left;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);font-family:'Segoe UI',system-ui,sans-serif}
.slot b{font-family:'Orbitron',sans-serif;font-size:14px;color:var(--b)}
.slot .n{font-family:'Orbitron',sans-serif;font-size:22px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:rgba(255,255,255,.1);flex:none}
.slot small{opacity:.7;display:block;font-size:13px}
.slot:disabled{opacity:.35}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{padding:12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:6px}
.item .sw{height:46px;border-radius:10px}
.item b{font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:.05em}
.item small{opacity:.7;font-size:12px;line-height:1.3;min-height:30px}
.item button{padding:8px;border-radius:9px;font-size:12px;font-weight:700;background:rgba(255,255,255,.12)}
.item button.buy{background:linear-gradient(90deg,var(--a),var(--b));color:#050510}
.item button.eq{background:#1c3;color:#031}
.item.prem{border-color:#ffd24a55;background:rgba(255,210,74,.06)}
.cat{font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:.14em;opacity:.8;margin:16px 0 8px;color:var(--a)}
.cat:first-child{margin-top:0}
.coins{color:#ffd24a;font-weight:800}
/* ---------- HUD: top strip + ability bar. The game canvas is fitted into the space left over, so nothing covers play ---------- */
#hud{position:absolute;inset:0;z-index:10;pointer-events:none}
#hudTop{position:absolute;left:0;right:0;top:0;height:46px;display:flex;gap:14px;align-items:center;justify-content:center;padding:0 90px 0 12px;background:rgba(5,4,16,.92);border-bottom:1px solid rgba(255,255,255,.12);font-size:13px;font-weight:700;white-space:nowrap;letter-spacing:.05em;pointer-events:auto}
#hudTop span{opacity:.6;font-weight:400;font-size:10px;margin-right:4px}
#hudLives{color:var(--a)}
#hudCoinBox{transition:transform .15s}
#hudCoinBox.bump{transform:scale(1.3)}
.hbtn{pointer-events:auto;background:rgba(5,4,16,.65);border:1px solid rgba(255,255,255,.25);border-radius:12px;font-weight:800;letter-spacing:.08em}
#btnEnd{position:absolute;top:7px;right:8px;padding:8px 11px;font-size:11px;color:#ff6b8a;border-color:#ff6b8a88}
@media (max-width:480px){#hudTop{gap:9px;font-size:12px;padding:0 74px 0 8px;justify-content:flex-start}#hudTop span{display:none}#btnEnd{padding:8px 9px}}
#bar{position:absolute;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(5,4,16,.92);pointer-events:auto;touch-action:none}
#bar{left:0;right:0;top:46px;height:84px;padding:0 12px;flex-direction:row;border-bottom:2px solid color-mix(in srgb,var(--b) 55%,transparent);box-shadow:0 6px 18px rgba(0,0,0,.5)}
#abilities{display:flex;gap:12px}
.barbtns{display:flex;gap:10px}
.bbtn{width:54px;height:54px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.bbtn small{font-size:8px;letter-spacing:.08em;margin-top:4px;opacity:.75}
#btnShopIn{border-color:#ffd24a99;background:rgba(255,210,74,.12)}
#btnShopIn.flash{animation:shopflash .5s 4}
@keyframes shopflash{50%{background:#ffd24a;color:#000;box-shadow:0 0 20px #ffd24a}}
.ab{position:relative;width:60px;height:60px;border-radius:50%;background:rgba(5,4,16,.7);border:2px solid var(--b);font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px color-mix(in srgb,var(--b) 45%,transparent);touch-action:none;flex:none}
.ab .cnt{position:absolute;right:-5px;top:-5px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--b);color:#050510;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 0 8px var(--b)}
.ab .kb{position:absolute;right:-7px;bottom:4px;font-size:10px;padding:1px 5px;border-radius:6px;background:#fff;color:#000;font-weight:800;font-family:monospace}
.ab .nm{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);font-size:7px;letter-spacing:.06em;opacity:.7;white-space:nowrap;font-weight:700;pointer-events:none}
.ab.active{background:color-mix(in srgb,var(--b) 45%,#000);box-shadow:0 0 22px var(--b)}
.ab.empty{border-color:rgba(120,110,150,.5);box-shadow:none}
.ab.empty .ic{opacity:.3}
.ab.empty .cnt{background:#e8503a;color:#fff;box-shadow:none}
.ab.empty::after{content:'';position:absolute;left:8px;right:8px;top:50%;height:3px;border-radius:2px;background:#e8503a;transform:rotate(-45deg)}
.ab.lock .ic{opacity:.5}
@media (hover:none){.ab .kb{display:none}}
@media (max-width:420px){.ab{width:54px;height:54px;font-size:23px}#abilities{gap:9px}.bbtn{width:48px;height:48px}.barbtns{gap:7px}}
/* gold coins flying to the counter */
#tut{position:absolute;left:50%;transform:translateX(-50%);width:min(520px,calc(100vw - 24px));padding:12px 14px;border-radius:14px;background:rgba(5,4,16,.9);border:2px solid var(--a);box-shadow:0 0 22px color-mix(in srgb,var(--a) 50%,transparent);font-family:'Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.4;pointer-events:auto}
#tut{top:calc(52px + env(safe-area-inset-top));bottom:auto;z-index:6}
.lay-side #tut{transform:none;max-width:none;right:auto}
#tut .tt span{color:#ffd23f}
#tut button#tutSkip{font-size:12px;padding:7px 10px;background:var(--a);color:#000;font-weight:800}
#tut .tt{font-family:'Orbitron',sans-serif;font-size:11px;color:var(--a);letter-spacing:.14em;margin-bottom:4px;display:flex;justify-content:space-between}
#tut button{font-size:10px;padding:4px 8px;border-radius:7px;background:rgba(255,255,255,.14)}
#toast{position:absolute;top:calc(130px + 8%);left:50%;transform:translateX(-50%);font-size:clamp(20px,5vw,34px);font-weight:900;letter-spacing:.1em;text-shadow:0 0 18px var(--a);opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none}
#joy{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.04);transform:translate(-50%,-50%);pointer-events:none;z-index:9}
#joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:color-mix(in srgb,var(--b) 50%,transparent);box-shadow:0 0 14px var(--b)}
/* ---------- modal ---------- */
#modal{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(3,2,10,.7);padding:16px}
.mbox{width:min(400px,94vw);padding:22px;border-radius:20px;background:rgba(10,8,26,.96);border:1px solid rgba(255,255,255,.16);text-align:center;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 40px color-mix(in srgb,var(--a) 30%,transparent)}
.mbox h2{font-size:24px;letter-spacing:.1em;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.mbox p{font-family:'Segoe UI',system-ui,sans-serif;opacity:.85;line-height:1.45}
.mbox .stat{font-size:28px;font-weight:900}
.mbox input{padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:#fff;font-family:inherit;font-size:18px;text-align:center;letter-spacing:.1em;text-transform:uppercase}
.choice{padding:12px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);text-align:left;font-family:'Segoe UI',system-ui,sans-serif}
.choice b{font-family:'Orbitron',sans-serif;color:var(--b);font-size:13px;display:block}
.sndbtn{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);font-size:20px;z-index:25}
/* ---------- slots ---------- */
.slot-wrap{display:flex;flex-direction:column;gap:12px;align-items:center;font-family:'Orbitron',sans-serif}
.slot-coins{font-size:18px}
.reels{display:flex;gap:8px;padding:14px;border-radius:18px;background:linear-gradient(180deg,#1a0f33,#0b0718);border:2px solid var(--a);box-shadow:0 0 24px color-mix(in srgb,var(--a) 45%,transparent),inset 0 0 30px rgba(0,0,0,.8)}
.reel{width:64px;height:80px;border-radius:10px;background:linear-gradient(180deg,#fff 0%,#e8e8f4 50%,#c8c8dc 100%);display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:inset 0 6px 10px rgba(0,0,0,.35),inset 0 -6px 10px rgba(0,0,0,.35)}
.reels.five .reel{width:50px;height:66px;font-size:32px}
.reel.spin{animation:rblur .09s linear infinite}
.reel.win{box-shadow:0 0 18px #ffd23f,inset 0 0 12px #ffd23f}
@keyframes rblur{50%{transform:translateY(3px);filter:blur(1.5px)}}
.bets{display:flex;gap:6px}
.bets button{padding:8px 12px;border-radius:9px;background:rgba(255,255,255,.08);font-size:12px;font-weight:700}
.bets button.on{background:var(--b);color:#050510}
.slot-msg{min-height:26px;font-size:16px;font-weight:800;text-align:center;letter-spacing:.06em}
.slot-msg.win{color:#ffd23f;text-shadow:0 0 12px #ffd23f}
.slot-msg.lose{color:#ff6b8a}
.wheel-box{position:relative;width:240px;height:240px}
.wheel{width:240px;height:240px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 26px var(--a);transition:transform 3.6s cubic-bezier(.12,.8,.18,1)}
.wheel-lbl{position:absolute;left:50%;top:50%;width:0;height:0}
.wheel-lbl span{position:absolute;left:-18px;top:-104px;width:36px;text-align:center;font-size:13px;font-weight:900;color:#fff;text-shadow:0 1px 3px #000}
.wheel-ptr{position:absolute;left:50%;top:-12px;margin-left:-12px;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:24px solid #fff;filter:drop-shadow(0 0 6px var(--a));z-index:2}
.coin{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c8,#ffd23f 45%,#b8860b);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#6b4a00;box-shadow:0 0 22px #ffd23f}
.coin.flip{animation:cflip .9s ease-in-out}
@keyframes cflip{0%{transform:rotateY(0) scale(1)}50%{transform:rotateY(900deg) scale(1.3)}100%{transform:rotateY(1800deg) scale(1)}}
.dbl{display:flex;flex-direction:column;gap:8px;align-items:center;padding:12px;border-radius:14px;border:1px dashed #ffd23f88;width:100%}
.paytable{font-family:'Segoe UI',sans-serif;font-size:12px;opacity:.75;text-align:center;line-height:1.5}
.upg{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);margin-bottom:8px}
.upg .ic{font-size:26px;width:40px;text-align:center}
.upg .tx{flex:1;font-size:13px}
.upg .tx b{font-family:'Orbitron',sans-serif;font-size:12px;display:block}
.pips{display:flex;gap:4px;margin-top:4px}.pips i{width:16px;height:6px;border-radius:3px;background:rgba(255,255,255,.15)}.pips i.on{background:var(--b);box-shadow:0 0 6px var(--b)}
.upg button{padding:8px 10px;border-radius:9px;font-size:12px;font-weight:700;background:linear-gradient(90deg,var(--a),var(--b));color:#050510}
.upg button:disabled{opacity:.4}
.casino{background:linear-gradient(90deg,#ffd23f,#ff7b1c,#ff2bd6)!important;color:#1a0610!important}

/* ---------- ability shop ---------- */
.mid.abil{background:linear-gradient(90deg,color-mix(in srgb,var(--b) 30%,transparent),color-mix(in srgb,var(--a) 30%,transparent));border-color:var(--b)}
.mbox{max-height:92vh;overflow-y:auto}
.mbox.wide{width:min(480px,96vw)}
.abshop{display:flex;flex-direction:column;gap:8px;text-align:left;font-family:'Segoe UI',system-ui,sans-serif}
.abshop .bal{text-align:center;font-family:'Orbitron',sans-serif;font-size:17px;padding:8px;border-radius:10px;background:rgba(255,210,74,.08);border:1px solid #ffd24a55}
.abrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid color-mix(in srgb,var(--b) 40%,transparent)}
.abrow .ic{font-size:26px;width:38px;text-align:center;flex:none}
.abrow .tx{flex:1;font-size:12px;line-height:1.3;opacity:.9}
.abrow .tx b{display:block;font-family:'Orbitron',sans-serif;font-size:12px;color:var(--b);letter-spacing:.05em}
.abrow .have{font-family:'Orbitron',sans-serif;font-size:11px;opacity:.8;display:block;margin-top:2px}
.abrow button{flex:none;min-width:74px;padding:10px 8px;border-radius:10px;font-size:12px;font-weight:800;background:linear-gradient(90deg,var(--a),var(--b));color:#050510;font-family:'Orbitron',sans-serif}
.abrow button:disabled{background:rgba(255,255,255,.1);color:#8d8aa8}
.abrow.free{border-style:dashed;opacity:.8}
.abrow.gold{border-color:#ffd24a66;background:rgba(255,210,74,.05)}
.abshop .cat{margin:8px 0 0}
.abshop .note{font-size:11px;opacity:.6;text-align:center}

/* v1.4: abilities at the top, glow when ready */
.ab.ready{animation:abpulse 1.4s infinite}
@keyframes abpulse{50%{box-shadow:0 0 24px var(--b),0 0 6px #fff inset}}
.ab .nm{bottom:-12px;font-size:8px;opacity:.9}
/* big counter chip in the bar (Sky Shield ammo) */
.ctr{flex:1;min-width:0;max-width:170px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 8px;border-radius:14px;border:2px solid #36d6ff;background:rgba(54,214,255,.1);line-height:1}
.ctr span{font-size:10px;letter-spacing:.14em;opacity:.8}
.ctr b{font-size:24px;font-weight:900;margin-top:4px;color:#fff;white-space:nowrap}
.ctr.low{border-color:#ffe14a;background:rgba(255,225,74,.12)}.ctr.low b{color:#ffe14a}
.ctr.empty{border-color:#ff3b3b;background:rgba(255,59,59,.18);animation:ctrblink .5s infinite}.ctr.empty b{color:#ff3b3b;font-size:17px}
@keyframes ctrblink{50%{opacity:.45}}
@media (max-width:420px){.ctr b{font-size:19px}.ctr span{font-size:9px}.ctr{padding:5px 4px}}

/* ---------- 1-minute story ending ---------- */
#screen-ending{background:linear-gradient(180deg,rgba(3,2,10,.85),rgba(3,2,10,.35) 30%,rgba(3,2,10,.35) 70%,rgba(3,2,10,.9));z-index:50;justify-content:flex-start;padding:0;overflow:hidden}
.crawl{position:absolute;inset:0;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}

/* ROCK STORM — Asteroids remix (#26): fly, blast and survive the storm */
(function(){
const W=600, H=900, SR=16, SIZES=[0,16,30,52];
let api, t, ship, rocks, bullets, ebullets, ufos, done, lost, fireT, eff, ufoT, stageN, mouse, inv, boss;

function rng(s){ return function(){ s|=0; s=s+0x6D2B79F5|0; let x=Math.imul(s^s>>>15,1|s); x=x+Math.imul(x^x>>>7,61|x)^x; return ((x^x>>>14)>>>0)/4294967296; }; }
function shape(R){ const n=9+Math.floor(R()*4), pts=[]; for(let i=0;i<n;i++){ pts.push(0.72+R()*0.36); } return pts; }
function rock(x,y,size,spd,R){ const a=R()*Math.PI*2, s=spd*(0.6+R()*0.8)*(size===1?1.35:size===2?1.1:1); return {x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,size,r:SIZES[size],rot:R()*6,vr:(R()-.5)*2,pts:shape(R),hp:size===4?0:1}; }
function wrap(o,m){ if(o.x<-m) o.x=W+m; if(o.x>W+m) o.x=-m; if(o.y<-m) o.y=H+m; if(o.y>H+m) o.y=-m; }
function rockSpeed(){ return api.content===0? 45 : api.dv([50,90,135],175,340); }

function makeStage(n,a){
  const R=rng(n===0?5:n*4271+a.diff*619+7);
  const count = n===0? 2 : Math.min(26, Math.round(a.dv([3,6,9],12,26)) + (a.boss?2:0));
  rocks=[]; const sp=rockSpeed();
  for(let i=0;i<count;i++){ let x,y; do{ x=R()*W; y=R()*H; } while(Math.hypot(x-W/2,y-H/2)<220); rocks.push(rock(x,y,3,sp,R)); }
  // BOSS: a giant armoured rock that takes many hits before it cracks
  boss=null; if(a.boss){ boss={x:W/2,y:170,vx:sp*0.5,vy:sp*0.3,r:90,rot:0,vr:0.3,pts:shape(R),hp:Math.round(Math.min(160,25+a.level*0.5)),max:0,size:4}; boss.max=boss.hp; rocks.push(boss); }
  ufoT = (n===0 || a.level<25)? 1e9 : a.dv([18,11,6],4,1.2);
}

/* ---------- canvas + layout ----------
   The screen is split: a 46px strip on top (score, stage, lives, gold, END) and an
   84px ability bar (bottom on tall screens, left side on wide screens). The game is
   scaled into whatever is left, so the buttons never sit on top of the play area. */
const TOPH = 46, BARS = 84;
const SIDE = (G.layout!=='top');   // v2: abilities in a column on the right (set G.layout='top' for the old top bar)
const app = $('#app'), cv = $('#game'), ctx = cv.getContext('2d');
if(SIDE){ app.classList.remove('lay-top'); app.classList.add('lay-side','lay2'); }
let scale = 1, offX = 0, offY = 0, dpr = 1;
/* ===== SHELL-LAYOUT-2 (Andrew, 20 Oct 2026) =====
   ACTION buttons (free cd:0 abilities: FIRE, JUMP, BOMB…) = a big thumb-sized ACTION BAR at the BOTTOM of the screen
   (bottom-right by default). Consumable abilities + 🛒 SHOP + ❚❚ PAUSE = a compact see-through column on the LEFT edge,
   in the MIDDLE of the screen, laid over the game's edge, so the game gets the full width. On a tall phone the game sits
   ABOVE the action bar (nothing covers it); on a wide screen the action bar sits beside the game.
   Players change sizes / sides / position in ⚙️ SETTINGS. Saved for EVERY game on the site in localStorage 'rmxLayout'. */
const ACT = SIDE ? G.abilities.map((a,i)=>i).filter(i=>G.abilities[i].cd===0) : [];
const NCONS = G.abilities.length - ACT.length;
const LDEF = {cs:1, side:'L', cy:0.5, as:1, ap:'R'};
function clampN(v,a,b,d){ v=+v; return isFinite(v)? Math.max(a,Math.min(b,v)) : d; }
function loadLayout(){ let o=null; try{ o=JSON.parse(localStorage.getItem('rmxLayout')); }catch(e){ o=null; } if(!o||typeof o!=='object') o={};
  return {cs:clampN(o.cs,0.7,1.5,1), side:o.side==='R'?'R':'L', cy:clampN(o.cy,0,1,0.5), as:clampN(o.as,0.7,1.6,1), ap:(o.ap==='L'||o.ap==='C')?o.ap:'R'}; }
function saveLayout(){ try{ localStorage.setItem('rmxLayout', JSON.stringify(LAY)); }catch(e){} }
let LAY = loadLayout();
let SAB = 0; // safe-area inset at the bottom (iPhone home bar)
try{ const pr=document.createElement('div'); pr.style.cssText='position:fixed;left:0;bottom:0;width:1px;height:env(safe-area-inset-bottom,0px);pointer-events:none;visibility:hidden'; document.body.appendChild(pr); SAB=pr.offsetHeight||0; }catch(e){ SAB=0; }
// pure geometry: where the game, the ability column and the action bar go for a W x H screen and settings L
function geo(W,H,L){
  const nA=ACT.length, sab=SAB;
  // action bar: n big round buttons side by side
  let as=Math.round((W<=480?74:82)*L.as); as=Math.min(as, Math.round(Math.max(56,H*0.2)));
  let ag=Math.round(as*0.16); const maxAW=W-24;
  if(nA && nA*as+(nA-1)*ag>maxAW){ as=Math.floor((maxAW-(nA-1)*ag)/nA); ag=Math.round(as*0.16); }
  const aw=nA? nA*as+(nA-1)*ag : 0, ah=nA? as+14+sab : 0;
  // game canvas: full width above the action bar, or (wide screens, bar on a side) beside it, whichever is bigger
  let sc=Math.min(W/G.w, (H-ah)/G.h), mode='below';
  if(nA && L.ap!=='C'){ const sc2=Math.min((W-2*(aw+16))/G.w, H/G.h); if(sc2>sc){ sc=sc2; mode='beside'; } }
  if(!nA) mode='none';
  const cw=G.w*sc, ch=G.h*sc, cx=(W-cw)/2, cy= mode==='below'? Math.max(0,(H-ah-ch)/2) : (H-ch)/2;
  const ax= L.ap==='L'? 12 : L.ap==='C'? (W-aw)/2 : W-12-aw, ay=H-8-sab-as;
  // ability column: never over the top strip, never over the action bar
  const T0=Math.max(8,cy)+62; let B0=H-8-sab; if(nA && (L.ap==='C' || L.ap===L.side)) B0=Math.min(B0, ay-10);
  let cs=L.cs, col=null;
  for(let k=0;k<4;k++){
    const cb=Math.round((W<=420?50:56)*cs), nmh=Math.max(8,Math.round(cb*0.2)), cg=Math.max(3,Math.round(6*cs)), sb=Math.round(cb*0.78), cp=6, w=cb+12;
    const h=2*cp + NCONS*cb + NCONS*(nmh+cg) + 2*sb + cg;
    col={cb,nmh,nmf:Math.max(7,nmh-1),cg,sb,cp,w,h};
    if(h<=B0-T0 || cs<0.4) break; cs=cs*(B0-T0)/h*0.99;
  }
  col.x= L.side==='R'? W-4-col.w : 4; col.y= T0 + L.cy*Math.max(0,(B0-T0-col.h)); col.fit=cs/L.cs;

}
let GEO=null;
function applyLayout(W,H){
  const g=GEO=geo(W,H,LAY);
  scale=g.sc; offX=g.cx; offY=g.cy; const cw=g.cw, ch=g.ch;
  cv.style.width = cw+'px'; cv.style.height = ch+'px'; cv.style.left = offX+'px'; cv.style.top = offY+'px';
  cv.width = Math.round(cw*dpr); cv.height = Math.round(ch*dpr);
  const bar=$('#bar'), ab=$('#actbar'), top=$('#hudTop'), tut=$('#tut'), tst=$('#toast'), c=g.col, a=g.act;
  bar.style.left=c.x+'px'; bar.style.top=c.y+'px'; bar.style.height='';
  [['--cb',c.cb],['--nmh',c.nmh],['--nmf',c.nmf],['--cg',c.cg],['--sb',c.sb],['--cp',c.cp],['--cw',c.w]].forEach(([k,v])=>bar.style.setProperty(k,v+'px'));
  ab.style.left=a.x+'px'; ab.style.top=a.y+'px'; ab.style.setProperty('--as',a.s+'px'); ab.style.setProperty('--ag',a.g+'px');
  app.classList.toggle('nocons', NCONS===0);
  document.documentElement.style.setProperty('--actH', (a.n? H-a.y : 0)+'px');   // race bars (#mpBars) sit above the action bar
  top.style.left=offX+'px'; top.style.top=offY+'px'; top.style.width=cw+'px';
  // tutorial box: across the game, but beside the ability column so it never hides those buttons
  let tl=offX+8, tr=offX+cw-8; if(LAY.side==='L') tl=Math.max(tl, c.x+c.w+6); else tr=Math.min(tr, c.x-6);
  tut.style.left=tl+'px'; tut.style.width=Math.max(160,tr-tl)+'px'; tut.style.top=(offY+58)+'px';
  tst.style.left=(offX+cw/2)+'px'; tst.style.top=(offY+ch*0.22)+'px';
}
function resize(){
  const W = window.innerWidth, H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio||1, 2);
  if(SIDE){ applyLayout(W,H); return; }
  const ay = TOPH+BARS, aw = W, ah = H-ay-6;
  scale = Math.min(aw/G.w, ah/G.h);
  const cw = G.w*scale, ch = G.h*scale; offX = (aw-cw)/2; offY = ay+(ah-ch)/2;
  cv.style.width = cw+'px'; cv.style.height = ch+'px'; cv.style.left = offX+'px'; cv.style.top = offY+'px';
  cv.width = Math.round(cw*dpr); cv.height = Math.round(ch*dpr);
}
if(G.abilities.length>=4) app.classList.add('ab4');
window.addEventListener('resize', resize); resize();
function toGame(cx, cy){ return {x:(cx-offX)/scale, y:(cy-offY)/scale}; }

/* ---------- FX ---------- */
const parts = [], texts = []; let shakeT = 0, shakeA = 0, flashA = 0, flashC = '#fff';
const FX = {
  burst(x,y,color,n,spd,life,size){ n=n||16; for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=(spd||200)*(0.3+Math.random()*0.9); parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:(life||0.6)*(0.6+Math.random()*0.6),max:life||0.6,c:color,s:size||3}); } if(parts.length>900) parts.splice(0,parts.length-900); },
  spark(x,y,vx,vy,color,life,size){ parts.push({x,y,vx,vy,life:life||.4,max:life||.4,c:color,s:size||2}); },
  shake(a){ shakeA = Math.max(shakeA, a); shakeT = .3; },
  flash(c,a){ flashC=c||'#fff'; flashA=a||.5; },
  text(x,y,t,c,size){ texts.push({x,y,t,c:c||'#fff',life:1,size:size||18}); }
};
function fxUpdate(dt){
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.life-=dt; if(p.life<=0){parts.splice(i,1);continue;} p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.97; p.vy*=0.97; }
  for(let i=texts.length-1;i>=0;i--){ const t=texts[i]; t.life-=dt; t.y-=40*dt; if(t.life<=0) texts.splice(i,1); }
  if(shakeT>0){ shakeT-=dt; if(shakeT<=0) shakeA=0; }
  flashA = Math.max(0, flashA - dt*2);
}
function fxRender(c){
  c.save(); c.globalCompositeOperation = 'lighter';
  for(const p of parts){ c.globalAlpha = Math.max(0,p.life/p.max); c.fillStyle = p.c; c.fillRect(p.x-p.s/2, p.y-p.s/2, p.s, p.s); }
  c.restore();
  c.save(); c.textAlign='center';
  for(const t of texts){ c.globalAlpha=Math.min(1,t.life*2); c.font='bold '+t.size+'px Orbitron, sans-serif'; c.fillStyle=t.c; c.shadowColor=t.c; c.shadowBlur=10; c.fillText(t.t,t.x,t.y); }
  c.restore();
  if(flashA>0){ c.save(); c.globalAlpha=flashA; c.fillStyle=flashC; c.fillRect(0,0,G.w,G.h); c.restore(); }
}

/* ---------- gold coins: pop out where you score, then fly up to the gold counter ---------- */
const coinsFly = []; let lastX = G.w/2, lastY = G.h/2;
function spawnCoin(x,y,v){
  if(run.tutorial || state!=='play') return;
  const a = -Math.PI/2 + (Math.random()-.5)*1.6, s = 120+Math.random()*120;
  coinsFly.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,v:v||1,spin:Math.random()*6});
}
function coinTarget(){ const r=$('#hudCoinBox').getBoundingClientRect(); return toGame(r.left+r.width/2, r.top+r.height/2); }
function creditCoin(v){
  P.coins += v; run.coinsStage += v; updCoins();
  const el=$('#hudCoinBox'); el.classList.add('bump'); setTimeout(()=>el.classList.remove('bump'),120);
}
function coinUpdate(dt){
  if(!coinsFly.length) return;
  const tg = coinTarget(); let got=0;
  for(let i=coinsFly.length-1;i>=0;i--){ const c=coinsFly[i]; c.t+=dt; c.spin+=dt*9;
    if(c.t<0.55){ c.vy+=380*dt; c.x+=c.vx*dt; c.y+=c.vy*dt; c.vx*=0.96; }
    else { const dx=tg.x-c.x, dy=tg.y-c.y, d=Math.hypot(dx,dy), sp=900+ (c.t-0.55)*1800;
      if(d<sp*dt || c.t>2.5 || c.y<-10){ coinsFly.splice(i,1); got+=c.v; continue; }
      c.x+=dx/d*sp*dt; c.y+=dy/d*sp*dt; } }
  if(got){ creditCoin(got); SFX.coin(); save(); }
}
function flushCoins(){ let v=0; coinsFly.forEach(c=>v+=c.v); coinsFly.length=0; if(v){ P.coins+=v; run.coinsStage+=v; save(); updCoins(); } }
function coinRender(c){
  for(const k of coinsFly){ const w=Math.abs(Math.cos(k.spin))*9+1.5;
    c.save(); c.translate(k.x,k.y); c.shadowColor='#ffd24a'; c.shadowBlur=12;
    const g=c.createRadialGradient(-2,-3,1,0,0,10); g.addColorStop(0,'#fff6c8'); g.addColorStop(.5,'#ffd23f'); g.addColorStop(1,'#b8860b');
    c.fillStyle=g; c.beginPath(); c.ellipse(0,0,w,10,0,0,Math.PI*2); c.fill();
    c.shadowBlur=0; c.strokeStyle='#8a5a00'; c.lineWidth=1.5; c.beginPath(); c.ellipse(0,0,w*0.62,6.2,0,0,Math.PI*2); c.stroke(); c.restore(); }
}

/* ---------- input ---------- */

const Input = {

/* ---------- run state ---------- */
let state = 'loading'; // loading, menu, play, paused, modal
const run = {slot:0, stage:1, score:0, lives:3, tutorial:false, practice:false, coinsStage:0, dropN:0, time:0, extra:{}};
const abLock = G.abilities.map(()=>0); const abBadge = G.abilities.map(()=>null); const abActive = G.abilities.map(()=>false);

const API = {
  get diff(){ return P.diff; }, get diffName(){ return DIFFS[P.diff]; },
  get stage(){ return run.stage; }, get score(){ return run.score; }, get lives(){ return run.lives; },
  get tutorial(){ return run.tutorial; },
  // ---- 100-stage difficulty ----
  // level: EASY stage N = level N. HARD starts at level 50, EXPERT at level 100 (and climb to 199).
  // BEGINNER stage N = level N (stage 50 = HARD level). HARD stage N = level N+49.
  // EXPERT starts at HARD stage 80 (level 129), stays there for 3 stages, then jumps +14 levels EVERY stage.
  get level(){ if(run.tutorial) return 1; const s=run.stage; return P.diff===0? s : P.diff===1? s+49 : 128+s+Math.max(0,s-3)*14; },
  // dk: smooth difficulty 0..4 (level 1 = 0, level 50 = 1 = old HARD, level 100 = 2 = old EXPERT)
  get dk(){ return (API.level-1)/49.5; },
  // dv([easy,hard,expert], cap): value smoothly scaled by level; past old EXPERT it keeps rising at half speed
  // dv([easy,hard,expert], cap, expertCap): keeps climbing past the 3rd value at full speed.
  // On EXPERT the (much higher) expertCap applies, so Expert keeps getting harder until it's unbeatable.
  dv(arr, cap, xcap){ const k=API.dk; let v;
    if(k<=1) v=arr[0]+(arr[1]-arr[0])*k; else if(k<=2) v=arr[1]+(arr[2]-arr[1])*(k-1); else v=arr[2]+(arr[2]-arr[1])*(k-2);
    if(P.diff===2 && xcap!==undefined) cap=xcap;
    // cap = the limit it never passes (a max for rising values, a min for falling values)
    if(cap!==undefined) v = arr[2]>=arr[0] ? Math.min(cap,v) : Math.max(cap,v); return v; },
  get boss(){ return !run.tutorial && run.stage%(P.diff===2?5:10)===0; },
  // content: which stage design to use. 0 = tutorial, 3 = boss design (every 10th stage),
  // 1 = basic design, 2 = advanced design (mixed in from level 4, most stages from level 40)
  get content(){ if(run.tutorial) return 0; if(API.boss) return 3; if(P.diff===2) return 2; const L=API.level; if(L<=3) return 1; if(L>=40) return run.stage%4===1?1:2; return run.stage%2?1:2; },
  input: Input, fx: FX, sfx: SFX, W: G.w, H: G.h,
  // addScore(points, x, y, quiet): with a position, gold coins can pop out there.
  // quiet = no floating "+10" text (used for pellets / blocks).
  addScore(n, x, y, quiet){
    run.score += Math.round(n);
    if(x!==undefined){ lastX=x; lastY=y; if(!quiet) FX.text(x,y,'+'+Math.round(n), G.theme.b, 15);
      if(run.dropN<COIN_CAP && Math.random() < Math.min(1, n/(G.coinPts||100))){ run.dropN++; spawnCoin(x,y,1); } }
    updHud();
  },
  // bonus gold for special moves: pops out at the last scoring spot
  addCoins(n){ for(let i=0;i<n;i++) spawnCoin(lastX+(Math.random()-.5)*20, lastY, 1); },
  setLives(n){ run.lives = n; updHud(); },
  loseLife(){
    if(run.tutorial){ toast('TRY AGAIN!'); G.respawn && G.respawn(); return; }
    run.lives--; updHud(); SFX.hurt(); FX.shake(10); FX.flash('#f24',.35);
    if(run.lives<=0) setTimeout(gameOver, 900); else { toast('LIFE LOST'); G.respawn && G.respawn(); }
  },
  stageClear(){ if(state!=='play') return; if(run.tutorial){ tutFinish(); return; } stageClear(); },
  gameOver(){ if(state==='play') setTimeout(gameOver, 600); },
  event(name){ tutEvent(name); },

  cos(cat){ const id = P.equipped[cat]; return G.shop.find(s=>s.id===id) || G.shop.find(s=>s.cat===cat); },
  badge(i, txt){ abBadge[i]=txt; },

  counter(label, value, level){ setCounter(label, value, level); mpCounter(value); },

/* ---------- HUD + ability bar ---------- */
const hudEl=$('#hud'), abWrap=$('#abilities'), actWrap=$('#actbar');
/* Action buttons (layout 2): holding one = holding its keyboard key (e.g. FIRE = Space), so hold-to-fire games keep
   firing while your thumb stays on it. Many games also edge-detect that key and call useAbility() themselves; while the
   button is held that 2nd call is ignored, so one press is still exactly ONE action (a tap works exactly as before). */
const held={};   // ability id -> Set of pointer ids holding its action button
let shellUse=false, blockedN=0;
const gameUse=G.useAbility;
G.useAbility=function(id){ if(!shellUse && held[id] && held[id].size){ blockedN++; return false; } return gameUse.apply(this, arguments); };
function holdOn(a, pid){ const s=held[a.id]||(held[a.id]=new Set()); s.add(pid); if(a.key) keys[a.key]=true; }
function holdOff(a, pid){ const s=held[a.id]; if(!s) return; if(pid===undefined) s.clear(); else s.delete(pid); if(!s.size && a.key) keys[a.key]=false; }
function releaseHolds(){ ACT.forEach(i=>{ const a=G.abilities[i]; holdOff(a); abEls[i].classList.remove('down'); }); }
const abEls=G.abilities.map((a,i)=>{
  const isAct=ACT.includes(i);
  const b=document.createElement('button'); b.className='ab'+(isAct?' act':''); b.title=a.name+(a.desc?' — '+a.desc:'');
  b.innerHTML=`<span class="ic">${a.icon}</span><div class="cnt"></div><div class="kb">${a.keyLabel||''}</div><div class="nm">${a.name}</div><div class="tm"></div>`;
  b.addEventListener('pointerdown', e=>{ e.preventDefault(); e.stopPropagation(); audioInit();
    if(isAct){ try{ b.setPointerCapture(e.pointerId); }catch(_){} b.classList.add('down'); if(state==='play') holdOn(a, e.pointerId); }
    useAbility(i); if(G.onAbilityDown) G.onAbilityDown(a.id); });
  b.addEventListener('pointerup', e=>{ e.stopPropagation(); if(isAct){ holdOff(a, e.pointerId); b.classList.remove('down'); } if(G.onAbilityUp) G.onAbilityUp(a.id); });
  if(isAct){ const off=e=>{ if(held[a.id]&&held[a.id].has(e.pointerId)){ holdOff(a, e.pointerId); b.classList.remove('down'); if(G.onAbilityUp) G.onAbilityUp(a.id); } };
    b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off); }
  (isAct?actWrap:abWrap).appendChild(b); return b;
});
// long ability names (e.g. THUNDER BUBBLE) shrink to fit their button instead of being cut off
function fitNames(){ if(!SIDE || hudEl.classList.contains('hidden')) return;
  abEls.forEach(b=>{ const n=b.querySelector('.nm'); n.style.fontSize=''; const mw=n.clientWidth, sw=n.scrollWidth;
    if(mw>0 && sw>mw+1){ const fs=parseFloat(getComputedStyle(n).fontSize)||9; n.style.fontSize=Math.max(6, fs*mw/sw*0.97)+'px'; } }); }
window.addEventListener('resize', fitNames);
function useAbility(i){
  if(state!=='play') return; const a=G.abilities[i];
  if(abLock[i]>0) return;
  const paid = a.cd>0 && !run.tutorial;
  if(paid && have(a)<=0){ toast('NO '+a.name+' LEFT'); SFX.bump(); flashShop(); return; }
  if(NET.on&&NET.role==='guest'){ if(paid){ P.abil[a.id]=have(a)-1; save(); } abLock[i]=a.cd>0?1:0; netSendRel({e:'ab',id:a.id}); return; }
  let used; shellUse=true; try{ used=G.useAbility(a.id); } finally{ shellUse=false; }
  if(used!==false){
    if(paid){ P.abil[a.id]=have(a)-1; save(); if(P.abil[a.id]===0) setTimeout(()=>{ if(state==='play') toast('BUY MORE IN 🛒 SHOP'); },900); }
    abLock[i] = a.cd>0 ? 1 : 0; tutEvent('ab_'+a.id);
  }
}
function flashShop(){ const b=$('#btnShopIn'); b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash'); }
function updAbilities(dt){
  const fx=[];
  G.abilities.forEach((a,i)=>{
    if(abLock[i]>0) abLock[i]=Math.max(0,abLock[i]-dt);
    const el=abEls[i], cnt=el.querySelector('.cnt');
    let label, empty=false;
    if(a.cd===0) label = abBadge[i]!==null ? abBadge[i] : (SIDE ? '' : '∞');   // big action buttons: no ∞ badge (shown only when the game sets one)
    else if(run.tutorial) label='FREE';
    else { const h=have(a); label=h; empty=h<=0; }
    if(cnt.textContent!==String(label)) cnt.textContent=label;
    el.classList.toggle('empty', empty);
    el.classList.toggle('ready', !empty && abLock[i]<=0 && !abActive[i]);
    el.classList.toggle('active', !!abActive[i]);
    // live countdown for abilities that last a while (game reports {left,total[,unit]} via G.abTime)
    let r=null; try{ r = G.abTime ? G.abTime(a.id) : null; }catch(e){ r=null; } const tm=el.querySelector('.tm');
    if(r && r.left>0){ el.classList.add('timing'); el.classList.toggle('ending', r.left<=1.5 && r.unit===undefined && !r.label); el.style.setProperty('--p', Math.max(0,Math.min(1,r.left/r.total)));
      const txt = r.label ? r.label : r.unit!==undefined ? Math.ceil(r.left)+r.unit : (r.left<9.95? r.left.toFixed(1) : Math.ceil(r.left))+'s'; if(tm.textContent!==txt) tm.textContent=txt; }
    else if(el.classList.contains('timing')){ el.classList.remove('timing','ending'); tm.textContent=''; }
    if(r && r.left>0) fx.push(`<em class="fx${r.left<=1.5&&r.unit===undefined&&!r.label?' end':''}">${a.icon} ${r.label ? r.label : r.unit!==undefined ? Math.ceil(r.left)+r.unit : (r.left<9.95? r.left.toFixed(1) : Math.ceil(r.left))+'s'}</em>`);
  });
  if(!run.tutorial&&run.doom!==undefined&&isFinite(run.doom)) fx.unshift(`<em class="fx doom${run.doom<5?' end':''}">⏳ EXPERT ${run.doom<9.95?Math.max(0,run.doom).toFixed(1):Math.ceil(run.doom)}s</em>`);
  const fh=fx.join(''); if(fh!==fxKey){ fxKey=fh; $('#hudFx').innerHTML=fh; }
}

/* ---------- tutorial ---------- */
let tutIdx=0, tutTimer=0; const tutSeen=new Set();
function tutShow(){
  const st = G.tutorial[tutIdx]; const el=$('#tut');
  if(!st){ el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  const txt = (Input.touch || matchMedia('(hover:none)').matches) && st.touch ? st.touch : st.text;
  el.innerHTML = `<div class="tt"><span>🎓 PRACTICE ONLY · TUTORIAL ${tutIdx+1}/${G.tutorial.length}</span><button id="tutSkip">SKIP TO REAL GAME ▶▶</button></div><div>${txt}</div>`;
  $('#tutSkip').onclick = e=>{ e.stopPropagation(); SFX.click(); tutFinish(); };
  tutTimer = 0;
}
function tutEvent(name){
  if(!run.tutorial) return; tutSeen.add(name); const st=G.tutorial[tutIdx]; if(!st) return;
  if(st.ev===name){ SFX.pickup(); tutIdx++; if(tutIdx>=G.tutorial.length) tutFinish(); else tutShow(); }
}
function tutUpdate(dt){
  if(!run.tutorial) return; const st=G.tutorial[tutIdx]; if(!st) return;
  tutTimer+=dt; if(st.ev && tutSeen.has(st.ev) && tutTimer>=1.8){ SFX.pickup(); tutIdx++; if(tutIdx>=G.tutorial.length) tutFinish(); else tutShow(); return; }
  if(st.time && tutTimer>=st.time){ tutIdx++; if(tutIdx>=G.tutorial.length) tutFinish(); else tutShow(); }
}
function tutFinish(){
  if(!run.tutorial) return;
  run.tutorial=false; $('#tut').classList.add('hidden'); P.tutDone=true; save(); SFX.clear();
  if(run.practice){ modal(`<h2>TUTORIAL DONE</h2><p>You're ready. Head back to the menu and start a new game.</p><button class="big" data-a="menu">MAIN MENU</button>`, {menu:toMenu}); return; }
  modal(`<h2>TUTORIAL COMPLETE</h2><p>Nice work! Now the real game begins.</p><p>Abilities were free in the tutorial. From now on you have <b>1 of each</b>. Collect 🪙 gold while you play and buy more in the 🛒 SHOP.</p><p><b>Stage 1</b> — ${DIFFS[P.diff]}</p><button class="big" data-a="go">START STAGE 1</button>`, {go:()=>{ run.stage=1; run.score=0; run.lives=startLives(); run.extra={}; writeSlot(); beginStage(); }});
}

/* ---------- support / contact popup ----------
   mailto: links do nothing on PCs with no mail app set up, so the popup shows the
   address, a COPY button, a Gmail web link, and the email-app link as a last option. */
function copyText(txt){
  if(navigator.clipboard && window.isSecureContext){ return navigator.clipboard.writeText(txt).then(()=>true, ()=>legacyCopy(txt)); }
  return Promise.resolve(legacyCopy(txt));
}
function legacyCopy(txt){
  try { const ta=document.createElement('textarea'); ta.value=txt; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,txt.length); const ok=document.execCommand('copy'); ta.remove(); return ok; } catch(e){ return false; }
}
function contactModal(){
  const subj = encodeURIComponent(G.title+' support ('+G.build.split(' ')[0]+')');
  const gmail = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(SUPPORT)}&su=${subj}`;
  const mailto = `mailto:${SUPPORT}?subject=${subj}`;
  modal(`<h2>CONTACT US</h2><p>Found a bug or have an idea? Email us:</p>
    <div class="supaddr" id="supAddr">${esc(SUPPORT)}</div>
    <button class="big" id="supCopy">📋 COPY EMAIL</button>
    <a class="mid suplnk" id="supGmail" href="${gmail}" target="_blank" rel="noopener">OPEN IN GMAIL</a>
    <a class="mid suplnk" id="supApp" href="${mailto}">OPEN MY EMAIL APP</a>
    <p class="supnote">Please tell us which game, your device, and what happened.</p>
    <button class="mid" data-a="x">CLOSE</button>`, {x:()=>{}});
  $('#supCopy').addEventListener('click', ()=>{ SFX.click(); copyText(SUPPORT).then(ok=>{ const b=$('#supCopy'); if(!b) return;
    if(ok){ b.textContent='✓ COPIED!'; SFX.pickup(); } else { b.textContent='Hold the address above to copy'; const r=document.createRange(); r.selectNodeContents($('#supAddr')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
    setTimeout(()=>{ const bb=$('#supCopy'); if(bb) bb.textContent='📋 COPY EMAIL'; }, 2200); }); });
  ['#supGmail','#supApp'].forEach(id=>$(id).addEventListener('click', ()=>SFX.click()));
}

             `Spin the wheel: win x0.5 up to x3 your bet, or lose it (✕).`;

function sMsg(t,cls){ const e=$('#slMsg'); if(e){ e.textContent=t; e.className='slot-msg '+(cls||''); } }
function sCoins(){ const e=$('#slC'); if(e) e.textContent=P.coins.toLocaleString(); }
function slotSpin(){
  if(sSpin||sPend>0) return;
  if(P.coins<sBet){ sMsg('Not enough coins — play to earn more!','lose'); SFX.bump(); return; }
  P.coins-=sBet; save(); sCoins(); sSpin=true; $('#pBack').disabled=true; $('#slSpin').disabled=true; sMsg('Spinning…'); SFX.click();
  if(sTab===2){ const seg=Math.floor(Math.random()*WHEEL.length); const target=(360-(seg*30+15))%360; wheelRot += 360*5 + ((target-(wheelRot%360))+360)%360; $('#wh').style.transform=`rotate(${wheelRot}deg)`;
    let k=0; const tick=setInterval(()=>{ SFX.blip(); if(++k>24) clearInterval(tick); },140);
    setTimeout(()=>finishSpin(Math.floor(sBet*WHEEL[seg]), WHEEL[seg]? 'x'+WHEEL[seg]+'!' : ''),3800); return; }
  const n=sTab===0?3:5, res=Array.from({length:n},sPick), els=[...Array(n)].map((_,i)=>$('#r'+i));

function evalReels(r,els){
  let mult=0, hl=0;

  else { let k=1; while(k<5&&r[k]===r[0]) k++; if(k>=2){ mult=PAYM[k][r[0]]; hl=k; } }

let last = performance.now(), menuT = 0;
function frame(now){
  let dt = (now-last)/1000; last = now; if(dt>0.05) dt=0.05; if(dt<0) dt=0;
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  if(state==='play'){
    run.time += dt;
    if(!(NET.on&&NET.role==='guest')) G.update(dt*assistScale(), API); updAbilities(dt); tutUpdate(dt); fxUpdate(dt); coinUpdate(dt); netTick(dt);
    if(!(NET.on&&NET.role==='guest')) doomTick(dt); mpTick(dt);
  } else if(state==='menu' || state==='loading' || state==='ending'){ menuT+=dt; fxUpdate(dt); }
  ctx.save();

  if(state==='menu'||state==='loading'||state==='ending') (G.attract||defaultAttract)(ctx, menuT, API); else G.render(ctx, API);
  fxRender(ctx);

}
function defaultAttract(c, t){
  c.fillStyle=G.theme.bg; c.fillRect(0,0,G.w,G.h);

  for(let i=0;i<20;i++){ const y=((i*60+t*40)%(G.h+60))-30; c.beginPath(); c.moveTo(0,y); c.lineTo(G.w,y); c.stroke(); }

/* ---------- EXPERT DOOM CLOCK (Andrew, 17 Oct 2026): Expert must be impossible to finish ----------
   From Expert stage 4 every stage has a time limit that no ability can stop or pause:
   stage 4 = 90 s, then 8 s less every stage (stage 10 = 42 s, stage 14 = 10 s) and from stage 15 on just 2 s.
   Run out of time = lose a life (the stage restarts with the same tiny clock), so Expert can't be finished. */
function doomLimit(){ if(P.diff!==2||run.tutorial||run.stage<4) return Infinity; return Math.max(2, 90-(run.stage-4)*8); }
function doomTick(dt){ if(run.tutorial||run.doom===undefined||run.doom===Infinity||!isFinite(run.doom)) return;
  if(run.doom>0){ run.doom-=dt; if(run.doom<=0){ run.doom=0; run.doomPend=1.2; } return; }
  run.doomPend-=dt; if(run.doomPend<=0){ toast('⏳ EXPERT CLOCK RAN OUT!'); run.doom=doomLimit(); run.doomPend=0; API.loseLife(); } }
/* ---------- BEGINNER ASSIST (Andrew, 20 Oct 2026) ----------
   BEGINNER (difficulty 0) stages 1-10 run in gentle slow motion: the game's dt is x0.65 on stage 1, rising evenly to
   x1.0 at stage 11. Beginner games also start with 2 extra lives. Never on HARD / EXPERT, never in the tutorial, never
   in a multiplayer RACE. In PLAY TOGETHER only the host runs the game, so it is applied there once (the guest just draws).
   The Expert clock, ability cooldowns, coins and effects keep real time. */
function assistScale(){ if(P.diff!==0 || run.tutorial || MP.on || !(run.stage>=1) || run.stage>10) return 1; return 0.65 + (run.stage-1)*0.035; }
function startLives(){ return G.lives + (P.diff===0 && !MP.on ? 2 : 0); }

  const x=c.getContext('2d'); x.setTransform(d,0,0,d,0,0); x.fillStyle='#000'; x.fillRect(0,0,pw,ph);
  x.fillStyle=G.theme.bg; x.fillRect(g.cx*k,g.cy*k,g.cw*k,g.ch*k); x.strokeStyle=G.theme.a; x.lineWidth=1; x.strokeRect(g.cx*k+.5,g.cy*k+.5,g.cw*k-1,g.ch*k-1);
  x.fillStyle='rgba(255,255,255,.18)'; x.fillRect(g.cx*k,g.cy*k,g.cw*k,34*k);
  x.fillStyle='rgba(255,255,255,.35)'; x.font='bold '+Math.max(7,Math.round(g.cw*k*0.08))+'px sans-serif'; x.textAlign='center'; x.fillText('GAME', (g.cx+g.cw/2)*k, (g.cy+g.ch/2)*k);
  const C=g.col; x.fillStyle='rgba(20,16,40,.75)'; x.strokeStyle=G.theme.b; x.beginPath(); x.rect(C.x*k,C.y*k,C.w*k,C.h*k); x.fill(); x.stroke();

function netQuit(msg){ netSendRel({e:'nquit'}); netStop(); mpLeave(); if(msg) modal(`<h2>${msg}</h2><button class="big" data-a="m">MENU</button>`,{m:toMenu}); else toMenu(); }

const PAY = { enabled:false,
  buy(pack, done){ if(!PAY.enabled){ toast('💳 GOLD PURCHASES OPEN SOON'); SFX.bump(); return; } /* later: start PayFast / Play Billing checkout here, then on success: */ P.coins+=pack.gold; save(); updCoins(); toast('+'+pack.gold.toLocaleString()+' 🪙 ADDED'); SFX.coin(); done&&done(); } };
function goldStore(back, title){
  const rows=GOLD_PACKS.map((g,i)=>`<div class="abrow gold"><div class="ic">💰</div><div class="tx"><b>${g.gold.toLocaleString()} GOLD</b>${i===2?'Best value':''}</div><button data-gp="${i}" ${PAY.enabled?'':'style="opacity:.75"'}>${g.price}${PAY.enabled?'':' · SOON'}</button></div>`).join('');
  modal(`<h2>${title||'🛒 BUY GOLD'}</h2><div class="abshop"><div class="bal">🪙 <b class="coins">${P.coins.toLocaleString()}</b> GOLD</div>${rows}<p class="note">${PAY.enabled?'Secure payment. Gold is added straight away.':'Gold purchases open soon. You can still earn gold free by playing.'}</p></div><button class="mid" data-a="b">◀ BACK</button>`,{b:back});
  document.querySelectorAll('[data-gp]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); PAY.buy(GOLD_PACKS[+b.dataset.gp], ()=>goldStore(back,title)); }));
}
