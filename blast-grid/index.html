  panel('SHOP', h);
  document.querySelectorAll('[data-buy]').forEach(b=>b.addEventListener('click', ()=>{ const it=G.shop.find(s=>s.id===b.dataset.buy); if(P.coins>=it.cost){ P.coins-=it.cost; P.owned.push(it.id); P.equipped[it.cat]=it.id; save(); SFX.pickup(); shopPanel(); } }));
  document.querySelectorAll('[data-eq]').forEach(b=>b.addEventListener('click', ()=>{ const it=G.shop.find(s=>s.id===b.dataset.eq); P.equipped[it.cat]=it.id; save(); SFX.click(); shopPanel(); }));
}

/* ---------- DOUBLE UP OR LOSS (slots, earned coins only) ---------- */
const SYM=['🍒','🍋','🔔','⭐','💎','7️⃣'], SW=[30,25,18,12,6,4], SWT=95;
const PAY3=[6,10,18,35,100,300], PAYCC=2.5, PAYC=0.6;
const PAYM={2:[0.4,0.4,0.4,0.4,0.4,0.4],3:[4,5,11,18,45,90],4:[14,23,40,75,180,450],5:[55,90,180,360,1100,3600]};
const WHEEL=[0,0.5,2,0,1,2,0,0.5,1,0,1.5,3];
const WCOL=['#2a1a4a','#3a6bff','#ff2bd6','#2a1a4a','#20c070','#ff7b1c','#2a1a4a','#3a6bff','#20c070','#2a1a4a','#a066ff','#ffd23f'];
let sTab=0, sBet=10, sPend=0, sSpin=false, sDbl=0, wheelRot=0;
function sPick(){ let r=Math.random()*SWT; for(let i=0;i<SYM.length;i++){ r-=SW[i]; if(r<0) return i; } return 0; }
function slotsBack(){ if(sSpin) return; if(sPend>0){ P.coins+=sPend; sPend=0; save(); } toMenu(); }
function slotsPanel(){
  const names=['CLASSIC 3','MEGA 5','LUCKY WHEEL'];
  let m='';
  if(sTab===0) m=`<div class="reels">${[0,1,2].map(i=>`<div class="reel" id="r${i}">${SYM[[5,4,3][i]]}</div>`).join('')}</div>`;
  if(sTab===1) m=`<div class="reels five">${[0,1,2,3,4].map(i=>`<div class="reel" id="r${i}">${SYM[i%6]}</div>`).join('')}</div>`;
  if(sTab===2){ const grad=WHEEL.map((_,i)=>`${WCOL[i]} ${i*30}deg ${(i+1)*30}deg`).join(','); m=`<div class="wheel-box"><div class="wheel-ptr"></div><div class="wheel" id="wh" style="background:conic-gradient(${grad});transform:rotate(${wheelRot}deg)"><div class="wheel-lbl">${WHEEL.map((v,i)=>`<span style="transform:rotate(${i*30+15}deg);transform-origin:18px 104px">${v?'x'+v:'✕'}</span>`).join('')}</div></div></div>`; }
  const pt = sTab===0? `3 in a row: 🍒x6 · 🍋x10 · 🔔x18 · ⭐x35 · 💎x100 · 7️⃣x300<br>🍒🍒 first two: x2.5 · 🍒 first: x0.6` :
             sTab===1? `Match from the left — any 2: x0.4<br>3 / 4 / 5 in a row: 🍒 4/14/55 · 🍋 5/23/90 · 🔔 11/40/180<br>⭐ 18/75/360 · 💎 45/180/1100 · 7️⃣ 90/450/3600` :
             `Spin the wheel: win x0.5 up to x3 your bet, or lose it (✕).`;
  const h=`<div class="slot-wrap">
    <div class="tabs" style="width:100%">${names.map((n,i)=>`<button data-st="${i}" class="${i===sTab?'on':''}">${n}</button>`).join('')}</div>
    <div class="slot-coins coins">🪙 <span id="slC">${P.coins.toLocaleString()}</span></div>
    ${m}
    <div class="bets">${[10,25,50,100].map(b=>`<button data-bet="${b}" class="${b===sBet?'on':''}">BET ${b}</button>`).join('')}</div>
    <div class="slot-msg" id="slMsg">${sPend>0?'':'Good luck!'}</div>
    <button class="big casino" id="slSpin" style="width:100%">🎰 SPIN · 🪙${sBet}</button>
    <div class="dbl hidden" id="dbl"><div>WIN <b class="coins" id="dAmt">0</b> — <b>DOUBLE UP OR LOSS?</b></div><div class="coin" id="coinEl">?</div>
      <div class="row" style="width:100%"><button class="mid" id="dH">HEADS (x2)</button><button class="mid" id="dT">TAILS (x2)</button></div><button class="big" id="dC" style="width:100%">COLLECT</button></div>
    <div class="paytable">${pt}</div>
    <p style="font-size:11px;opacity:.55;text-align:center;font-family:Segoe UI,sans-serif">Uses coins you earned by playing only. Coins can't be bought for this. Just for fun: on average the machines keep about 8% of what's bet.</p>
  </div>`;
  panel('DOUBLE UP OR LOSS', h, slotsBack);
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{ if(sSpin||sPend>0) return; SFX.click(); sTab=+b.dataset.st; slotsPanel(); });
  document.querySelectorAll('[data-bet]').forEach(b=>b.onclick=()=>{ if(sSpin||sPend>0) return; SFX.click(); sBet=+b.dataset.bet; slotsPanel(); });
  $('#slSpin').onclick=slotSpin;
  $('#dH').onclick=()=>dblFlip(0); $('#dT').onclick=()=>dblFlip(1); $('#dC').onclick=dblCollect;
  if(sPend>0) showDbl();
}
function sMsg(t,cls){ const e=$('#slMsg'); if(e){ e.textContent=t; e.className='slot-msg '+(cls||''); } }
function sCoins(){ const e=$('#slC'); if(e) e.textContent=P.coins.toLocaleString(); }
function slotSpin(){
  if(sSpin||sPend>0) return;
  if(P.coins<sBet){ sMsg('Not enough coins — play to earn more!','lose'); SFX.bump(); return; }
  P.coins-=sBet; save(); sCoins(); sSpin=true; $('#pBack').disabled=true; $('#slSpin').disabled=true; sMsg('Spinning…'); SFX.click();
  if(sTab===2){ const seg=Math.floor(Math.random()*WHEEL.length); const target=(360-(seg*30+15))%360; wheelRot += 360*5 + ((target-(wheelRot%360))+360)%360; $('#wh').style.transform=`rotate(${wheelRot}deg)`;
    let k=0; const tick=setInterval(()=>{ SFX.blip(); if(++k>24) clearInterval(tick); },140);
    setTimeout(()=>finishSpin(Math.floor(sBet*WHEEL[seg]), WHEEL[seg]? 'x'+WHEEL[seg]+'!' : ''),3800); return; }
  const n=sTab===0?3:5, res=Array.from({length:n},sPick), els=[...Array(n)].map((_,i)=>$('#r'+i));
  els.forEach(e=>{ e.classList.add('spin'); e.classList.remove('win'); });
  const iv=setInterval(()=>els.forEach((e,i)=>{ if(e.classList.contains('spin')) e.textContent=SYM[Math.floor(Math.random()*6)]; }),70);
  els.forEach((e,i)=>setTimeout(()=>{ e.classList.remove('spin'); e.textContent=SYM[res[i]]; SFX.bump(); if(i===n-1){ clearInterval(iv); evalReels(res,els); } }, 600+i*(n===3?350:250)));
}
function evalReels(r,els){
  let mult=0, hl=0;
  if(r.length===3){ if(r[0]===r[1]&&r[1]===r[2]){ mult=PAY3[r[0]]; hl=3; } else if(r[0]===0&&r[1]===0){ mult=PAYCC; hl=2; } else if(r[0]===0){ mult=PAYC; hl=1; } }
  else { let k=1; while(k<5&&r[k]===r[0]) k++; if(k>=2){ mult=PAYM[k][r[0]]; hl=k; } }
  for(let i=0;i<hl;i++) els[i].classList.add('win');
  finishSpin(Math.floor(sBet*mult), mult>=20?'JACKPOT!':mult?'x'+mult:'');
}
function finishSpin(win,label){
  sSpin=false; const pb=$('#pBack'); if(pb) pb.disabled=false; const sb=$('#slSpin'); if(sb) sb.disabled=false;
  if(win>0){ sPend=win; sDbl=0; SFX.clear(); sMsg(`${label} YOU WIN ${win} 🪙`,'win'); showDbl(); }
  else { SFX.over(); sMsg('No win this time','lose'); }
}
function showDbl(){ const d=$('#dbl'); if(!d) return; d.classList.remove('hidden'); $('#dAmt').textContent=sPend; $('#slSpin').disabled=true;
  const can=sDbl<5; $('#dH').disabled=!can; $('#dT').disabled=!can; if(!can) sMsg('Max 5 double-ups — collect your coins!','win'); }
function dblFlip(pickSide){
  if(sPend<=0) return; const c=$('#coinEl'); c.classList.remove('flip'); void c.offsetWidth; c.classList.add('flip'); $('#dH').disabled=$('#dT').disabled=$('#dC').disabled=true; SFX.power();
  const side=Math.random()<0.5?0:1;
  setTimeout(()=>{ c.textContent=side?'T':'H'; $('#dC').disabled=false;
    if(side===pickSide){ sPend*=2; sDbl++; SFX.clear(); sMsg(`DOUBLED! ${sPend} 🪙`,'win'); showDbl(); }
    else { sMsg(`LOSS! The coin was ${side?'TAILS':'HEADS'}`,'lose'); SFX.hurt(); sPend=0; $('#dbl').classList.add('hidden'); $('#slSpin').disabled=false; } },900);
}
function dblCollect(){ if(sPend<=0) return; P.coins+=sPend; sMsg(`Collected ${sPend} 🪙`,'win'); sPend=0; save(); sCoins(); SFX.pickup(); $('#dbl').classList.add('hidden'); $('#slSpin').disabled=false; }

/* ---------- game flow ---------- */
function writeSlot(){ P.slots[run.slot] = {stage:run.stage, score:run.score, lives:run.lives, diff:P.diff, t:Date.now(), extra:run.extra}; save(); }
function newGame(i){
  run.slot=i; run.stage=1; run.score=0; run.lives=G.lives; run.extra={}; writeSlot();
  starterKit();
  if(!P.tutDone) startTutorial(false); else beginStage();
}
function continueSlot(i){
  const s=P.slots[i]; run.slot=i; run.stage=s.stage; run.score=s.score; run.lives=s.lives; run.extra=JSON.parse(JSON.stringify(s.extra||{})); P.diff=s.diff; save(); beginStage();
}
function resetAbilities(){ cntKey=''; $('#hudCounter').className='ctr hidden'; abLock.fill(0); abBadge.fill(null); abActive.fill(false); coinsFly.length=0; run.coinsStage=0; run.dropN=0; }
function startTutorial(practice){
  run.tutorial=true; run.practice=practice; run.score=0; run.lives=G.lives; tutIdx=0; tutSeen.clear(); resetAbilities();
  enterPlay(); G.startStage(0, API); tutShow(); toast('TUTORIAL');
}
function beginStage(){
  run.tutorial=false; resetAbilities(); enterPlay(); $('#tut').classList.add('hidden');
  G.startStage(run.stage, API); toast('STAGE '+run.stage);
  const intro = (G.stageIntro && G.stageIntro[run.stage]) || (run.stage%10===0 ? (G.bossName||'BOSS STAGE!') : (G.contentIntro && G.contentIntro[API.content]) || null);
  if(intro) setTimeout(()=>{ if(state==='play') toast(intro); }, 1500);
}
function enterPlay(){ closeModal(); show(null); hudEl.classList.remove('hidden'); state='play'; updHud(); updAbilities(0); last=performance.now(); }
function pauseGame(){
  if(state!=='play') return; state='paused'; joy.active=false; joyEl.classList.add('hidden');
  modal(`<h2>PAUSED</h2><p>${run.tutorial?'Tutorial':'Stage '+run.stage+' · '+DIFFS[P.diff]}</p><button class="big" data-a="r">▶ RESUME</button><button class="mid" data-a="shop">🛒 ABILITY SHOP</button><button class="mid" data-a="s">${P.sound?'🔊 SOUND ON':'🔇 SOUND OFF'}</button><button class="mid" data-a="h">HOW TO PLAY</button><button class="mid" data-a="e" style="color:#ff6b8a">END GAME</button>`,
    {r:resumeGame, shop:()=>{ flushCoins(); shopModal(pauseAgain,'◀ BACK'); }, s:()=>{P.sound=!P.sound;save();pauseAgain();}, h:()=>{ modal(`<h2>HOW TO PLAY</h2><div style="text-align:left;max-height:50vh;overflow:auto;font-family:Segoe UI,sans-serif;font-size:14px">${G.howto}${HOW_BUTTONS()}</div><button class="big" data-a="b">BACK</button>`, {b:pauseAgain}); }, e:endGamePrompt});
}
function pauseAgain(){ state='play'; pauseGame(); }
function resumeGame(){ closeModal(); state='play'; last=performance.now(); }
function endGamePrompt(){
  if(state==='play'){ state='paused'; }
  if(run.tutorial){ modal(`<h2>LEAVE TUTORIAL?</h2><p>You can replay it any time from How to Play.</p><button class="big" data-a="y">LEAVE</button><button class="mid" data-a="n">KEEP PLAYING</button>`, {y:()=>{ if(!run.practice){ P.tutDone=true; save(); } toMenu(); }, n:resumeGame}); return; }
  modal(`<h2>END GAME?</h2><p>Your game is saved in <b>Slot ${run.slot+1}</b> at the start of Stage ${run.stage}. Continue it later from the menu. Gold and abilities you have are kept.</p><button class="big" data-a="y">SAVE &amp; EXIT</button><button class="mid" data-a="n">KEEP PLAYING</button>`, {y:toMenu, n:resumeGame});
}
function stageClear(){
  state='modal'; SFX.clear(); flushCoins();
  const coins = Math.round((20 + Math.min(run.stage,60)*1.5) * (1 + P.diff*0.5)) + (run.stage%10===0? 50 : 0), got=run.coinsStage;
  P.coins += coins; save(); updCoins();
  const bonus = G.stageBonus ? G.stageBonus(API) : 0; if(bonus) run.score += bonus;
  if(run.stage >= G.stages){ victory(coins, bonus); return; }
  run.stage++; writeSlot();
  const showClear = ()=>{ state='modal'; modal(`<h2>STAGE ${run.stage-1} CLEAR!</h2>${(run.stage-1)%10===0?'<p class="coins">🏆 BOSS BEATEN! +50 🪙</p>':''}${bonus?`<p>Stage bonus +${bonus.toLocaleString()}</p>`:''}<div class="stat">${run.score.toLocaleString()}</div><p class="coins">🪙 ${got} collected · +${coins} clear bonus</p><p style="font-size:13px">Gold: 🪙 ${P.coins.toLocaleString()} · Progress saved to Slot ${run.slot+1}</p><button class="big" data-a="n">STAGE ${run.stage} ▶</button><button class="mid abil" data-a="shop">⚡ TOP UP ABILITIES · ${BUY.map(a=>a.icon+have(a)).join(' ')}</button><button class="mid" data-a="m">SAVE &amp; MENU</button>`,
    {n:()=>{ if(G.betweenStages) G.betweenStages(API, beginStage); else beginStage(); }, shop:()=>shopModal(showClear,'◀ BACK'), m:toMenu}); };
  showClear();
}
function nameEntry(title, sub, win){
  P.slots[run.slot]=null; save();
  modal(`<h2>${title}</h2><p>${sub}</p><div class="stat">${run.score.toLocaleString()}</div><p>${DIFFS[P.diff]} · reached stage ${run.stage}</p><input id="nm" maxlength="10" placeholder="YOUR NAME" value="${esc(P.lastName)}"><button class="big" data-a="s">SAVE SCORE</button><button class="mid" data-a="k">SKIP</button>`,
    {s:()=>{ submitScore(win); afterRun(); }, k:afterRun});
  const inp=$('#nm'); let nameVal=P.lastName; inp.addEventListener('input',()=>nameVal=inp.value); setTimeout(()=>{ try{ inp.focus(); }catch(e){} },50);
  inp.addEventListener('keydown', e=>{ e.stopPropagation(); if(e.key==='Enter'){ submitScore(win); closeModal(); afterRun(); } });
  function submitScore(w){ const name=(nameVal||'PLAYER').trim().toUpperCase().slice(0,10)||'PLAYER'; P.lastName=name; const l=P.scores[P.diff]=P.scores[P.diff]||[]; l.push({name, score:run.score, stage:run.stage, win:!!w, t:Date.now()}); l.sort((a,b)=>b.score-a.score); l.length=Math.min(l.length,10); save(); }
}
function afterRun(){ modal(`<h2>WHAT NEXT?</h2><button class="big" data-a="p">PLAY AGAIN</button><button class="mid abil" data-a="a">⚡ ABILITIES</button><button class="mid" data-a="s">TOP SCORES</button><button class="mid" data-a="m">MAIN MENU</button>`, {p:()=>newGame(run.slot), a:()=>{ toMenu(); abilPanel(); }, s:()=>{ toMenu(); scoresPanel(P.diff); }, m:toMenu}); }
function gameOver(){
  if(state==='modal' || state==='menu') return; state='modal'; SFX.over(); flushCoins();
  const coins = Math.floor(run.score/500), got=run.coinsStage; P.coins += coins; save();
  nameEntry('GAME OVER', `🪙 ${got} collected this stage · +${coins} score bonus`, false);
}
function victory(coins, bonus){
  const done=()=>nameEntry('YOU WIN!', `All ${G.stages} stages cleared on ${DIFFS[P.diff]}! +${coins} 🪙${bonus?' · bonus +'+bonus.toLocaleString():''}`, true);
  playEnding(done);
}
/* ---------- the 1-minute story ending (after stage 100) ---------- */
let endT=null;
function playEnding(done){
  state='ending'; closeModal(); hudEl.classList.add('hidden'); menuT=0;
  const el=$('#screen-ending'); const lines=G.ending||['THE END'];
  el.innerHTML=`<button class="endskip" id="endSkip">SKIP ▶▶</button><div class="crawl"><div class="crawl-in" id="crawl"><div class="endlogo">${G.titleHTML||G.title}</div>${lines.map(l=>l.startsWith('#')?`<h3>${l.slice(1)}</h3>`:`<p>${l}</p>`).join('')}<div class="endthe">THE END</div><p class="endthanks">Thanks for playing ${esc(G.title)}.</p></div></div><div class="endbar"><i id="endFill"></i></div>`;
  show('#screen-ending'); SFX.clear();
  const DUR=60; let t0=performance.now();
  const finish=()=>{ if(state!=='ending') return; clearInterval(endT); state='modal'; show(null); done(); };
  $('#endSkip').onclick=()=>{ SFX.click(); finish(); };
  // soft chime every few seconds
  let lastBeat=0;
  endT=setInterval(()=>{ const t=(performance.now()-t0)/1000; $('#endFill').style.width=Math.min(100,t/DUR*100)+'%';
    if(t-lastBeat>6){ lastBeat=t; tone(523,784,.4,'triangle',.03); setTimeout(()=>tone(659,988,.5,'triangle',.03),300); }
    if(t>=DUR) finish(); },100);
}
function showChoice(title, opts, cb){
  state='modal';
  modal(`<h2>${title}</h2>${opts.map((o,i)=>`<button class="choice" data-a="c${i}"><b>${o.name}</b>${o.desc}</button>`).join('')}`,
    Object.fromEntries(opts.map((o,i)=>['c'+i, ()=>cb(i)])));
}

/* ---------- main loop ---------- */
let last = performance.now(), menuT = 0;
function frame(now){
  let dt = (now-last)/1000; last = now; if(dt>0.05) dt=0.05; if(dt<0) dt=0;
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  if(state==='play'){
    run.time += dt;
    G.update(dt, API); updAbilities(dt); tutUpdate(dt); fxUpdate(dt); coinUpdate(dt);
  } else if(state==='menu' || state==='loading' || state==='ending'){ menuT+=dt; fxUpdate(dt); }
  ctx.save();
  if(shakeA>0){ ctx.translate((Math.random()-.5)*shakeA, (Math.random()-.5)*shakeA); }
  if(state==='menu'||state==='loading'||state==='ending') (G.attract||defaultAttract)(ctx, menuT, API); else G.render(ctx, API);
  fxRender(ctx);
  if(state==='play'||state==='paused'||state==='modal') coinRender(ctx);
  ctx.restore();
  requestAnimationFrame(frame);
}
function defaultAttract(c, t){
  c.fillStyle=G.theme.bg; c.fillRect(0,0,G.w,G.h);
  c.strokeStyle=G.theme.a; c.globalAlpha=.25; c.lineWidth=1;
  for(let i=0;i<20;i++){ const y=((i*60+t*40)%(G.h+60))-30; c.beginPath(); c.moveTo(0,y); c.lineTo(G.w,y); c.stroke(); }
  c.globalAlpha=1;
}

/* ---------- loading ---------- */
let loadP=0;
const loadIv=setInterval(()=>{ loadP=Math.min(100, loadP+7+Math.random()*12); $('#loadFill').style.width=loadP+'%';
  if(loadP>=100){ clearInterval(loadIv); $('#tapStart').style.opacity=1; $('#tapStart').style.animationPlayState='running'; $('#screen-loading').addEventListener('pointerdown', ()=>{ audioInit(); SFX.power(); toMenu(); }, {once:true}); } }, 110);
window.addEventListener('keydown', function k(e){ if(state==='loading' && loadP>=100){ audioInit(); SFX.power(); toMenu(); window.removeEventListener('keydown',k); } });
document.title = G.title;
$('#ldTitle').innerHTML = G.titleHTML || G.title; $('#ldTag').textContent = G.tagline;
$('#mTitle').innerHTML = G.titleHTML || G.title;
$('#ver').innerHTML = `<span class="bld">${esc(G.build)}</span><button class="suplink" id="supBtn">✉ ${esc(SUPPORT)}</button>`;
$('#supBtn').addEventListener('click', ()=>{ SFX.click(); contactModal(); });
if(G.init) G.init(API);
requestAnimationFrame(frame);
window.__rmx = {P, run, API, get state(){return state;}, stageClear:()=>stageClear(), toMenu, newGame, useAbility, inGameShop, playEnding, continueSlot, beginStage, get coinsFly(){return coinsFly;}, get layout(){return {scale,offX,offY};}};
})();

</script>
