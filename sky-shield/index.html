  modal(`<h2>${title}</h2><p>${sub}</p><div class="stat">${run.score.toLocaleString()}</div><p>${DIFFS[P.diff]} · reached stage ${run.stage}</p><input id="nm" maxlength="10" placeholder="YOUR NAME" value="${esc(P.lastName)}"><button class="big" data-a="s">SAVE SCORE</button><button class="mid" data-a="k">SKIP</button>`,
    {s:()=>{ submitScore(win); afterRun(); }, k:afterRun});
  const inp=$('#nm'); let nameVal=P.lastName; inp.addEventListener('input',()=>nameVal=inp.value); setTimeout(()=>{ try{ inp.focus(); }catch(e){} },50);
  inp.addEventListener('keydown', e=>{ e.stopPropagation(); if(e.key==='Enter'){ submitScore(win); closeModal(); afterRun(); } });
  function submitScore(w){ const name=(nameVal||'PLAYER').trim().toUpperCase().slice(0,10)||'PLAYER'; P.lastName=name; const l=P.scores[P.diff]=P.scores[P.diff]||[]; l.push({name, score:run.score, stage:run.stage, win:!!w, t:Date.now()}); l.sort((a,b)=>b.score-a.score); l.length=Math.min(l.length,10); save(); }
}
function afterRun(){ modal(`<h2>WHAT NEXT?</h2><button class="big" data-a="p">PLAY AGAIN</button><button class="mid abil" data-a="a">⚡ ABILITIES</button><button class="mid" data-a="s">TOP SCORES</button><button class="mid" data-a="m">MAIN MENU</button>`, {p:()=>newGame(run.slot), a:()=>{ toMenu(); abilPanel(); }, s:()=>{ toMenu(); scoresPanel(P.diff); }, m:toMenu}); }
function gameOver(){
  if(state==='modal' || state==='menu') return; state='modal'; SFX.over(); flushCoins();
  const coins = Math.floor(run.score/500), got=run.coinsStage; P.coins += coins; save();
  nameEntry('GAME OVER', `🪙 ${got} collected this stage · +${coins} score bonus`, false);
}
function victory(coins, bonus){
  const done=()=>nameEntry('YOU WIN!', `All ${G.stages} stages cleared on ${DIFFS[P.diff]}! +${coins} 🪙${bonus?' · bonus +'+bonus.toLocaleString():''}`, true);
  playEnding(done);
}
/* ---------- the finale + story ending (after stage 100) ----------
   Each difficulty has its own story. Harder = longer ending and a bigger show:
   BEGINNER ~1 min (bronze medal), HARD ~1.5 min (silver), EXPERT ~2.5 min (gold crown, "LEGEND"). */
let endT=null, fwRaf=null;
const MEDAL=[{icon:'🥉',name:'BRONZE',title:'CHAMPION',col:'#e39a5b',dur:60,rockets:1.2},{icon:'🥈',name:'SILVER',title:'HERO',col:'#dfe6f2',dur:90,rockets:2},{icon:'👑',name:'GOLD',title:'LEGEND',col:'#ffd23f',dur:150,rockets:3.5}];
function endingLines(){ const e=G.ending; if(!e) return ['THE END']; if(Array.isArray(e)) return e; return e[P.diff]||e[0]; }
function playEnding(done){
  state='ending'; closeModal(); hudEl.classList.add('hidden'); menuT=0;
  const M=MEDAL[P.diff], DUR=M.dur, INTRO=8, lines=endingLines();
  const mins=Math.floor(run.time/60), secs=Math.floor(run.time%60);
  const el=$('#screen-ending');
  el.className='screen end-d'+P.diff;
  el.innerHTML=`<canvas id="fw"></canvas>
    <button class="endskip" id="endSkip">SKIP ▶▶</button>
    <div class="finale" id="finale">
      <div class="medal" style="--mc:${M.col}"><span>${M.icon}</span></div>
      <div class="fin-t1">YOU BEAT</div>
      <div class="fin-t2">${G.titleHTML||G.title}</div>
      <div class="fin-t3" style="color:${M.col}">${DIFFS[P.diff]} · ${M.name} ${M.title}</div>
      <div class="fin-stats"><div><b>${run.score.toLocaleString()}</b><span>SCORE</span></div><div><b>${G.stages}</b><span>STAGES</span></div><div><b>${Math.max(0,run.lives)}</b><span>LIVES LEFT</span></div></div>
      ${P.diff===2?'<div class="fin-rare">Almost nobody will ever see this screen.</div>':''}
    </div>
    <div class="crawl"><div class="crawl-in" id="crawl" style="animation-duration:${DUR-INTRO-2}s;animation-delay:${INTRO}s"><div class="endlogo">${G.titleHTML||G.title}</div><div class="endsub" style="color:${M.col}">${['THE BEGINNER ENDING','THE HARD ENDING','THE TRUE ENDING'][P.diff]}</div>${lines.map(l=>l.startsWith('#')?`<h3>${l.slice(1)}</h3>`:`<p>${l}</p>`).join('')}<div class="endthe">THE END</div><div class="endmedal">${M.icon}</div><p class="endthanks">${P.diff<2?`Think you can handle ${DIFFS[P.diff+1]}? A different story is waiting.`:'You are one of the very few. Thank you for playing '+esc(G.title)+'.'}</p></div></div>
    <div class="endbar"><i id="endFill"></i></div>`;
  show('#screen-ending');
  // ---- fireworks ----
  const fw=$('#fw'), fc=fw.getContext('2d'); const fr=()=>{ fw.width=innerWidth; fw.height=innerHeight; }; fr();
  const rockets=[], sparks=[]; const cols=[G.theme.a,G.theme.b,M.col,'#ffffff','#ff5a8a','#5affc8'];
  let lastT=performance.now(), spawn=0;
  function boom(x,y,big){ const c=cols[Math.floor(Math.random()*cols.length)], c2=cols[Math.floor(Math.random()*cols.length)], n=big?160:90;
    for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=(big?380:240)*(0.25+Math.random()*0.75); sparks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1.4+Math.random()*0.8,m:2.2,c:i%3?c:c2}); }
    if(big){ tone(90,40,.5,'sawtooth',.05); noise(.4,.08); } else tone(200+Math.random()*300,80,.25,'triangle',.03); }
  function fwLoop(now){ const dt=Math.min(0.05,(now-lastT)/1000); lastT=now; const t=(now-t0)/1000;
    const W=fw.width, H=fw.height; fc.globalCompositeOperation='source-over'; fc.fillStyle='rgba(3,2,10,0.22)'; fc.fillRect(0,0,W,H);
    const rate = t<INTRO ? M.rockets*2.2 : M.rockets*(t>DUR-12?2:0.7);
    spawn+=dt*rate; while(spawn>=1){ spawn--; rockets.push({x:W*(0.1+Math.random()*0.8),y:H+10,vy:-(H*0.9+Math.random()*H*0.4),tx:H*(0.12+Math.random()*0.35)}); }
    fc.globalCompositeOperation='lighter';
    for(let i=rockets.length-1;i>=0;i--){ const r=rockets[i]; r.y+=r.vy*dt; r.vy*=0.985; fc.fillStyle='#fff'; fc.fillRect(r.x-1.5,r.y,3,10);
      if(r.y<=r.tx || r.vy>-60){ rockets.splice(i,1); boom(r.x,r.y, P.diff===2 && Math.random()<0.3); } }
    for(let i=sparks.length-1;i>=0;i--){ const p=sparks[i]; p.l-=dt; if(p.l<=0){ sparks.splice(i,1); continue; } p.vy+=160*dt; p.vx*=0.985; p.vy*=0.985; p.x+=p.vx*dt; p.y+=p.vy*dt;
      fc.globalAlpha=Math.min(1,p.l/p.m*1.6); fc.fillStyle=p.c; fc.fillRect(p.x-1.5,p.y-1.5,3,3); }
    fc.globalAlpha=1; if(sparks.length>4000) sparks.splice(0,sparks.length-4000);
    fwRaf=requestAnimationFrame(fwLoop); }
  // ---- victory music: a little fanfare, then a looping arpeggio ----
  const FAN=[[523,0],[659,.18],[784,.36],[1047,.6],[784,.9],[1047,1.05],[1319,1.3]];
  FAN.forEach(([f,d])=>setTimeout(()=>{ tone(f,f*1.01,.35,'square',.05); tone(f/2,f/2,.35,'triangle',.05); },d*1000));
  if(P.diff===2) setTimeout(()=>{ [1047,1319,1568,2093].forEach((f,i)=>setTimeout(()=>tone(f,f,.8,'triangle',.05),i*120)); FX.shake&&0; },1800);
  const ARP=[[262,330,392,523],[220,277,330,440],[175,220,262,349],[196,247,294,392]];
  let beat=0, lastBeat=0; const bpm=[0.34,0.3,0.26][P.diff];
  let t0=performance.now(); fwRaf=requestAnimationFrame(fwLoop);
  const finish=()=>{ if(state!=='ending') return; clearInterval(endT); cancelAnimationFrame(fwRaf); state='modal'; show(null); done(); };
  $('#endSkip').onclick=()=>{ SFX.click(); finish(); };
  setTimeout(()=>{ const f=$('#finale'); if(f) f.classList.add('out'); }, INTRO*1000);
  endT=setInterval(()=>{ const t=(performance.now()-t0)/1000; $('#endFill').style.width=Math.min(100,t/DUR*100)+'%';
    if(t>2.2 && t-lastBeat>=bpm){ lastBeat=t; const ch=ARP[Math.floor(beat/8)%4], f=ch[beat%4]*(beat%8>=4?2:1); tone(f,f,.22,'triangle',.022); if(beat%4===0) tone(ch[0]/2,ch[0]/2,.5,'sine',.03); beat++; }
    if(t>=DUR) finish(); },40);
}
function showChoice(title, opts, cb){
  state='modal';
  modal(`<h2>${title}</h2>${opts.map((o,i)=>`<button class="choice" data-a="c${i}"><b>${o.name}</b>${o.desc}</button>`).join('')}`,
    Object.fromEntries(opts.map((o,i)=>['c'+i, ()=>cb(i)])));
}

/* ---------- main loop ---------- */
let last = performance.now(), menuT = 0;
function frame(now){
  let dt = (now-last)/1000; last = now; if(dt>0.05) dt=0.05; if(dt<0) dt=0;
  ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  if(state==='play'){
    run.time += dt;
    G.update(dt, API); updAbilities(dt); tutUpdate(dt); fxUpdate(dt); coinUpdate(dt);
  } else if(state==='menu' || state==='loading' || state==='ending'){ menuT+=dt; fxUpdate(dt); }
  ctx.save();
  if(shakeA>0){ ctx.translate((Math.random()-.5)*shakeA, (Math.random()-.5)*shakeA); }
  if(state==='menu'||state==='loading'||state==='ending') (G.attract||defaultAttract)(ctx, menuT, API); else G.render(ctx, API);
  fxRender(ctx);
  if(state==='play'||state==='paused'||state==='modal') coinRender(ctx);
  ctx.restore();
  requestAnimationFrame(frame);
}
function defaultAttract(c, t){
  c.fillStyle=G.theme.bg; c.fillRect(0,0,G.w,G.h);
  c.strokeStyle=G.theme.a; c.globalAlpha=.25; c.lineWidth=1;
  for(let i=0;i<20;i++){ const y=((i*60+t*40)%(G.h+60))-30; c.beginPath(); c.moveTo(0,y); c.lineTo(G.w,y); c.stroke(); }
  c.globalAlpha=1;
}

/* ---------- loading ---------- */
let loadP=0;
const loadIv=setInterval(()=>{ loadP=Math.min(100, loadP+7+Math.random()*12); $('#loadFill').style.width=loadP+'%';
  if(loadP>=100){ clearInterval(loadIv); $('#tapStart').style.opacity=1; $('#tapStart').style.animationPlayState='running'; $('#screen-loading').addEventListener('pointerdown', ()=>{ audioInit(); SFX.power(); toMenu(); }, {once:true}); } }, 110);
window.addEventListener('keydown', function k(e){ if(state==='loading' && loadP>=100){ audioInit(); SFX.power(); toMenu(); window.removeEventListener('keydown',k); } });
document.title = G.title;
$('#ldTitle').innerHTML = G.titleHTML || G.title; $('#ldTag').textContent = G.tagline;
$('#mTitle').innerHTML = G.titleHTML || G.title;
$('#ver').innerHTML = `<span class="bld">${esc(G.build)}</span><button class="suplink" id="supBtn">✉ ${esc(SUPPORT)}</button>`;
$('#supBtn').addEventListener('click', ()=>{ SFX.click(); contactModal(); });
if(G.init) G.init(API);
requestAnimationFrame(frame);
window.__rmx = {P, run, API, get state(){return state;}, stageClear:()=>stageClear(), toMenu, newGame, useAbility, inGameShop, playEnding, continueSlot, beginStage, get coinsFly(){return coinsFly;}, get layout(){return {scale,offX,offY};}};
})();

</script>
</body>
