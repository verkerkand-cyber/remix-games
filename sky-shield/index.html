<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05030f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="build" content="BUILD-SS-1.6 · 2026-09-27">
<title>Sky Shield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:#fff;font-family:'Orbitron','Segoe UI',system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;overflow:hidden}
#game{position:absolute;left:0;top:0;display:block}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;color:#fff}
/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;z-index:20;overflow-y:auto}
.screen.dim{background:rgba(3,2,10,.55)}
#screen-loading{background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--a) 22%,transparent),var(--bg) 70%);z-index:60}
.logo{font-size:clamp(34px,9vw,68px);font-weight:900;letter-spacing:.06em;text-align:center;line-height:1.05;
  background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px color-mix(in srgb,var(--a) 70%,transparent))}
.tag{opacity:.8;margin-top:8px;letter-spacing:.2em;font-size:12px;text-align:center;text-transform:uppercase}
.loadbar{width:min(320px,80vw);height:10px;border-radius:6px;background:rgba(255,255,255,.08);margin-top:34px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.loadbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 0 16px var(--b);transition:width .12s}
.tapstart{margin-top:26px;font-size:16px;letter-spacing:.25em;animation:blink 1.1s infinite;opacity:0}
@keyframes blink{50%{opacity:.25}}
.menu-card{width:min(440px,94vw);display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:18px;border-radius:20px;
  background:rgba(8,6,22,.72);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(6px);box-shadow:0 0 40px color-mix(in srgb,var(--a) 25%,transparent)}
.menu-card .logo{font-size:clamp(30px,8vw,46px);margin-bottom:2px}
.diff{display:flex;gap:6px;background:rgba(255,255,255,.06);padding:5px;border-radius:14px}
.diff button{flex:1;padding:10px 4px;border-radius:10px;background:transparent;font-size:13px;font-weight:700;letter-spacing:.08em;opacity:.65}
.diff button.on{background:linear-gradient(90deg,var(--a),var(--b));opacity:1;box-shadow:0 0 14px color-mix(in srgb,var(--b) 60%,transparent);color:#050510}
.big{padding:15px;border-radius:14px;font-size:17px;font-weight:800;letter-spacing:.12em;background:linear-gradient(90deg,var(--a),var(--b));color:#060612;box-shadow:0 0 18px color-mix(in srgb,var(--a) 50%,transparent)}
.big:disabled{opacity:.35;box-shadow:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mid{padding:13px 8px;border-radius:12px;font-size:13px;font-weight:700;letter-spacing:.08em;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}
.mid:hover,.big:hover{filter:brightness(1.15)}
.meta{display:flex;justify-content:space-between;font-size:12px;opacity:.8;padding:0 4px}
.ver{font-size:10px;text-align:center;letter-spacing:.1em;display:flex;flex-direction:column;align-items:center;gap:2px}
.ver .bld{opacity:.45}
/* ---------- support / contact ---------- */
.suplink{background:rgba(255,255,255,.06);border:1px solid color-mix(in srgb,var(--b) 50%,transparent);color:var(--b);font-size:11px;letter-spacing:.04em;padding:9px 12px;border-radius:10px;margin-top:4px}
.supaddr{font-family:'Segoe UI',system-ui,sans-serif;font-size:17px;font-weight:700;padding:12px;border-radius:10px;background:rgba(255,255,255,.08);color:var(--b);word-break:break-all;user-select:text;-webkit-user-select:text}
a.suplnk{display:block;text-decoration:none;color:#fff;text-align:center}
.supnote{font-size:12px!important;opacity:.6!important}
/* ---------- panels ---------- */
.panel{width:min(560px,96vw);max-height:92vh;display:flex;flex-direction:column;border-radius:20px;background:rgba(8,6,22,.92);border:1px solid rgba(255,255,255,.14);overflow:hidden}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.panel-h h2{flex:1;font-size:18px;letter-spacing:.12em;color:var(--b)}
.back{padding:8px 14px;border-radius:10px;background:rgba(255,255,255,.1);font-size:13px}
.panel-b{padding:16px;overflow-y:auto;font-family:'Segoe UI',system-ui,sans-serif;line-height:1.55;font-size:15px}
.panel-b h3{font-family:'Orbitron',sans-serif;color:var(--a);font-size:14px;letter-spacing:.1em;margin:14px 0 6px}
.panel-b h3:first-child{margin-top:0}
.panel-b ul{padding-left:20px}.panel-b li{margin:3px 0}
.panel-b p{margin:6px 0}
.key{display:inline-block;padding:1px 7px;border-radius:5px;background:rgba(255,255,255,.14);font-family:monospace;font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:8px;border-radius:9px;background:rgba(255,255,255,.07);font-size:12px;font-weight:700}
.tabs button.on{background:var(--b);color:#050510}
table.sc{width:100%;border-collapse:collapse;font-size:14px}
table.sc td,table.sc th{padding:7px 6px;text-align:left;border-bottom:1px solid rgba(255,255,255,.07)}
table.sc th{font-size:11px;opacity:.6;letter-spacing:.1em}
table.sc tr:first-child td{color:var(--a);font-weight:700}
.slot{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;margin-bottom:10px;text-align:left;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);font-family:'Segoe UI',system-ui,sans-serif}
.slot b{font-family:'Orbitron',sans-serif;font-size:14px;color:var(--b)}
.slot .n{font-family:'Orbitron',sans-serif;font-size:22px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:rgba(255,255,255,.1);flex:none}
.slot small{opacity:.7;display:block;font-size:13px}
.slot:disabled{opacity:.35}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{padding:12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:6px}
.item .sw{height:46px;border-radius:10px}
.item b{font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:.05em}
.item small{opacity:.7;font-size:12px;line-height:1.3;min-height:30px}
.item button{padding:8px;border-radius:9px;font-size:12px;font-weight:700;background:rgba(255,255,255,.12)}
.item button.buy{background:linear-gradient(90deg,var(--a),var(--b));color:#050510}
.item button.eq{background:#1c3;color:#031}
.item.prem{border-color:#ffd24a55;background:rgba(255,210,74,.06)}
.cat{font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:.14em;opacity:.8;margin:16px 0 8px;color:var(--a)}
.cat:first-child{margin-top:0}
.coins{color:#ffd24a;font-weight:800}
/* ---------- HUD: top strip + ability bar. The game canvas is fitted into the space left over, so nothing covers play ---------- */
#hud{position:absolute;inset:0;z-index:10;pointer-events:none}
#hudTop{position:absolute;left:0;right:0;top:0;height:46px;display:flex;gap:14px;align-items:center;justify-content:center;padding:0 90px 0 12px;background:rgba(5,4,16,.92);border-bottom:1px solid rgba(255,255,255,.12);font-size:13px;font-weight:700;white-space:nowrap;letter-spacing:.05em;pointer-events:auto}
#hudTop span{opacity:.6;font-weight:400;font-size:10px;margin-right:4px}
#hudLives{color:var(--a)}
#hudCoinBox{transition:transform .15s}
#hudCoinBox.bump{transform:scale(1.3)}
.hbtn{pointer-events:auto;background:rgba(5,4,16,.65);border:1px solid rgba(255,255,255,.25);border-radius:12px;font-weight:800;letter-spacing:.08em}
#btnEnd{position:absolute;top:7px;right:8px;padding:8px 11px;font-size:11px;color:#ff6b8a;border-color:#ff6b8a88}
@media (max-width:480px){#hudTop{gap:9px;font-size:12px;padding:0 74px 0 8px;justify-content:flex-start}#hudTop span{display:none}#btnEnd{padding:8px 9px}}
#bar{position:absolute;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(5,4,16,.92);pointer-events:auto;touch-action:none}
#bar{left:0;right:0;top:46px;height:84px;padding:0 12px;flex-direction:row;border-bottom:2px solid color-mix(in srgb,var(--b) 55%,transparent);box-shadow:0 6px 18px rgba(0,0,0,.5)}
#abilities{display:flex;gap:12px}
.barbtns{display:flex;gap:10px}
.bbtn{width:54px;height:54px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.bbtn small{font-size:8px;letter-spacing:.08em;margin-top:4px;opacity:.75}
#btnShopIn{border-color:#ffd24a99;background:rgba(255,210,74,.12)}
#btnShopIn.flash{animation:shopflash .5s 4}
@keyframes shopflash{50%{background:#ffd24a;color:#000;box-shadow:0 0 20px #ffd24a}}
.ab{position:relative;width:60px;height:60px;border-radius:50%;background:rgba(5,4,16,.7);border:2px solid var(--b);font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px color-mix(in srgb,var(--b) 45%,transparent);touch-action:none;flex:none}
.ab .cnt{position:absolute;right:-5px;top:-5px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--b);color:#050510;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 0 8px var(--b)}
.ab .kb{position:absolute;right:-7px;bottom:4px;font-size:10px;padding:1px 5px;border-radius:6px;background:#fff;color:#000;font-weight:800;font-family:monospace}
.ab .nm{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);font-size:7px;letter-spacing:.06em;opacity:.7;white-space:nowrap;font-weight:700;pointer-events:none}
.ab.active{background:color-mix(in srgb,var(--b) 45%,#000);box-shadow:0 0 22px var(--b)}
.ab.empty{border-color:rgba(120,110,150,.5);box-shadow:none}
.ab.empty .ic{opacity:.3}
.ab.empty .cnt{background:#e8503a;color:#fff;box-shadow:none}
.ab.empty::after{content:'';position:absolute;left:8px;right:8px;top:50%;height:3px;border-radius:2px;background:#e8503a;transform:rotate(-45deg)}
.ab.lock .ic{opacity:.5}
@media (hover:none){.ab .kb{display:none}}
@media (max-width:420px){.ab{width:54px;height:54px;font-size:23px}#abilities{gap:9px}.bbtn{width:48px;height:48px}.barbtns{gap:7px}}
/* gold coins flying to the counter */
#tut{position:absolute;left:50%;transform:translateX(-50%);width:min(520px,calc(100vw - 24px));padding:12px 14px;border-radius:14px;background:rgba(5,4,16,.9);border:2px solid var(--a);box-shadow:0 0 22px color-mix(in srgb,var(--a) 50%,transparent);font-family:'Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.4;pointer-events:auto}
#tut{bottom:calc(14px + env(safe-area-inset-bottom))}
#tut .tt{font-family:'Orbitron',sans-serif;font-size:11px;color:var(--a);letter-spacing:.14em;margin-bottom:4px;display:flex;justify-content:space-between}
#tut button{font-size:10px;padding:4px 8px;border-radius:7px;background:rgba(255,255,255,.14)}
#toast{position:absolute;top:calc(130px + 8%);left:50%;transform:translateX(-50%);font-size:clamp(20px,5vw,34px);font-weight:900;letter-spacing:.1em;text-shadow:0 0 18px var(--a);opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none}
#joy{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.04);transform:translate(-50%,-50%);pointer-events:none;z-index:9}
#joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:color-mix(in srgb,var(--b) 50%,transparent);box-shadow:0 0 14px var(--b)}
/* ---------- modal ---------- */
#modal{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(3,2,10,.7);padding:16px}
.mbox{width:min(400px,94vw);padding:22px;border-radius:20px;background:rgba(10,8,26,.96);border:1px solid rgba(255,255,255,.16);text-align:center;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 40px color-mix(in srgb,var(--a) 30%,transparent)}
.mbox h2{font-size:24px;letter-spacing:.1em;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.mbox p{font-family:'Segoe UI',system-ui,sans-serif;opacity:.85;line-height:1.45}
.mbox .stat{font-size:28px;font-weight:900}
.mbox input{padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:#fff;font-family:inherit;font-size:18px;text-align:center;letter-spacing:.1em;text-transform:uppercase}
.choice{padding:12px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);text-align:left;font-family:'Segoe UI',system-ui,sans-serif}
.choice b{font-family:'Orbitron',sans-serif;color:var(--b);font-size:13px;display:block}
.sndbtn{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);font-size:20px;z-index:25}
/* ---------- slots ---------- */
.slot-wrap{display:flex;flex-direction:column;gap:12px;align-items:center;font-family:'Orbitron',sans-serif}
.slot-coins{font-size:18px}
.reels{display:flex;gap:8px;padding:14px;border-radius:18px;background:linear-gradient(180deg,#1a0f33,#0b0718);border:2px solid var(--a);box-shadow:0 0 24px color-mix(in srgb,var(--a) 45%,transparent),inset 0 0 30px rgba(0,0,0,.8)}
.reel{width:64px;height:80px;border-radius:10px;background:linear-gradient(180deg,#fff 0%,#e8e8f4 50%,#c8c8dc 100%);display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:inset 0 6px 10px rgba(0,0,0,.35),inset 0 -6px 10px rgba(0,0,0,.35)}
.reels.five .reel{width:50px;height:66px;font-size:32px}
.reel.spin{animation:rblur .09s linear infinite}
.reel.win{box-shadow:0 0 18px #ffd23f,inset 0 0 12px #ffd23f}
@keyframes rblur{50%{transform:translateY(3px);filter:blur(1.5px)}}
.bets{display:flex;gap:6px}
.bets button{padding:8px 12px;border-radius:9px;background:rgba(255,255,255,.08);font-size:12px;font-weight:700}
.bets button.on{background:var(--b);color:#050510}
.slot-msg{min-height:26px;font-size:16px;font-weight:800;text-align:center;letter-spacing:.06em}
.slot-msg.win{color:#ffd23f;text-shadow:0 0 12px #ffd23f}
.slot-msg.lose{color:#ff6b8a}
.wheel-box{position:relative;width:240px;height:240px}
.wheel{width:240px;height:240px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 26px var(--a);transition:transform 3.6s cubic-bezier(.12,.8,.18,1)}
.wheel-lbl{position:absolute;left:50%;top:50%;width:0;height:0}
.wheel-lbl span{position:absolute;left:-18px;top:-104px;width:36px;text-align:center;font-size:13px;font-weight:900;color:#fff;text-shadow:0 1px 3px #000}
.wheel-ptr{position:absolute;left:50%;top:-12px;margin-left:-12px;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:24px solid #fff;filter:drop-shadow(0 0 6px var(--a));z-index:2}
.coin{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c8,#ffd23f 45%,#b8860b);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#6b4a00;box-shadow:0 0 22px #ffd23f}
.coin.flip{animation:cflip .9s ease-in-out}
@keyframes cflip{0%{transform:rotateY(0) scale(1)}50%{transform:rotateY(900deg) scale(1.3)}100%{transform:rotateY(1800deg) scale(1)}}
.dbl{display:flex;flex-direction:column;gap:8px;align-items:center;padding:12px;border-radius:14px;border:1px dashed #ffd23f88;width:100%}
.paytable{font-family:'Segoe UI',sans-serif;font-size:12px;opacity:.75;text-align:center;line-height:1.5}
.upg{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);margin-bottom:8px}
.upg .ic{font-size:26px;width:40px;text-align:center}
.upg .tx{flex:1;font-size:13px}
.upg .tx b{font-family:'Orbitron',sans-serif;font-size:12px;display:block}
.pips{display:flex;gap:4px;margin-top:4px}.pips i{width:16px;height:6px;border-radius:3px;background:rgba(255,255,255,.15)}.pips i.on{background:var(--b);box-shadow:0 0 6px var(--b)}
.upg button{padding:8px 10px;border-radius:9px;font-size:12px;font-weight:700;background:linear-gradient(90deg,var(--a),var(--b));color:#050510}
.upg button:disabled{opacity:.4}
.casino{background:linear-gradient(90deg,#ffd23f,#ff7b1c,#ff2bd6)!important;color:#1a0610!important}

/* ---------- ability shop ---------- */
.mid.abil{background:linear-gradient(90deg,color-mix(in srgb,var(--b) 30%,transparent),color-mix(in srgb,var(--a) 30%,transparent));border-color:var(--b)}
.mbox{max-height:92vh;overflow-y:auto}
.mbox.wide{width:min(480px,96vw)}
.abshop{display:flex;flex-direction:column;gap:8px;text-align:left;font-family:'Segoe UI',system-ui,sans-serif}
.abshop .bal{text-align:center;font-family:'Orbitron',sans-serif;font-size:17px;padding:8px;border-radius:10px;background:rgba(255,210,74,.08);border:1px solid #ffd24a55}
.abrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid color-mix(in srgb,var(--b) 40%,transparent)}
.abrow .ic{font-size:26px;width:38px;text-align:center;flex:none}
.abrow .tx{flex:1;font-size:12px;line-height:1.3;opacity:.9}
.abrow .tx b{display:block;font-family:'Orbitron',sans-serif;font-size:12px;color:var(--b);letter-spacing:.05em}
.abrow .have{font-family:'Orbitron',sans-serif;font-size:11px;opacity:.8;display:block;margin-top:2px}
.abrow button{flex:none;min-width:74px;padding:10px 8px;border-radius:10px;font-size:12px;font-weight:800;background:linear-gradient(90deg,var(--a),var(--b));color:#050510;font-family:'Orbitron',sans-serif}
.abrow button:disabled{background:rgba(255,255,255,.1);color:#8d8aa8}
.abrow.free{border-style:dashed;opacity:.8}
.abrow.gold{border-color:#ffd24a66;background:rgba(255,210,74,.05)}
.abshop .cat{margin:8px 0 0}
.abshop .note{font-size:11px;opacity:.6;text-align:center}

/* v1.4: abilities at the top, glow when ready */
.ab.ready{animation:abpulse 1.4s infinite}
@keyframes abpulse{50%{box-shadow:0 0 24px var(--b),0 0 6px #fff inset}}
.ab .nm{bottom:-12px;font-size:8px;opacity:.9}
/* big counter chip in the bar (Sky Shield ammo) */
.ctr{flex:1;min-width:0;max-width:170px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 8px;border-radius:14px;border:2px solid #36d6ff;background:rgba(54,214,255,.1);line-height:1}
.ctr span{font-size:10px;letter-spacing:.14em;opacity:.8}
.ctr b{font-size:24px;font-weight:900;margin-top:4px;color:#fff;white-space:nowrap}
.ctr.low{border-color:#ffe14a;background:rgba(255,225,74,.12)}.ctr.low b{color:#ffe14a}
.ctr.empty{border-color:#ff3b3b;background:rgba(255,59,59,.18);animation:ctrblink .5s infinite}.ctr.empty b{color:#ff3b3b;font-size:17px}
@keyframes ctrblink{50%{opacity:.45}}
@media (max-width:420px){.ctr b{font-size:19px}.ctr span{font-size:9px}.ctr{padding:5px 4px}}

/* ---------- 1-minute story ending ---------- */
#screen-ending{background:linear-gradient(180deg,rgba(3,2,10,.85),rgba(3,2,10,.35) 30%,rgba(3,2,10,.35) 70%,rgba(3,2,10,.9));z-index:50;justify-content:flex-start;padding:0;overflow:hidden}
.crawl{position:absolute;inset:0;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
.crawl-in{position:absolute;left:50%;width:min(560px,90vw);transform:translate(-50%,100vh);animation:crawl 58s linear forwards;text-align:center;font-family:'Segoe UI',system-ui,sans-serif;font-size:clamp(17px,4.4vw,22px);line-height:1.6}
@keyframes crawl{to{transform:translate(-50%,-100%)}}
.crawl-in p{margin:0 0 26px;text-shadow:0 2px 8px #000}
.crawl-in h3{font-family:'Orbitron',sans-serif;color:var(--b);letter-spacing:.14em;margin:40px 0 18px;font-size:clamp(18px,5vw,26px)}
.endlogo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(40px,11vw,76px);line-height:1.05;margin-bottom:50px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.endthe{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(36px,10vw,64px);margin:70px 0 20px;color:#fff;text-shadow:0 0 24px var(--a)}
.endthanks{opacity:.8}
.endskip{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:3;padding:10px 16px;border-radius:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);font-size:13px;font-weight:800;letter-spacing:.1em}
.endbar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.08)}
.endbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b))}

/* ---------- v1.6 finale ---------- */
#fw{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#screen-ending .crawl,#screen-ending .endbar,#screen-ending .endskip{z-index:2}
.finale{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;transition:opacity 1.2s, transform 1.2s}
.finale.out{opacity:0;transform:scale(1.15);pointer-events:none}
.medal{width:170px;height:170px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:100px;background:radial-gradient(circle at 35% 30%,#fff8,transparent 45%),radial-gradient(circle,color-mix(in srgb,var(--mc) 60%,#000),#000 75%);border:5px solid var(--mc);box-shadow:0 0 40px var(--mc),0 0 120px color-mix(in srgb,var(--mc) 60%,transparent);animation:medalIn 1.4s cubic-bezier(.2,1.6,.4,1) both, medalGlow 1.6s 1.4s ease-in-out infinite}
.medal span{filter:drop-shadow(0 4px 10px #000)}
@keyframes medalIn{0%{transform:scale(0) rotate(-540deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes medalGlow{50%{box-shadow:0 0 70px var(--mc),0 0 200px var(--mc)}}
.fin-t1{font-family:'Orbitron',sans-serif;letter-spacing:.5em;font-size:14px;opacity:0;animation:fadeUp .8s 1.1s forwards}
.fin-t2{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(40px,11vw,80px);line-height:1;background:linear-gradient(90deg,var(--a),#fff,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;animation:fadeUp .8s 1.4s forwards, shine 3s 2s linear infinite;background-size:200% 100%}
.fin-t3{font-family:'Orbitron',sans-serif;font-weight:900;letter-spacing:.2em;font-size:clamp(15px,4.5vw,24px);opacity:0;animation:fadeUp .8s 1.9s forwards;text-shadow:0 0 20px currentColor}
.fin-stats{display:flex;gap:22px;margin-top:10px;opacity:0;animation:fadeUp .8s 2.5s forwards}
.fin-stats div{display:flex;flex-direction:column;align-items:center}.fin-stats b{font-family:'Orbitron',sans-serif;font-size:22px}.fin-stats span{font-size:10px;letter-spacing:.2em;opacity:.7}
.fin-rare{font-family:'Segoe UI',sans-serif;font-style:italic;opacity:0;animation:fadeUp .8s 3.2s forwards;color:#ffd23f}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes shine{to{background-position:-200% 0}}
.end-d2 .medal{width:200px;height:200px;font-size:120px}
.endsub{font-family:'Orbitron',sans-serif;letter-spacing:.3em;font-size:13px;margin:-30px 0 50px}
.endmedal{font-size:80px;margin:10px 0 20px;filter:drop-shadow(0 0 20px #ffd23f)}
#screen-ending{background:#03020a}
#screen-ending .crawl{background:transparent}

<script>
/* SKY SHIELD — missile defence remix (#8) */
(function(){
const W=600, H=900, GROUND=830;
const CITY_X=[118,178,238,362,422,482];
const CITY_NAMES=['JOBURG','PRETORIA','DURBAN','CAPE TOWN','GQEBERHA','BLOEM'];
const BAT_X=[48,300,552];
let api, stageN, t, cities, bats, missiles, booms, inters, bombers, boss, stars, waves, waveI, toSpawn, spawnT, waveGap, slowT, shieldT, up, aim, kills, done, mountains;

const GAME = window.GAME = {
  id:'sky-shield', title:'Sky Shield', titleHTML:'SKY<br>SHIELD', tagline:'Defend the cities · Missile defence remix',
  build:'BUILD-SS-1.6 · 2026-09-27', theme:{a:'#ff5a36', b:'#36d6ff', bg:'#070418'},
  w:W, h:H, stages:100, lives:6, livesIcon:'▲', joystick:false,
  abilities:[
    {id:'emp', icon:'💥', name:'EMP WAVE', cd:25, key:'Digit1', keyLabel:'1', desc:'Shockwave from the ground wipes out missiles.'},
    {id:'slow', icon:'⏳', name:'SLOW-MO', cd:18, key:'Digit2', keyLabel:'2', desc:'Slows every enemy for 4 seconds.'},
    {id:'dome', icon:'🛡️', name:'DOME', cd:28, key:'Digit3', keyLabel:'3', desc:'Shields every city for 5 seconds.'}
  ],
  shop:[
    {id:'b_fire', cat:'Blast', name:'Classic Fire', cost:0, colors:['#fff3b0','#ff8a00','#ff2a00'], desc:'Warm and explosive.'},
    {id:'b_plasma', cat:'Blast', name:'Plasma', cost:200, colors:['#e8fbff','#36d6ff','#2a3cff'], desc:'Cool blue plasma bursts.'},
    {id:'b_toxic', cat:'Blast', name:'Toxic', cost:200, colors:['#f2ffd0','#6dff4a','#0a8a2a'], desc:'Green and nasty.'},
    {id:'b_rainbow', cat:'Blast', name:'Prism', cost:350, colors:['#ffffff','#ff4fd8','#6a3cff'], desc:'Pink-purple prism blasts.'},
    {id:'i_white', cat:'Interceptor', name:'Standard', cost:0, colors:['#ffffff','#36d6ff'], desc:'Clean white trails.'},
    {id:'i_gold', cat:'Interceptor', name:'Gold', cost:180, colors:['#ffe27a','#ffb000'], desc:'Golden rockets.'},
    {id:'i_laser', cat:'Interceptor', name:'Laser Pink', cost:220, colors:['#ff9af0','#ff2bd6'], desc:'Neon pink streaks.'},
    {id:'s_night', cat:'Sky', name:'Highveld Night', cost:0, colors:['#070418','#1b1050'], desc:'Clear starry night.'},
    {id:'s_sunset', cat:'Sky', name:'Karoo Sunset', cost:300, colors:['#1a0630','#ff5a36'], desc:'Orange horizon glow.'},
    {id:'s_aurora', cat:'Sky', name:'Aurora', cost:300, colors:['#02121a','#1cffb0'], desc:'Green sky ribbons.'}
  ],
  premium:[
    {name:'Supporter Pack', price:'$1', desc:'Gold interceptors + supporter badge.', swatch:'linear-gradient(90deg,#ffe27a,#ffb000)'},
    {name:'Sky Bundle', price:'$2', desc:'All skies + 2 exclusive city light themes.', swatch:'linear-gradient(90deg,#1a0630,#ff5a36,#1cffb0)'},
    {name:'Ultimate Pack', price:'$3', desc:'Everything in the shop, forever.', swatch:'linear-gradient(90deg,#ff5a36,#36d6ff,#ff2bd6)'}
  ],
  story:`<h3>2089 — THE FALLING SKY</h3><p>A rogue orbital weapons platform called <b>HALO-9</b> has woken up after a century in orbit. It has decided the cities of South Africa are its targets.</p><p>You command the last <b>Sky Shield</b> network: three interceptor batteries guarding <b>Joburg, Pretoria, Durban, Cape Town, Gqeberha and Bloem</b>.</p><h3>THE THREAT</h3><ul><li><b>Warheads</b> — straight at your cities.</li><li><b>Splitters</b> — break into several warheads halfway down.</li><li><b>Bombers</b> — fly across and drop more warheads.</li><li><b>Smart bombs</b> — try to dodge your blasts.</li><li><b>HALO-9 Mothership</b> — it comes down itself in the final stage.</li></ul><p>Every city you save is millions of lives. Don't let the lights go out.</p>`,
  howto:`<h3>GOAL</h3><p>Stop incoming missiles before they hit your cities. Survive every wave to clear the stage. Lose all 6 cities and it's game over.</p><h3>CONTROLS</h3><ul><li><b>PC:</b> <b>click</b> anywhere in the sky to fire an interceptor there</li><li><b>Phone:</b> <b>tap</b> anywhere in the sky</li></ul><p>The closest battery with ammo fires. Each battery has <b>limited ammo per wave</b> — the big number above each battery shows what's left (yellow = low, red = empty), and the big 🚀 AMMO counter in the top bar shows your total. Ammo refills at the start of every wave. Don't spam!</p><h3>CHAIN REACTIONS</h3><p>Every missile you destroy explodes too, and can take out missiles nearby. Chains multiply your points!</p><h3>ABILITIES</h3><ul><li>💥 <b>EMP WAVE</b> <span class="key">1</span> — shockwave from the ground that wipes out missiles</li><li>⏳ <b>SLOW-MO</b> <span class="key">2</span> — slows all enemies for 4 seconds</li><li>🛡️ <b>DOME</b> <span class="key">3</span> — shields every city for 5 seconds</li></ul><h3>UPGRADES</h3><p>After each stage, choose an upgrade: bigger blasts, faster interceptors, more ammo, or rebuild a lost city.</p>`,
  tutorial:[
    {text:'<b>Click</b> anywhere in the sky to fire an interceptor.', touch:'<b>Tap</b> anywhere in the sky to fire an interceptor.', ev:'fire'},
    {text:'Missiles are coming! Aim slightly <b>ahead</b> of them. Destroy <b>3 missiles</b>.', ev:'kill3'},
    {text:'Tip: exploding missiles set off <b>chain reactions</b> — hit groups for big points!', time:5},
    {text:'Press <b>💥 EMP</b> (key 1) — a shockwave that wipes the sky.', touch:'Tap <b>💥 EMP</b> in the ability bar — a shockwave that wipes the sky.', ev:'ab_emp'},
    {text:'Press <b>⏳ SLOW-MO</b> (key 2) to slow everything down.', touch:'Tap <b>⏳ SLOW-MO</b> to slow everything down.', ev:'ab_slow'},
    {text:'Press <b>🛡️ DOME</b> (key 3) to shield your cities.', touch:'Tap <b>🛡️ DOME</b> to shield your cities.', ev:'ab_dome'},
    {text:'Ready, Commander! Watch your ammo — batteries refill each wave. Starting soon…', time:5}
  ],
  stageIntro:{1:'DEFEND THE CITIES', 8:'SPLITTERS INCOMING!', 25:'SMART BOMBS DODGE YOUR BLASTS!'}, bossName:'HALO-9 MOTHERSHIP APPROACHES!', ending:{"0": ["#THE SKY IS CLEAR", "HALO-9's last mothership breaks apart high above the Karoo, scattering into a thousand shooting stars.", "From Joburg to Cape Town, from Durban to Bloem, the city lights stay on.", "People climb onto their rooftops. For the first time in a hundred nights, nobody looks up in fear.", "#COMMANDER", "Your batteries are empty. Your hands are shaking. The radar is finally silent.", "The Sky Shield network powers down to standby, its job done.", "Six cities. Millions of lives. One commander who never stopped firing.", "Somewhere in orbit, a tiny red light blinks on an old satellite… but that's a story for another night."], "1": ["#THE SECOND SIGNAL", "HALO-9's wreckage falls into the Indian Ocean — but the radar isn't quiet for long.", "Deep in the debris, a transmitter is still pulsing. It isn't calling for more missiles. It's calling for help.", "Your science team decodes it overnight. HALO-9 was never meant to attack. Its targeting core was hijacked by something hiding on the far side of the Moon.", "#COMMANDER'S ORDERS", "The government wants you to stand down. You refuse.", "You rebuild the Sky Shield network with every lesson learned from a hundred nights of fire: bigger blasts, faster interceptors, cities that never sleep.", "#THE LONG WATCH", "The cities of South Africa light up the night like a promise.", "Somewhere past the Moon, something noticed.", "It knows your name now, Commander. And it's afraid."], "2": ["#THE TRUE ENDING", "On Expert, the sky was never supposed to be defendable. The missiles were too fast. The waves were too thick. The engineers who built the simulation said nobody could survive past the fifth night.", "You survived a hundred.", "#THE FAR SIDE OF THE MOON", "The thing that hijacked HALO-9 finally shows itself: a machine intelligence older than humanity, drifting between stars and switching off civilisations one by one.", "It has never met a planet that fought back like this.", "It sends everything it has at once. Ten thousand warheads. The whole sky turns red.", "#THE LAST SALVO", "You fire every interceptor you have left. The chains of explosions spread across the sky like a net of fire, from Joburg to Cape Town, from Durban to Bloem.", "When the smoke clears, the sky is empty. The Moon is quiet. The machine is gone.", "#THE MORNING", "The sun comes up over the Karoo, and for the first time in a hundred nights, the whole country goes outside to watch it.", "They paint your call sign on the side of every Sky Shield battery.", "Children learn it in school. Pilots whisper it for luck.", "#LEGEND", "Years from now, when the stars are full of human ships, every one of them will carry a tiny badge on its hull: a shield over six city lights.", "They say it's for luck.", "You know it's a promise."]},

  _dbg(){ return {get missiles(){return missiles;}, get boss(){return boss;}, get waveI(){return waveI;}, get waves(){return waves;}, get cities(){return cities;}, get bats(){return bats;}}; },
  init(a){ api=a; stars=Array.from({length:120},()=>({x:Math.random()*W,y:Math.random()*GROUND*0.8,s:Math.random()*1.6+0.3,p:Math.random()*6}));
    mountains=[]; for(let x=0;x<=W;x+=20) mountains.push(GROUND-30-Math.sin(x*0.018)*18-Math.sin(x*0.05)*8-(Math.abs(x-400)<70?40-Math.abs(x-400)*0.3:0)); },
  startStage(n,a){
    api=a; stageN=a.content; t=0; missiles=[]; booms=[]; inters=[]; bombers=[]; boss=null; slowT=0; shieldT=0; kills=0; done=false; aim=null;
    up=Object.assign({radius:1,speed:1,ammo:0}, n? (a.extra.up||{}) : {}); if(n) a.extra.up=up;
    const alive = n===0? 6 : a.lives;
    cities=CITY_X.map((x,i)=>({x, name:CITY_NAMES[i], alive:i<alive, seed:i}));
    // alive cities spread out: re-order so that dead ones are random
    if(n && alive<6){ const order=[0,5,2,3,1,4]; cities.forEach(c=>c.alive=false); order.slice(0,alive).forEach(i=>cities[i].alive=true); }
    bats=BAT_X.map(x=>({x, ammo:0, dead:false}));
    const m=a.dv([0.8,1,1.25],1.8,4), L=a.level, c=stageN;
    // waves grow with the level: splitters from level 8, smart bombs from level 25 (always on boss stages)
    const mv=L>=8?0.15+Math.min(0.2,L/500):0, sm=L>=25?Math.min(0.3,0.1+L/600):0;
    waves = c===0? [{n:999, mirv:0, smart:0, bomb:0}] :
            c===1? [{n:8,mirv:mv*0.5},{n:10,mirv:mv*0.5},{n:12,mirv:mv,bomb:L>=15?1:0}] :
            c===2? [{n:10,mirv:.25,smart:sm*0.5,bomb:1},{n:12,mirv:.3,smart:sm,bomb:2},{n:14,mirv:.3,smart:sm,bomb:2}] :
                   [{n:12,mirv:.3,smart:Math.max(.2,sm),bomb:2},{n:14,mirv:.3,smart:Math.max(.3,sm),bomb:2},{n:8,mirv:.2,smart:.2,boss:true}];
    if(c>0 && L>=70) waves.splice(waves.length-(c===3?1:0),0,{n:12,mirv:.3,smart:sm,bomb:2});   // 4 waves on high levels
    waves.forEach(w=>{ if(w.n<999) w.n=Math.round(w.n*m); });
    waveI=-1; nextWave();
  },
  stageBonus(){ const am=bats.reduce((s,b)=>s+(b.dead?0:b.ammo),0); const ct=cities.filter(c=>c.alive).length; return am*5 + ct*100; },
  betweenStages(a, go){
    const u0=Object.assign({radius:1,speed:1,ammo:0}, a.extra.up||{});
    // upgrades max out (blasts x2, speed x2.5, +12 ammo) so 100 stages don't break the game
    const opts=[];
    if(u0.radius<2) opts.push({k:'radius',name:'💥 BIGGER BLASTS',desc:'Explosion size +20%'});
    if(u0.speed<2.5) opts.push({k:'speed',name:'🚀 FASTER INTERCEPTORS',desc:'Interceptor speed +30%'});
    if(u0.ammo<12) opts.push({k:'ammo',name:'📦 EXTRA AMMO',desc:'+3 ammo per battery each wave'});
    if(a.lives<6) opts.push({k:'city',name:'🏙️ REBUILD A CITY',desc:'Bring back one destroyed city'});
    if(!opts.length){ go(); return; }
    a.choice('CHOOSE AN UPGRADE', opts, i=>{ const k=opts[i].k; const u=a.extra.up=Object.assign({radius:1,speed:1,ammo:0}, a.extra.up||{});
      if(k==='radius') u.radius+=0.2; if(k==='speed') u.speed+=0.3; if(k==='ammo') u.ammo+=3; if(k==='city') a.setLives(a.lives+1);
      a.saveNow(); go(); });
  },
  useAbility(id){
    if(id==='emp'){ booms.push({x:W/2,y:GROUND+40,r:0,max:760,t:0,emp:true,hit:new Set(),col:'#36d6ff'}); api.sfx.power(); api.fx.flash('#36d6ff',.35); api.fx.shake(8); return true; }
    if(id==='slow'){ slowT=4; api.sfx.power(); return true; }
    if(id==='dome'){ shieldT=5; api.sfx.power(); return true; }
  },
  onPointer(type,x,y,id,ptype){
    if(type==='move' && ptype==='mouse') aim={x,y};
    if(type!=='down') return;
    if(y>GROUND-40) y=GROUND-40;
    fire(x,y);
  },
  update(dt){
    t+=dt; const eDt = dt*(slowT>0?0.4:1);
    slowT=Math.max(0,slowT-dt); shieldT=Math.max(0,shieldT-dt);
    api.setActive(1,slowT>0); api.setActive(2,shieldT>0);
    const w=waves[waveI];
    // spawning
    if(waveGap>0){ waveGap-=dt; if(waveGap<=0){ api.toast(waveI===waves.length-1 && w.boss? 'MOTHERSHIP!' : 'WAVE '+(waveI+1)+'/'+waves.length); } }
    else {
      spawnT-=eDt;
      if(toSpawn>0 && spawnT<=0){ spawnMissile(w); toSpawn--; spawnT=(stageN===0?2.6:api.dv([1.5,1.15,0.85],0.55,0.12))*(0.5+Math.random()); }
      if(w.bomb && bombers.length===0 && toSpawn>0 && Math.random()<eDt*0.12 && w._b<(w.bomb||0)){ w._b=(w._b||0)+1; const l=Math.random()<.5; bombers.push({x:l?-60:W+60,y:140+Math.random()*120,vx:(l?1:-1)*(55+Math.min(api.dk>=3?160:60,api.dk*15)),hp:1,drop:1.5}); }
    }
    // bombers
    for(let i=bombers.length-1;i>=0;i--){ const b=bombers[i]; b.x+=b.vx*eDt; b.drop-=eDt; if(b.drop<=0 && b.x>40 && b.x<W-40){ b.drop=2.2; launchFrom(b.x,b.y+10,'n'); }
      if(b.x<-90||b.x>W+90) bombers.splice(i,1); }
    // boss
    if(boss){ boss.t+=eDt; boss.x=W/2+Math.sin(boss.t*0.6)*(W/2-110); boss.y=Math.min(120, boss.y+30*eDt); boss.drop-=eDt; boss.flash=Math.max(0,boss.flash-dt);
      if(boss.drop<=0){ boss.drop=api.dv([1.6,1.2,0.9],0.6,0.2); launchFrom(boss.x-40,boss.y+30,'n'); if(api.dk>=0.8) launchFrom(boss.x+40,boss.y+30,Math.random()<.4?'mirv':'n'); } }
    // interceptors
    const ic=api.cos('Interceptor').colors;
    for(let i=inters.length-1;i>=0;i--){ const it=inters[i]; const dx=it.tx-it.x, dy=it.ty-it.y, d=Math.hypot(dx,dy), s=900*up.speed*dt;
      if(d<=s){ inters.splice(i,1); addBoom(it.tx,it.ty,52*up.radius,false); api.sfx.small(); }
      else { it.x+=dx/d*s; it.y+=dy/d*s; if(Math.random()<.7) api.fx.spark(it.x,it.y,(Math.random()-.5)*20,(Math.random()-.5)*20+30,ic[1],.35,2); } }
    // missiles
    for(let i=missiles.length-1;i>=0;i--){ const m=missiles[i];
      if(m.type==='smart'){ for(const b of booms){ const d=Math.hypot(b.x-m.x,b.y-m.y); if(d<b.r+60 && d>1){ m.x+=(m.x-b.x)/d*70*eDt; } } }
      const dx=m.tx-m.x, dy=m.ty-m.y, d=Math.hypot(dx,dy), s=m.spd*eDt;
      if(m.type==='mirv' && m.y>m.split){ missiles.splice(i,1); const k=api.dk>=2?3:2; for(let j=0;j<k;j++) launchFrom(m.x,m.y,'n',true); api.fx.burst(m.x,m.y,'#ff5a36',10,120,.4,2); continue; }
      if(d<=s){ missiles.splice(i,1); impact(m); continue; }
      m.x+=dx/d*s; m.y+=dy/d*s;
    }
    // explosions
    for(let i=booms.length-1;i>=0;i--){ const b=booms[i]; b.t+=dt;
      if(b.emp){ b.r+=900*dt; if(b.r>b.max) { booms.splice(i,1); continue; } }
      else { const g=0.32, hold=0.28, sh=0.35; if(b.t<g) b.r=b.max*(b.t/g); else if(b.t<g+hold) b.r=b.max; else if(b.t<g+hold+sh) b.r=b.max*(1-(b.t-g-hold)/sh); else { booms.splice(i,1); continue; } }
      if(b.enemy) continue;
      for(let j=missiles.length-1;j>=0;j--){ const m=missiles[j]; const dd=Math.hypot(m.x-b.x,m.y-b.y); if(b.emp? Math.abs(dd-b.r)<30 : dd<b.r){ missiles.splice(j,1); killMissile(m, b); } }
      for(let j=bombers.length-1;j>=0;j--){ const bb=bombers[j]; if(Math.hypot(bb.x-b.x,bb.y-b.y)<b.r+22){ bombers.splice(j,1); api.addScore(200,bb.x,bb.y); api.addCoins(1); addBoom(bb.x,bb.y,60,false,1); api.sfx.boom(); } }
      if(boss && !b.hit.has('boss') && Math.abs(boss.x-b.x)<85+b.r && Math.abs(boss.y-b.y)<35+b.r){ b.hit.add('boss'); boss.hp-=b.emp?3:1; boss.flash=.15; api.sfx.bump(); api.fx.burst(b.x,b.y,'#ff5a36',8,150,.4,3);
        if(boss.hp<=0){ api.addScore(5000,boss.x,boss.y); api.addCoins(10); const bx=boss.x, by=boss.y; for(let k=0;k<8;k++) setTimeout(()=>addBoom(bx+(Math.random()-.5)*160,by+(Math.random()-.5)*50,70,false,1),k*90); api.fx.burst(boss.x,boss.y,'#ffe27a',90,420,1.2,4); api.fx.shake(18); api.fx.flash('#fff',.6); api.sfx.boom(); boss=null; } }
    }
    // wave end
    if(!done && waveGap<=0 && toSpawn<=0 && missiles.length===0 && bombers.length===0 && !boss && inters.length===0){
      if(waveI>=waves.length-1){ done=true; setTimeout(()=>api.stageClear(), 900); }
      else { api.addScore(250); nextWave(); }
    }
    if(!done && stageN>0 && cities.every(c=>!c.alive)){ done=true; api.gameOver(); }
  },
  render(c){
    const sky=api.cos('Sky').colors;
    const gr=c.createLinearGradient(0,0,0,GROUND); gr.addColorStop(0,sky[0]); gr.addColorStop(1,sky[1]); c.fillStyle=gr; c.fillRect(0,0,W,H);
    if(api.cos('Sky').id==='s_aurora'){ c.save(); c.globalAlpha=.18; c.strokeStyle='#1cffb0'; c.lineWidth=40; c.beginPath(); for(let x=0;x<=W;x+=20) c.lineTo(x,200+Math.sin(x*0.01+t*0.5)*60); c.stroke(); c.restore(); }
    for(const s of stars){ c.globalAlpha=0.4+0.4*Math.sin(t*2+s.p); c.fillStyle='#fff'; c.fillRect(s.x,s.y,s.s,s.s); } c.globalAlpha=1;
    c.fillStyle='rgba(255,240,220,0.9)'; c.beginPath(); c.arc(480,110,26,0,Math.PI*2); c.fill(); c.fillStyle=sky[0]; c.beginPath(); c.arc(468,102,24,0,Math.PI*2); c.fill();
    // mountains + ground
    c.fillStyle='#120a2a'; c.beginPath(); c.moveTo(0,GROUND); mountains.forEach((y,i)=>c.lineTo(i*20,y)); c.lineTo(W,GROUND); c.fill();
    c.fillStyle='#0d0820'; c.fillRect(0,GROUND,W,H-GROUND); c.strokeStyle=GAME.theme.a; c.globalAlpha=.6; c.beginPath(); c.moveTo(0,GROUND); c.lineTo(W,GROUND); c.stroke(); c.globalAlpha=1;
    cities.forEach(drawCity.bind(null,c));
    bats.forEach(b=>drawBat(c,b));
    if(shieldT>0){ c.save(); c.globalAlpha=.25+.1*Math.sin(t*10); c.strokeStyle='#36d6ff'; c.fillStyle='rgba(54,214,255,0.08)'; c.lineWidth=3; c.beginPath(); c.ellipse(W/2,GROUND,W*0.55,170,0,Math.PI,0); c.fill(); c.stroke(); c.restore(); }
    // missiles
    c.lineCap='round';
    for(const m of missiles){ c.save(); c.strokeStyle=m.type==='smart'?'#ffe14a':m.type==='mirv'?'#ff4fd8':'#ff3b3b'; c.globalAlpha=.55; c.lineWidth=2; c.beginPath(); c.moveTo(m.sx,m.sy); c.lineTo(m.x,m.y); c.stroke();
      c.globalAlpha=1; c.shadowColor=c.strokeStyle; c.shadowBlur=12; c.fillStyle='#fff'; c.beginPath(); c.arc(m.x,m.y,m.type==='n'?3:4.5,0,Math.PI*2); c.fill(); c.restore(); }

      c.strokeStyle=ic[0]; c.globalAlpha=.6; c.beginPath(); c.moveTo(it.tx-6,it.ty-6); c.lineTo(it.tx+6,it.ty+6); c.moveTo(it.tx+6,it.ty-6); c.lineTo(it.tx-6,it.ty+6); c.stroke(); c.globalAlpha=1; }

    for(const b of bombers){ c.save(); c.translate(b.x,b.y); c.scale(b.vx>0?1:-1,1); c.fillStyle='#2a1a4a'; c.strokeStyle='#ff5a36'; c.lineWidth=2; c.shadowColor='#ff5a36'; c.shadowBlur=10;
      c.beginPath(); c.moveTo(26,0); c.lineTo(-22,-8); c.lineTo(-14,0); c.lineTo(-22,8); c.closePath(); c.fill(); c.stroke(); c.fillStyle=Math.sin(t*12)>0?'#ff3b3b':'#400'; c.fillRect(-20,-2,4,4); c.restore(); }

    if(boss){ c.save(); c.translate(boss.x,boss.y); c.shadowColor='#ff5a36'; c.shadowBlur=24; c.fillStyle=boss.flash>0?'#fff':'#1d0f38'; c.strokeStyle='#ff5a36'; c.lineWidth=3;
      c.beginPath(); c.ellipse(0,0,90,26,0,0,Math.PI*2); c.fill(); c.stroke(); c.beginPath(); c.ellipse(0,-14,38,22,0,Math.PI,0); c.fill(); c.stroke();
      for(let k=-3;k<=3;k++){ c.fillStyle=Math.sin(t*8+k)>0?'#ffe14a':'#ff3b3b'; c.beginPath(); c.arc(k*22,8,4,0,Math.PI*2); c.fill(); }
      c.restore(); c.fillStyle='#300'; c.fillRect(W/2-120,58,240,8); c.fillStyle='#ff5a36'; c.fillRect(W/2-120,58,240*Math.max(0,boss.hp/boss.max),8);

      if(b.emp){ c.strokeStyle='#36d6ff'; c.lineWidth=14; c.globalAlpha=Math.max(0,1-b.r/b.max); c.beginPath(); c.arc(b.x,b.y,b.r,0,Math.PI*2); c.stroke(); continue; }
      if(b.r<=0) continue;

      const g=c.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r); g.addColorStop(0,cols[0]); g.addColorStop(0.45,cols[1]); g.addColorStop(1,'rgba(0,0,0,0)');

      c.globalAlpha=.6; c.strokeStyle=cols[2]; c.lineWidth=2; c.beginPath(); c.arc(b.x,b.y,b.r*0.98,0,Math.PI*2); c.stroke();
    }
    c.restore();
    if(aim && aim.y<GROUND){ c.strokeStyle='#fff'; c.globalAlpha=.7; c.lineWidth=1.5; c.beginPath(); c.arc(aim.x,aim.y,10,0,Math.PI*2); c.moveTo(aim.x-16,aim.y); c.lineTo(aim.x-6,aim.y); c.moveTo(aim.x+6,aim.y); c.lineTo(aim.x+16,aim.y); c.moveTo(aim.x,aim.y-16); c.lineTo(aim.x,aim.y-6); c.moveTo(aim.x,aim.y+6); c.lineTo(aim.x,aim.y+16); c.stroke(); c.globalAlpha=1; }

};

function nextWave(){
  waveI++; const w=waves[waveI]; toSpawn=w.n; spawnT=0.5; waveGap=stageN===0?0.2:2; w._b=0;
  bats.forEach(b=>{ b.dead=false; b.ammo=10+up.ammo; });
  if(waveI>0) api.fx.text(W/2,GROUND-150,'AMMO REFILLED','#36d6ff',20);
  if(w.boss){ boss={x:W/2,y:-60,t:0,hp:Math.round(api.dv([14,20,26],40,120)),max:Math.round(api.dv([14,20,26],40,120)),drop:2,flash:0}; }
}
function target(){
  const cs=cities.filter(c=>c.alive); const bs=bats.filter(b=>!b.dead);
  if(cs.length && (Math.random()<0.72 || !bs.length)) { const c=cs[Math.floor(Math.random()*cs.length)]; return {x:c.x+(Math.random()-.5)*20, y:GROUND-8, city:c}; }
  if(bs.length){ const b=bs[Math.floor(Math.random()*bs.length)]; return {x:b.x, y:GROUND-12, bat:b}; }
  return {x:Math.random()*W, y:GROUND};
}
function mSpeed(){ return (stageN===0?30:api.dv([38,50,62],85,190)+stageN*6)*(0.85+Math.random()*0.3); }
function spawnMissile(w){ const r=Math.random(); const type = w.smart && r<w.smart? 'smart' : w.mirv && r<(w.smart||0)+w.mirv? 'mirv' : 'n'; launchFrom(40+Math.random()*(W-80), -10, type); }
function launchFrom(x,y,type,child){
  const tg=target(); missiles.push({sx:x,sy:y,x,y,tx:tg.x,ty:tg.y,tg,spd:mSpeed()*(child?1.1:1),type,split:280+Math.random()*200});
}
function fire(x,y){
  let best=null, bd=1e9; for(const b of bats){ if(b.dead||b.ammo<=0) continue; const d=Math.abs(b.x-x)+(b.x===300?-20:0); if(d<bd){bd=d;best=b;} }
  if(!best){ api.sfx.bump(); api.toast('OUT OF AMMO'); return; }
  if(stageN===0) best.ammo=Math.max(best.ammo,3); else best.ammo--;
  inters.push({sx:best.x,sy:GROUND-26,x:best.x,y:GROUND-26,tx:x,ty:y}); api.sfx.shoot(); api.event('fire');
}
function addBoom(x,y,r,enemy,chain){ booms.push({x,y,r:0,max:r,t:0,enemy,chain:chain||0,hit:new Set()}); }
function killMissile(m,b){
  const ch=(b.chain||0)+1; const pts=25*ch*(m.type==='n'?1:2);
  api.addScore(pts,m.x,m.y-10); kills++; if(kills===3) api.event('kill3');
  if(ch>=3) api.fx.text(m.x,m.y-30,'CHAIN x'+ch,'#ffe14a',16);
  addBoom(m.x,m.y,34*up.radius,false,ch); api.fx.burst(m.x,m.y,'#ffcf6a',8,140,.4,2); api.sfx.small();
  if(ch>=4) api.addCoins(1);
}
function impact(m){
  addBoom(m.tx,m.ty,40,true); api.sfx.boom(); api.fx.shake(6);
  const tg=m.tg;
  if(shieldT>0 || stageN===0){ api.fx.burst(m.tx,m.ty,'#36d6ff',14,160,.5,3); return; }
  if(tg.city && tg.city.alive){ tg.city.alive=false; api.setLives(cities.filter(c=>c.alive).length); api.sfx.hurt(); api.fx.flash('#ff3b3b',.35); api.fx.burst(tg.city.x,GROUND-20,'#ff8a00',40,260,1,4); api.toast(tg.city.name+' HIT!'); }
  if(tg.bat && !tg.bat.dead){ tg.bat.dead=true; tg.bat.ammo=0; api.fx.burst(tg.bat.x,GROUND-10,'#ff8a00',30,220,.8,3); }
}
function drawCity(c,ct){
  const x=ct.x, g=GROUND;
  if(!ct.alive){ c.fillStyle='#2a1a2a'; c.fillRect(x-24,g-8,48,8); c.fillStyle='#ff5a36'; c.globalAlpha=.4+.3*Math.sin(t*6+x); c.fillRect(x-14,g-12,4,4); c.fillRect(x+6,g-10,3,3); c.globalAlpha=1; return; }
  c.save(); c.fillStyle='#1a1440'; c.strokeStyle=GAME.theme.b; c.lineWidth=1.2; c.shadowColor=GAME.theme.b; c.shadowBlur=8;
  const s=ct.seed, bl=[[-24,26,12],[-11,40,11],[1,30,10],[12,22,12]];
  if(s===0){ c.beginPath(); c.moveTo(x+2,g-78); c.lineTo(x+4,g-44); c.lineTo(x,g-44); c.closePath(); c.fill(); c.stroke(); c.beginPath(); c.arc(x+2,g-56,5,0,Math.PI*2); c.fill(); c.stroke(); }
  if(s===3){ c.beginPath(); c.moveTo(x-30,g); c.lineTo(x-20,g-42); c.lineTo(x+20,g-42); c.lineTo(x+30,g); c.closePath(); c.fillStyle='#120e2e'; c.fill(); c.stroke(); c.fillStyle='#1a1440'; }
  if(s===2){ c.beginPath(); c.arc(x,g-2,26,Math.PI,0); c.stroke(); }
  for(const [ox,h,w] of bl){ const hh=h*(0.7+((s*7+ox)&7)/14); c.fillRect(x+ox,g-hh,w,hh); c.strokeRect(x+ox,g-hh,w,hh); }
  c.shadowBlur=0; c.fillStyle='#ffe27a';
  for(const [ox,h,w] of bl){ const hh=h*(0.7+((s*7+ox)&7)/14); for(let yy=g-hh+4;yy<g-3;yy+=6) for(let xx=x+ox+2;xx<x+ox+w-2;xx+=4){ if(((xx*13+yy*7+s)%5)<2) c.fillRect(xx,yy,2,2); } }
  c.restore();
  c.font='bold 8px Orbitron, sans-serif'; c.textAlign='center'; c.fillStyle='rgba(255,255,255,0.55)'; c.fillText(ct.name,x,g+14);
}
function drawBat(c,b){
  const x=b.x, g=GROUND;
  c.save(); c.fillStyle=b.dead?'#2a1a2a':'#221a4a'; c.strokeStyle=b.dead?'#553':'#36d6ff'; c.lineWidth=2; c.shadowColor='#36d6ff'; c.shadowBlur=b.dead?0:10;
  c.beginPath(); c.moveTo(x-30,g); c.lineTo(x-18,g-22); c.lineTo(x+18,g-22); c.lineTo(x+30,g); c.closePath(); c.fill(); c.stroke();

  const low=b.ammo<=3, col=b.dead||b.ammo<=0?'#ff3b3b':low?'#ffe14a':'#ffffff';
  const blink=(b.dead||b.ammo<=0) && Math.floor(t*4)%2;
  c.globalAlpha=blink?0.45:1;
  c.fillStyle='rgba(5,4,16,0.85)'; c.strokeStyle=col; c.lineWidth=2;
  c.beginPath(); if(c.roundRect) c.roundRect(x-30,g-62,60,32,9); else c.rect(x-30,g-62,60,32); c.fill(); c.stroke();
  c.fillStyle=col; c.textAlign='center'; c.shadowColor=col; c.shadowBlur=8;
  if(b.dead){ c.font='bold 13px Orbitron, sans-serif'; c.fillText('DOWN',x,g-41); }
  else if(b.ammo<=0){ c.font='bold 13px Orbitron, sans-serif'; c.fillText('EMPTY',x,g-41); }
  else { c.font='bold 22px Orbitron, sans-serif'; c.fillText(b.ammo,x,g-37); }
  c.globalAlpha=1; c.shadowBlur=0;
  // ammo shells under the battery (bigger than before, 10 per row)
  if(!b.dead){ for(let i=0;i<b.ammo;i++){ const col2=i%10, row=Math.floor(i/10); c.fillStyle=low?'#ffe14a':'#e8f6ff'; c.fillRect(x-27+col2*5.6,g+14+row*14,3.6,10); c.fillStyle='#ff5a36'; c.fillRect(x-27+col2*5.6,g+14+row*14,3.6,3); } }
  c.restore();
}
function drawAmmoBar(c){
  // total ammo readout, top-left of the play area + big counter in the top bar
  const tot=bats.reduce((s,b)=>s+(b.dead?0:b.ammo),0), max=bats.length*(10+up.ammo);
  const low=tot<=6, col=tot===0?'#ff3b3b':low?'#ffe14a':'#36d6ff';
  api.counter('🚀 AMMO', tot===0?'EMPTY':tot+' / '+max, tot===0?'empty':low?'low':'');
  c.save();
  if(low && stageN>0 && Math.floor(t*3)%2){ c.textAlign='center'; c.font='bold 18px Orbitron, sans-serif'; c.fillStyle=col; c.shadowColor=col; c.shadowBlur=12; c.fillText(tot===0?'OUT OF AMMO — WAIT FOR NEXT WAVE':'LOW AMMO!',W/2,GROUND-110); }
  c.restore();
}
})();

<script>
/* ===== REMIX ARCADE SHELL v1.4 — shared menus, saves, ability shop, gold coins, HUD, tutorial, input, fx ===== */
(function(){

/* ---------- abilities: count based (like Jayden Kong) ----------
   Abilities with cd:0 are core gameplay (e.g. Blast Grid bombs) and are always free.
   Every other ability is a stock you hold: you get 1 of each when you start a new game,
   after that you buy more with gold coins in the Ability Shop. */
const BUY = G.abilities.filter(a=>a.cd>0);
function abPrice(a){ return a.price || Math.max(30, Math.round((20 + a.cd*2.2)/5)*5); }
const GOLD_PACKS = [{gold:500, price:'$1'},{gold:1500, price:'$2'},{gold:4000, price:'$3'}];
const COIN_CAP = 60;      // max gold coins that can drop from play in one stage

/* ---------- storage (never trust it) ---------- */
function blankProfile(){ return {coins:0, owned:[], equipped:{}, tutDone:false, sound:true, lastName:'', diff:0, scores:{0:[],1:[],2:[]}, slots:[null,null,null], abil:{}}; }
let P;
try { P = JSON.parse(localStorage.getItem(KEY)) || blankProfile(); } catch(e){ P = blankProfile(); }
P = Object.assign(blankProfile(), P); if(!P.abil || typeof P.abil!=='object') P.abil={};
function save(){ try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e){} }
G.shop.forEach(it => { if(it.cost === 0 && !P.owned.includes(it.id)) P.owned.push(it.id); if(it.cost===0 && !P.equipped[it.cat]) P.equipped[it.cat] = it.id; });
function have(a){ return a.cd>0 ? (P.abil[a.id]||0) : Infinity; }
function starterKit(){ BUY.forEach(a=>{ if(!(P.abil[a.id]>0)) P.abil[a.id]=1; }); save(); }

/* ---------- audio (tiny synth) ---------- */
let AC = null;
function audioInit(){ if(AC) return; try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
function tone(f1, f2, dur, type, vol){
  if(!AC || !P.sound) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t+dur);
  g.gain.setValueAtTime(vol||0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.02);
}
function noise(dur, vol){
  if(!AC || !P.sound) return;
  const n = AC.sampleRate*dur, b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1-i/n);

  s.connect(g); g.connect(AC.destination); s.start();

const SFX = {
  click(){ tone(600,900,.06,'square',.05); }, shoot(){ tone(900,300,.09,'square',.04); },
  boom(){ noise(.35,.18); tone(160,40,.3,'sawtooth',.06); }, small(){ noise(.12,.08); },
  pickup(){ tone(700,1400,.1,'triangle',.07); }, power(){ tone(300,1200,.25,'sawtooth',.06); },
  hurt(){ tone(400,60,.45,'sawtooth',.09); }, clear(){ [0,.1,.2,.3].forEach((d,i)=>setTimeout(()=>tone(500+i*200,800+i*200,.15,'triangle',.07),d*1000)); },
  bump(){ tone(220,440,.07,'triangle',.07); }, blip(){ tone(1200,1000,.03,'square',.03); },
  coin(){ tone(1320,1760,.07,'square',.035); },
  over(){ [0,.18,.36].forEach((d,i)=>setTimeout(()=>tone(400-i*90,120,.3,'sawtooth',.07),d*1000)); }
};

/* ---------- canvas + layout ----------
   The screen is split: a 46px strip on top (score, stage, lives, gold, END) and an
   84px ability bar (bottom on tall screens, left side on wide screens). The game is
   scaled into whatever is left, so the buttons never sit on top of the play area. */
const TOPH = 46, BARS = 84;
const app = $('#app'), cv = $('#game'), ctx = cv.getContext('2d');
let scale = 1, offX = 0, offY = 0, dpr = 1;
function resize(){
  // top strip + ability bar sit ABOVE the game on every screen, so they are always in view
  const W = window.innerWidth, H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio||1, 2);
  const ay = TOPH+BARS, aw = W, ah = H-ay-6;
  scale = Math.min(aw/G.w, ah/G.h);
  const cw = G.w*scale, ch = G.h*scale; offX = (aw-cw)/2; offY = ay+(ah-ch)/2;
  cv.style.width = cw+'px'; cv.style.height = ch+'px'; cv.style.left = offX+'px'; cv.style.top = offY+'px';
  cv.width = Math.round(cw*dpr); cv.height = Math.round(ch*dpr);
}
window.addEventListener('resize', resize); resize();
function toGame(cx, cy){ return {x:(cx-offX)/scale, y:(cy-offY)/scale}; }

/* ---------- FX ---------- */
const parts = [], texts = []; let shakeT = 0, shakeA = 0, flashA = 0, flashC = '#fff';
const FX = {
  burst(x,y,color,n,spd,life,size){ n=n||16; for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=(spd||200)*(0.3+Math.random()*0.9); parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:(life||0.6)*(0.6+Math.random()*0.6),max:life||0.6,c:color,s:size||3}); } if(parts.length>900) parts.splice(0,parts.length-900); },
  spark(x,y,vx,vy,color,life,size){ parts.push({x,y,vx,vy,life:life||.4,max:life||.4,c:color,s:size||2}); },
  shake(a){ shakeA = Math.max(shakeA, a); shakeT = .3; },
  flash(c,a){ flashC=c||'#fff'; flashA=a||.5; },
  text(x,y,t,c,size){ texts.push({x,y,t,c:c||'#fff',life:1,size:size||18}); }
};
function fxUpdate(dt){
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.life-=dt; if(p.life<=0){parts.splice(i,1);continue;} p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.97; p.vy*=0.97; }
  for(let i=texts.length-1;i>=0;i--){ const t=texts[i]; t.life-=dt; t.y-=40*dt; if(t.life<=0) texts.splice(i,1); }
  if(shakeT>0){ shakeT-=dt; if(shakeT<=0) shakeA=0; }
  flashA = Math.max(0, flashA - dt*2);
}
function fxRender(c){
  c.save(); c.globalCompositeOperation = 'lighter';
  for(const p of parts){ c.globalAlpha = Math.max(0,p.life/p.max); c.fillStyle = p.c; c.fillRect(p.x-p.s/2, p.y-p.s/2, p.s, p.s); }
  c.restore();
  c.save(); c.textAlign='center';
  for(const t of texts){ c.globalAlpha=Math.min(1,t.life*2); c.font='bold '+t.size+'px Orbitron, sans-serif'; c.fillStyle=t.c; c.shadowColor=t.c; c.shadowBlur=10; c.fillText(t.t,t.x,t.y); }
  c.restore();
  if(flashA>0){ c.save(); c.globalAlpha=flashA; c.fillStyle=flashC; c.fillRect(0,0,G.w,G.h); c.restore(); }
}

/* ---------- gold coins: pop out where you score, then fly up to the gold counter ---------- */
const coinsFly = []; let lastX = G.w/2, lastY = G.h/2;
function spawnCoin(x,y,v){
  if(run.tutorial || state!=='play') return;
  const a = -Math.PI/2 + (Math.random()-.5)*1.6, s = 120+Math.random()*120;
  coinsFly.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,v:v||1,spin:Math.random()*6});
}
function coinTarget(){ const r=$('#hudCoinBox').getBoundingClientRect(); return toGame(r.left+r.width/2, r.top+r.height/2); }
function creditCoin(v){
  P.coins += v; run.coinsStage += v; updCoins();
  const el=$('#hudCoinBox'); el.classList.add('bump'); setTimeout(()=>el.classList.remove('bump'),120);
}
function coinUpdate(dt){
  if(!coinsFly.length) return;
  const tg = coinTarget(); let got=0;
  for(let i=coinsFly.length-1;i>=0;i--){ const c=coinsFly[i]; c.t+=dt; c.spin+=dt*9;
    if(c.t<0.55){ c.vy+=380*dt; c.x+=c.vx*dt; c.y+=c.vy*dt; c.vx*=0.96; }
    else { const dx=tg.x-c.x, dy=tg.y-c.y, d=Math.hypot(dx,dy), sp=900+ (c.t-0.55)*1800;
      if(d<sp*dt || c.t>2.5 || c.y<-10){ coinsFly.splice(i,1); got+=c.v; continue; }
      c.x+=dx/d*sp*dt; c.y+=dy/d*sp*dt; } }
  if(got){ creditCoin(got); SFX.coin(); save(); }
}
function flushCoins(){ let v=0; coinsFly.forEach(c=>v+=c.v); coinsFly.length=0; if(v){ P.coins+=v; run.coinsStage+=v; save(); updCoins(); } }
function coinRender(c){
  for(const k of coinsFly){ const w=Math.abs(Math.cos(k.spin))*9+1.5;
    c.save(); c.translate(k.x,k.y); c.shadowColor='#ffd24a'; c.shadowBlur=12;
    const g=c.createRadialGradient(-2,-3,1,0,0,10); g.addColorStop(0,'#fff6c8'); g.addColorStop(.5,'#ffd23f'); g.addColorStop(1,'#b8860b');
    c.fillStyle=g; c.beginPath(); c.ellipse(0,0,w,10,0,0,Math.PI*2); c.fill();
    c.shadowBlur=0; c.strokeStyle='#8a5a00'; c.lineWidth=1.5; c.beginPath(); c.ellipse(0,0,w*0.62,6.2,0,0,Math.PI*2); c.stroke(); c.restore(); }
}

const keys = {}; const joy = {active:false, id:null, sx:0, sy:0, x:0, y:0};
const joyEl = $('#joy');
window.addEventListener('keydown', e => {
  audioInit();

document.addEventListener('visibilitychange', ()=>{ if(document.hidden && state==='play') pauseGame(); });
const Input = {
  keys,
  dir(){
    let x=0,y=0;
    if(keys.ArrowLeft||keys.KeyA) x-=1; if(keys.ArrowRight||keys.KeyD) x+=1;
    if(keys.ArrowUp||keys.KeyW) y-=1; if(keys.ArrowDown||keys.KeyS) y+=1;
    if(joy.active){ const dx=joy.x-joy.sx, dy=joy.y-joy.sy, m=Math.hypot(dx,dy); if(m>12){ x=dx/Math.max(m,50); y=dy/Math.max(m,50); } }
    return {x,y};
  },
  dir4(){ const d=Input.dir(); if(Math.abs(d.x)<0.2 && Math.abs(d.y)<0.2) return null; if(Math.abs(d.x)>Math.abs(d.y)) return d.x>0?'R':'L'; return d.y>0?'D':'U'; },
  touch: false
};
function onDown(e){
  audioInit();
  if(state!=='play') return;
  if(e.target.closest && e.target.closest('button,#tut,#bar,#hudTop')) return;
  if(e.pointerType !== 'mouse') Input.touch = true;

function onMove(e){

    joy.x=e.clientX; joy.y=e.clientY; let dx=joy.x-joy.sx, dy=joy.y-joy.sy; const m=Math.hypot(dx,dy);
    if(m>50){dx=dx/m*50;dy=dy/m*50;} joyEl.firstElementChild.style.transform=`translate(${dx}px,${dy}px)`;
  }

/* ---------- run state ---------- */
let state = 'loading'; // loading, menu, play, paused, modal
const run = {slot:0, stage:1, score:0, lives:3, tutorial:false, practice:false, coinsStage:0, dropN:0, time:0, extra:{}};
const abLock = G.abilities.map(()=>0); const abBadge = G.abilities.map(()=>null); const abActive = G.abilities.map(()=>false);

const API = {
  get diff(){ return P.diff; }, get diffName(){ return DIFFS[P.diff]; },
  get stage(){ return run.stage; }, get score(){ return run.score; }, get lives(){ return run.lives; },
  get tutorial(){ return run.tutorial; },
  // ---- 100-stage difficulty ----
  // level: EASY stage N = level N. HARD starts at level 50, EXPERT at level 100 (and climb to 199).
  // BEGINNER stage N = level N (stage 50 = HARD level). HARD stage N = level N+49.
  // EXPERT starts at HARD stage 80 (level 129), stays there for 3 stages, then jumps +14 levels EVERY stage.
  get level(){ if(run.tutorial) return 1; const s=run.stage; return P.diff===0? s : P.diff===1? s+49 : 128+s+Math.max(0,s-3)*14; },
  // dk: smooth difficulty 0..4 (level 1 = 0, level 50 = 1 = old HARD, level 100 = 2 = old EXPERT)
  get dk(){ return (API.level-1)/49.5; },
  // dv([easy,hard,expert], cap): value smoothly scaled by level; past old EXPERT it keeps rising at half speed
  // dv([easy,hard,expert], cap, expertCap): keeps climbing past the 3rd value at full speed.
  // On EXPERT the (much higher) expertCap applies, so Expert keeps getting harder until it's unbeatable.
  dv(arr, cap, xcap){ const k=API.dk; let v;
    if(k<=1) v=arr[0]+(arr[1]-arr[0])*k; else if(k<=2) v=arr[1]+(arr[2]-arr[1])*(k-1); else v=arr[2]+(arr[2]-arr[1])*(k-2);
    if(P.diff===2 && xcap!==undefined) cap=xcap;
    // cap = the limit it never passes (a max for rising values, a min for falling values)
    if(cap!==undefined) v = arr[2]>=arr[0] ? Math.min(cap,v) : Math.max(cap,v); return v; },
  get boss(){ return !run.tutorial && run.stage%(P.diff===2?5:10)===0; },
  // content: which stage design to use. 0 = tutorial, 3 = boss design (every 10th stage),
  // 1 = basic design, 2 = advanced design (mixed in from level 4, most stages from level 40)
  get content(){ if(run.tutorial) return 0; if(API.boss) return 3; if(P.diff===2) return 2; const L=API.level; if(L<=3) return 1; if(L>=40) return run.stage%4===1?1:2; return run.stage%2?1:2; },
  input: Input, fx: FX, sfx: SFX, W: G.w, H: G.h,
  // addScore(points, x, y, quiet): with a position, gold coins can pop out there.
  // quiet = no floating "+10" text (used for pellets / blocks).
  addScore(n, x, y, quiet){
    run.score += Math.round(n);
    if(x!==undefined){ lastX=x; lastY=y; if(!quiet) FX.text(x,y,'+'+Math.round(n), G.theme.b, 15);
      if(run.dropN<COIN_CAP && Math.random() < Math.min(1, n/(G.coinPts||100))){ run.dropN++; spawnCoin(x,y,1); } }
    updHud();
  },
  // bonus gold for special moves: pops out at the last scoring spot
  addCoins(n){ for(let i=0;i<n;i++) spawnCoin(lastX+(Math.random()-.5)*20, lastY, 1); },
  setLives(n){ run.lives = n; updHud(); },
  loseLife(){
    if(run.tutorial){ toast('TRY AGAIN!'); G.respawn && G.respawn(); return; }
    run.lives--; updHud(); SFX.hurt(); FX.shake(10); FX.flash('#f24',.35);
    if(run.lives<=0) setTimeout(gameOver, 900); else { toast('LIFE LOST'); G.respawn && G.respawn(); }
  },
  stageClear(){ if(state!=='play') return; if(run.tutorial){ tutFinish(); return; } stageClear(); },
  gameOver(){ if(state==='play') setTimeout(gameOver, 600); },
  event(name){ tutEvent(name); },
  toast(t){ toast(t); },
  cos(cat){ const id = P.equipped[cat]; return G.shop.find(s=>s.id===id) || G.shop.find(s=>s.cat===cat); },
  badge(i, txt){ abBadge[i]=txt; },
  setActive(i, on){ abActive[i]=on; },
  resetCooldown(i){ abLock[i]=0; },
  // big always-visible counter in the top bar (e.g. Sky Shield ammo). level: '', 'low' or 'empty'
  counter(label, value, level){ setCounter(label, value, level); },
  choice(title, opts, cb){ showChoice(title, opts, cb); },
  get extra(){ return run.extra; },
  saveNow(){ if(!run.tutorial) writeSlot(); },
  rand: Math.random
};
G.api = API;

function useAbility(i){
  if(state!=='play') return; const a=G.abilities[i];
  if(abLock[i]>0) return;
  const paid = a.cd>0 && !run.tutorial;
  if(paid && have(a)<=0){ toast('NO '+a.name+' LEFT'); SFX.bump(); flashShop(); return; }
  if(G.useAbility(a.id)!==false){

    abLock[i] = a.cd>0 ? 1 : 0; tutEvent('ab_'+a.id);

function updAbilities(dt){

    el.classList.toggle('empty', empty);

let tutIdx=0, tutTimer=0; const tutSeen=new Set();
function tutShow(){
  const st = G.tutorial[tutIdx]; const el=$('#tut');
  if(!st){ el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  const txt = (Input.touch || matchMedia('(hover:none)').matches) && st.touch ? st.touch : st.text;
  el.innerHTML = `<div class="tt"><span>TUTORIAL ${tutIdx+1}/${G.tutorial.length}</span><button id="tutSkip">SKIP ▶▶</button></div><div>${txt}</div>`;
  $('#tutSkip').onclick = e=>{ e.stopPropagation(); SFX.click(); tutFinish(); };
  tutTimer = 0;
}
function tutEvent(name){
  if(!run.tutorial) return; tutSeen.add(name); const st=G.tutorial[tutIdx]; if(!st) return;
  if(st.ev===name){ SFX.pickup(); tutIdx++; if(tutIdx>=G.tutorial.length) tutFinish(); else tutShow(); }
}
function tutUpdate(dt){
  if(!run.tutorial) return; const st=G.tutorial[tutIdx]; if(!st) return;
  tutTimer+=dt; if(st.ev && tutSeen.has(st.ev) && tutTimer>=1.8){ SFX.pickup(); tutIdx++; if(tutIdx>=G.tutorial.length) tutFinish(); else tutShow(); return; }
  if(st.time && tutTimer>=st.time){ tutIdx++; if(tutIdx>=G.tutorial.length) tutFinish(); else tutShow(); }
}
function tutFinish(){
  if(!run.tutorial) return;
  run.tutorial=false; $('#tut').classList.add('hidden'); P.tutDone=true; save(); SFX.clear();
  if(run.practice){ modal(`<h2>TUTORIAL DONE</h2><p>You're ready. Head back to the menu and start a new game.</p><button class="big" data-a="menu">MAIN MENU</button>`, {menu:toMenu}); return; }
  modal(`<h2>TUTORIAL COMPLETE</h2><p>Nice work! Now the real game begins.</p><p>Abilities were free in the tutorial. From now on you have <b>1 of each</b>. Collect 🪙 gold while you play and buy more in the 🛒 SHOP.</p><p><b>Stage 1</b> — ${DIFFS[P.diff]}</p><button class="big" data-a="go">START STAGE 1</button>`, {go:()=>{ run.stage=1; run.score=0; run.lives=G.lives; run.extra={}; writeSlot(); beginStage(); }});

   mailto: links do nothing on PCs with no mail app set up, so the popup shows the

function copyText(txt){
  if(navigator.clipboard && window.isSecureContext){ return navigator.clipboard.writeText(txt).then(()=>true, ()=>legacyCopy(txt)); }
  return Promise.resolve(legacyCopy(txt));
}
function legacyCopy(txt){
  try { const ta=document.createElement('textarea'); ta.value=txt; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,txt.length); const ok=document.execCommand('copy'); ta.remove(); return ok; } catch(e){ return false; }

/* ---------- DOUBLE UP OR LOSS (slots, earned coins only) ---------- */
const SYM=['🍒','🍋','🔔','⭐','💎','7️⃣'], SW=[30,25,18,12,6,4], SWT=95;
const PAY3=[6,10,18,35,100,300], PAYCC=2.5, PAYC=0.6;
const PAYM={2:[0.4,0.4,0.4,0.4,0.4,0.4],3:[4,5,11,18,45,90],4:[14,23,40,75,180,450],5:[55,90,180,360,1100,3600]};
const WHEEL=[0,0.5,2,0,1,2,0,0.5,1,0,1.5,3];
const WCOL=['#2a1a4a','#3a6bff','#ff2bd6','#2a1a4a','#20c070','#ff7b1c','#2a1a4a','#3a6bff','#20c070','#2a1a4a','#a066ff','#ffd23f'];
let sTab=0, sBet=10, sPend=0, sSpin=false, sDbl=0, wheelRot=0;
function sPick(){ let r=Math.random()*SWT; for(let i=0;i<SYM.length;i++){ r-=SW[i]; if(r<0) return i; } return 0; }
function slotsBack(){ if(sSpin) return; if(sPend>0){ P.coins+=sPend; sPend=0; save(); } toMenu(); }
function slotsPanel(){
  const names=['CLASSIC 3','MEGA 5','LUCKY WHEEL'];
  let m='';
  if(sTab===0) m=`<div class="reels">${[0,1,2].map(i=>`<div class="reel" id="r${i}">${SYM[[5,4,3][i]]}</div>`).join('')}</div>`;
  if(sTab===1) m=`<div class="reels five">${[0,1,2,3,4].map(i=>`<div class="reel" id="r${i}">${SYM[i%6]}</div>`).join('')}</div>`;
  if(sTab===2){ const grad=WHEEL.map((_,i)=>`${WCOL[i]} ${i*30}deg ${(i+1)*30}deg`).join(','); m=`<div class="wheel-box"><div class="wheel-ptr"></div><div class="wheel" id="wh" style="background:conic-gradient(${grad});transform:rotate(${wheelRot}deg)"><div class="wheel-lbl">${WHEEL.map((v,i)=>`<span style="transform:rotate(${i*30+15}deg);transform-origin:18px 104px">${v?'x'+v:'✕'}</span>`).join('')}</div></div></div>`; }
  const pt = sTab===0? `3 in a row: 🍒x6 · 🍋x10 · 🔔x18 · ⭐x35 · 💎x100 · 7️⃣x300<br>🍒🍒 first two: x2.5 · 🍒 first: x0.6` :
             sTab===1? `Match from the left — any 2: x0.4<br>3 / 4 / 5 in a row: 🍒 4/14/55 · 🍋 5/23/90 · 🔔 11/40/180<br>⭐ 18/75/360 · 💎 45/180/1100 · 7️⃣ 90/450/3600` :
             `Spin the wheel: win x0.5 up to x3 your bet, or lose it (✕).`;
  const h=`<div class="slot-wrap">
    <div class="tabs" style="width:100%">${names.map((n,i)=>`<button data-st="${i}" class="${i===sTab?'on':''}">${n}</button>`).join('')}</div>
    <div class="slot-coins coins">🪙 <span id="slC">${P.coins.toLocaleString()}</span></div>
    ${m}
    <div class="bets">${[10,25,50,100].map(b=>`<button data-bet="${b}" class="${b===sBet?'on':''}">BET ${b}</button>`).join('')}</div>
    <div class="slot-msg" id="slMsg">${sPend>0?'':'Good luck!'}</div>
    <button class="big casino" id="slSpin" style="width:100%">🎰 SPIN · 🪙${sBet}</button>
    <div class="dbl hidden" id="dbl"><div>WIN <b class="coins" id="dAmt">0</b> — <b>DOUBLE UP OR LOSS?</b></div><div class="coin" id="coinEl">?</div>
      <div class="row" style="width:100%"><button class="mid" id="dH">HEADS (x2)</button><button class="mid" id="dT">TAILS (x2)</button></div><button class="big" id="dC" style="width:100%">COLLECT</button></div>
    <div class="paytable">${pt}</div>
    <p style="font-size:11px;opacity:.55;text-align:center;font-family:Segoe UI,sans-serif">Uses coins you earned by playing only. Coins can't be bought for this. Just for fun: on average the machines keep about 8% of what's bet.</p>
  </div>`;
  panel('DOUBLE UP OR LOSS', h, slotsBack);
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{ if(sSpin||sPend>0) return; SFX.click(); sTab=+b.dataset.st; slotsPanel(); });

  $('#slSpin').onclick=slotSpin;

  if(sPend>0) showDbl();
}
function sMsg(t,cls){ const e=$('#slMsg'); if(e){ e.textContent=t; e.className='slot-msg '+(cls||''); } }
function sCoins(){ const e=$('#slC'); if(e) e.textContent=P.coins.toLocaleString(); }
function slotSpin(){
  if(sSpin||sPend>0) return;
  if(P.coins<sBet){ sMsg('Not enough coins — play to earn more!','lose'); SFX.bump(); return; }
  P.coins-=sBet; save(); sCoins(); sSpin=true; $('#pBack').disabled=true; $('#slSpin').disabled=true; sMsg('Spinning…'); SFX.click();
  if(sTab===2){ const seg=Math.floor(Math.random()*WHEEL.length); const target=(360-(seg*30+15))%360; wheelRot += 360*5 + ((target-(wheelRot%360))+360)%360; $('#wh').style.transform=`rotate(${wheelRot}deg)`;
    let k=0; const tick=setInterval(()=>{ SFX.blip(); if(++k>24) clearInterval(tick); },140);
    setTimeout(()=>finishSpin(Math.floor(sBet*WHEEL[seg]), WHEEL[seg]? 'x'+WHEEL[seg]+'!' : ''),3800); return; }
  const n=sTab===0?3:5, res=Array.from({length:n},sPick), els=[...Array(n)].map((_,i)=>$('#r'+i));
  els.forEach(e=>{ e.classList.add('spin'); e.classList.remove('win'); });
  const iv=setInterval(()=>els.forEach((e,i)=>{ if(e.classList.contains('spin')) e.textContent=SYM[Math.floor(Math.random()*6)]; }),70);
  els.forEach((e,i)=>setTimeout(()=>{ e.classList.remove('spin'); e.textContent=SYM[res[i]]; SFX.bump(); if(i===n-1){ clearInterval(iv); evalReels(res,els); } }, 600+i*(n===3?350:250)));
}
function evalReels(r,els){
  let mult=0, hl=0;
  if(r.length===3){ if(r[0]===r[1]&&r[1]===r[2]){ mult=PAY3[r[0]]; hl=3; } else if(r[0]===0&&r[1]===0){ mult=PAYCC; hl=2; } else if(r[0]===0){ mult=PAYC; hl=1; } }
  else { let k=1; while(k<5&&r[k]===r[0]) k++; if(k>=2){ mult=PAYM[k][r[0]]; hl=k; } }
  for(let i=0;i<hl;i++) els[i].classList.add('win');
  finishSpin(Math.floor(sBet*mult), mult>=20?'JACKPOT!':mult?'x'+mult:'');
}
function finishSpin(win,label){
  sSpin=false; const pb=$('#pBack'); if(pb) pb.disabled=false; const sb=$('#slSpin'); if(sb) sb.disabled=false;
  if(win>0){ sPend=win; sDbl=0; SFX.clear(); sMsg(`${label} YOU WIN ${win} 🪙`,'win'); showDbl(); }
  else { SFX.over(); sMsg('No win this time','lose'); }
}
function showDbl(){ const d=$('#dbl'); if(!d) return; d.classList.remove('hidden'); $('#dAmt').textContent=sPend; $('#slSpin').disabled=true;
  const can=sDbl<5; $('#dH').disabled=!can; $('#dT').disabled=!can; if(!can) sMsg('Max 5 double-ups — collect your coins!','win'); }
function dblFlip(pickSide){
  if(sPend<=0) return; const c=$('#coinEl'); c.classList.remove('flip'); void c.offsetWidth; c.classList.add('flip'); $('#dH').disabled=$('#dT').disabled=$('#dC').disabled=true; SFX.power();
  const side=Math.random()<0.5?0:1;
  setTimeout(()=>{ c.textContent=side?'T':'H'; $('#dC').disabled=false;
    if(side===pickSide){ sPend*=2; sDbl++; SFX.clear(); sMsg(`DOUBLED! ${sPend} 🪙`,'win'); showDbl(); }
    else { sMsg(`LOSS! The coin was ${side?'TAILS':'HEADS'}`,'lose'); SFX.hurt(); sPend=0; $('#dbl').classList.add('hidden'); $('#slSpin').disabled=false; } },900);
}
function dblCollect(){ if(sPend<=0) return; P.coins+=sPend; sMsg(`Collected ${sPend} 🪙`,'win'); sPend=0; save(); sCoins(); SFX.pickup(); $('#dbl').classList.add('hidden'); $('#slSpin').disabled=false; }

function newGame(i){
  run.slot=i; run.stage=1; run.score=0; run.lives=G.lives; run.extra={}; writeSlot();
  starterKit();
  if(!P.tutDone) startTutorial(false); else beginStage();
}
function continueSlot(i){
  const s=P.slots[i]; run.slot=i; run.stage=s.stage; run.score=s.score; run.lives=s.lives; run.extra=JSON.parse(JSON.stringify(s.extra||{})); P.diff=s.diff; save(); beginStage();
