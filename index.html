<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Remix Arcade</title><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#2a1060,#05030f 70%);color:#fff;font-family:Orbitron,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:18px 14px 30px}
h1{font-size:clamp(28px,8vw,52px);margin:4px 0 2px;background:linear-gradient(90deg,#ff3dd6,#3dffd8);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
.sub{opacity:.75;margin:0 0 16px;text-align:center;font-family:system-ui,sans-serif;font-size:14px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(900px,100%);transition:opacity .2s,transform .2s}
.g.out{opacity:0;transform:translateX(-30px)}
.c{display:flex;gap:10px;align-items:center;padding:8px;border-radius:14px;cursor:pointer;color:#fff;background:rgba(255,255,255,.05);border:2px solid color-mix(in srgb,var(--c) 70%,transparent);box-shadow:0 0 12px color-mix(in srgb,var(--c) 25%,transparent);transition:transform .12s,box-shadow .12s;text-align:left;font:inherit}
.c:hover,.c:focus-visible{transform:translateY(-2px);box-shadow:0 0 22px color-mix(in srgb,var(--c) 55%,transparent);outline:none}
.c.last{background:color-mix(in srgb,var(--c) 16%,transparent)}
.g.picking .c:not(.sel){opacity:.45;filter:saturate(.6)}
.c.sel{position:relative;opacity:1;transform:scale(1.04);background:color-mix(in srgb,var(--c) 30%,#05030f);border-color:var(--c);box-shadow:0 0 0 2px var(--c),0 0 34px var(--c);z-index:2;animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 2px var(--c),0 0 14px var(--c)}}
.c .go{display:none;position:absolute;right:8px;bottom:8px;padding:6px 12px;border-radius:16px;background:var(--c);color:#05030f;font-weight:900;font-size:12px;letter-spacing:.06em;box-shadow:0 0 14px var(--c)}
.c.sel .go{display:block}
.c.sel .snip{animation:flash .9s ease-in-out infinite;border-color:var(--c)}
.c.sel b{animation:tflash .9s ease-in-out infinite}
@keyframes flash{0%,100%{filter:brightness(1);box-shadow:0 0 0 0 var(--c)}50%{filter:brightness(1.6) saturate(1.3);box-shadow:0 0 18px 4px var(--c)}}
@keyframes tflash{0%,100%{color:var(--c);text-shadow:none}50%{color:#fff;text-shadow:0 0 10px var(--c),0 0 20px var(--c)}}
.hint{font-family:system-ui,sans-serif;font-size:13px;opacity:.8;margin:-6px 0 12px;text-align:center;min-height:18px}
@media (max-width:480px){ .c .go{right:6px;bottom:6px;font-size:11px;padding:5px 9px} }
.c .snip{flex:none;width:76px;height:76px;border-radius:10px;overflow:hidden;border:1px solid color-mix(in srgb,var(--c) 60%,transparent);background:#000}
.c .snip img{width:100%;height:100%;object-fit:cover;display:block}
.c b{display:block;font-size:13px;color:var(--c);letter-spacing:.03em}
.c span{display:block;font-family:system-ui,sans-serif;opacity:.75;font-size:12px;margin-top:3px}
.c em{display:inline-block;font-style:normal;font-size:9px;letter-spacing:.08em;padding:2px 6px;border-radius:8px;margin-top:5px;font-weight:900}
em.full{background:#3bff7a22;color:#3bff7a;border:1px solid #3bff7a77} em.test{background:#ffd23f22;color:#ffd23f;border:1px solid #ffd23f77}
.pager{display:flex;align-items:center;gap:14px;margin-top:20px}
.arrow{width:58px;height:58px;border-radius:50%;border:2px solid #3dffd8;background:rgba(5,4,16,.75);color:#3dffd8;font-size:24px;font-weight:900;cursor:pointer;box-shadow:0 0 16px #3dffd866}
.arrow:disabled{opacity:.25;cursor:default}
.pg{font-size:13px;letter-spacing:.12em;min-width:120px;text-align:center}
.pg small{display:block;font-family:system-ui,sans-serif;letter-spacing:0;opacity:.6;font-size:11px;margin-top:3px}
.foot{font-family:system-ui,sans-serif;font-size:12px;opacity:.5;margin-top:18px;text-align:center}
/* pop-up */
.ov{position:fixed;inset:0;background:rgba(3,2,10,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9;opacity:0;pointer-events:none;transition:opacity .18s}
.ov.on{opacity:1;pointer-events:auto}
.pop{position:relative;width:min(380px,100%);max-height:calc(100vh - 32px);overflow:auto;border-radius:22px;padding:16px;text-align:center;border:2px solid var(--c);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 22%,#05030f),#05030f 75%);box-shadow:0 0 40px color-mix(in srgb,var(--c) 50%,transparent);transform:scale(.85);transition:transform .18s}
.ov.on .pop{transform:scale(1)}
.pop img{width:100%;max-height:52vh;object-fit:contain;border-radius:14px;background:#000;border:1px solid color-mix(in srgb,var(--c) 50%,transparent)}
.pop h2{margin:12px 0 2px;color:var(--c);font-size:26px}
.pop p{font-family:system-ui,sans-serif;opacity:.85;margin:4px 0 8px}
.play{display:inline-block;margin-top:8px;padding:14px 44px;border-radius:30px;background:var(--c);color:#05030f;font-weight:900;font-size:18px;text-decoration:none;letter-spacing:.08em;box-shadow:0 0 22px var(--c)}
.x{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:1px solid #fff5;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer}
.pnav{display:flex;justify-content:space-between;margin-top:12px}
.pnav button{background:none;border:1px solid color-mix(in srgb,var(--c) 60%,transparent);color:#fff;border-radius:12px;padding:8px 12px;font:inherit;font-size:11px;cursor:pointer}
@media (max-width:720px){ .g{grid-template-columns:repeat(2,1fr)} }
@media (max-width:480px){ .g{gap:8px} .c{flex-direction:column;align-items:flex-start;gap:6px;padding:7px} .c .snip{width:100%;height:auto;aspect-ratio:1/1} .c b{font-size:12px} .c span{font-size:11px} .arrow{width:52px;height:52px} }
</style></head>

function draw(){ const g=$('grid'); g.innerHTML='';
  GAMES.slice(page*PER,page*PER+PER).forEach(([id,name,c,tag,full],k)=>{ const i=page*PER+k; const b=document.createElement('button'); b.className='c'+(i===sel?' sel':i===last?' last':''); b.style.setProperty('--c',c);
    b.innerHTML=`<div class="snip"><img src="${SNIP[id]||''}" alt="" loading="lazy" style="object-position:${FOCUS[id]||'center 40%'}"></div><div><b>${name}</b><span>${tag}</span><em class="${full?'full':'test'}">${full?'100 STAGES':'TEST · 3 STAGES'}</em></div><span class="go">▶ PLAY</span>`; b.onclick=()=>pick(i); g.appendChild(b); });
  $('pg').innerHTML=`PAGE ${page+1} / ${PAGES}<small>games ${page*PER+1}–${Math.min(GAMES.length,page*PER+PER)} of ${GAMES.length}</small>`;
  g.classList.toggle('picking', sel>=0 && Math.floor(sel/PER)===page);
  $('hint').innerHTML= sel>=0 ? `<b style="color:${GAMES[sel][2]}">${GAMES[sel][1]}</b> selected — tap it again (or ▶ PLAY) to start` : 'Tap a game to light it up, tap again to play';
  $('prev').disabled=page===0; $('next').disabled=page===PAGES-1; }
function go(p){ if(p<0||p>=PAGES||p===page) return; const g=$('grid'); g.classList.add('out'); setTimeout(()=>{ page=p; draw(); g.classList.remove('out'); scrollTo({top:0,behavior:'smooth'}); },160); }
function play(i){ try{ localStorage.setItem('rmxHomeIdx',i); }catch(e){} location.href=GAMES[i][0]+'/'; }
// 1st tap lights the game up among the others, 2nd tap (or ▶ PLAY / Enter) goes into it
function pick(i){ if(i===sel){ play(i); return; } sel=(i+GAMES.length)%GAMES.length; last=sel; const p=Math.floor(sel/PER); if(p!==page){ page=p; } draw(); const el=document.querySelector('.c.sel'); el&&el.scrollIntoView({block:'nearest',behavior:'smooth'}); }
$('prev').onclick=()=>go(page-1); $('next').onclick=()=>go(page+1);
addEventListener('keydown',e=>{ if(e.key==='Escape'){ sel=-1; draw(); } if(e.key==='ArrowLeft') sel>=0? pick(sel-1) : go(page-1); if(e.key==='ArrowRight') sel>=0? pick(sel+1) : go(page+1); if(e.key==='Enter'&&sel>=0) play(sel); });
let sx=null; $('grid').addEventListener('pointerdown',e=>sx=e.clientX); $('grid').addEventListener('pointerup',e=>{ if(sx!==null&&Math.abs(e.clientX-sx)>60){ go(page+(e.clientX<sx?1:-1)); } sx=null; });
draw();
</script><script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));/*OFFLINE-1*/</script></body></html>
