/* ---------- tutorial ---------- */
let tutIdx=0, tutTimer=0; const tutSeen=new Set();
function tutShow(){
  const st = G.tutorial[tutIdx]; const el=$('#tut');
  if(!st){ el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  const txt = (Input.touch || matchMedia('(hover:none)').matches) && st.touch ? st.touch : st.text;
  el.innerHTML = `<div class="tt"><span>🎓 PRACTICE ONLY · TUTORIAL ${tutIdx+1}/${G.tutorial.length}</span><button id="tutSkip">SKIP TO REAL GAME ▶▶</button></div><div>${txt}</div>`;
  $('#tutSkip').onclick = e=>{ e.stopPropagation(); SFX.click(); tutFinish(); };
  tutTimer = 0;
}
function tutEvent(name){
  if(!run.tutorial) return; tutSeen.add(name); const st=G.tutorial[tutIdx]; if(!st) return;
  if(st.ev===name){ SFX.pickup(); tutIdx++; if(tutIdx>=G.tutorial.length) tutFinish(); else tutShow(); }
}
function tutUpdate(dt){
  if(!run.tutorial) return; const st=G.tutorial[tutIdx]; if(!st) return;
  tutTimer+=dt; if(st.ev && tutSeen.has(st.ev) && tutTimer>=1.8){ SFX.pickup(); tutIdx++; if(tutIdx>=G.tutorial.length) tutFinish(); else tutShow(); return; }
  if(st.time && tutTimer>=st.time){ tutIdx++; if(tutIdx>=G.tutorial.length) tutFinish(); else tutShow(); }
}
function tutFinish(){
  if(!run.tutorial) return;
  run.tutorial=false; $('#tut').classList.add('hidden'); P.tutDone=true; save(); SFX.clear();
  if(run.practice){ modal(`<h2>TUTORIAL DONE</h2><p>You're ready. Head back to the menu and start a new game.</p><button class="big" data-a="menu">MAIN MENU</button>`, {menu:toMenu}); return; }
  modal(`<h2>TUTORIAL COMPLETE</h2><p>Nice work! Now the real game begins.</p><p>Abilities were free in the tutorial. From now on you have <b>1 of each</b>. Collect 🪙 gold while you play and buy more in the 🛒 SHOP.</p><p><b>Stage 1</b> — ${DIFFS[P.diff]}</p><button class="big" data-a="go">START STAGE 1</button>`, {go:()=>{ run.stage=1; run.score=0; run.lives=startLives(); run.extra={}; writeSlot(); beginStage(); }});
}

/* ---------- support / contact popup ----------
   mailto: links do nothing on PCs with no mail app set up, so the popup shows the
   address, a COPY button, a Gmail web link, and the email-app link as a last option. */
function copyText(txt){
  if(navigator.clipboard && window.isSecureContext){ return navigator.clipboard.writeText(txt).then(()=>true, ()=>legacyCopy(txt)); }
  return Promise.resolve(legacyCopy(txt));
}
function legacyCopy(txt){
  try { const ta=document.createElement('textarea'); ta.value=txt; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,txt.length); const ok=document.execCommand('copy'); ta.remove(); return ok; } catch(e){ return false; }
}

    <button class="big" id="supCopy">📋 COPY EMAIL</button>
    <a class="mid suplnk" id="supGmail" href="${gmail}" target="_blank" rel="noopener">OPEN IN GMAIL</a>

    <button class="mid" data-a="x">CLOSE</button>`, {x:()=>{}});
  $('#supCopy').addEventListener('click', ()=>{ SFX.click(); copyText(SUPPORT).then(ok=>{ const b=$('#supCopy'); if(!b) return;

function toMenu(){
  flushCoins();
  state='menu'; releaseHolds(); hudEl.classList.add('hidden'); $('#tut').classList.add('hidden'); closeModal(); show('#screen-menu');
  run.tutorial=false; run.practice=false; joy.active=false; joyEl.classList.add('hidden');

}
function renderMenu(){
  document.querySelectorAll('.diff button').forEach((b,i)=>b.classList.toggle('on', i===P.diff));
  $('#mCoins').textContent = P.coins.toLocaleString();
  const best = (P.scores[P.diff]||[])[0]; $('#mBest').textContent = best? best.score.toLocaleString() : '—';
  $('#btnCont').disabled = !P.slots.some(Boolean);
  $('#sndBtn').textContent = P.sound ? '🔊' : '🔇';

document.querySelectorAll('.diff button').forEach((b,i)=>b.addEventListener('click', ()=>{ P.diff=i; save(); SFX.click(); renderMenu(); }));

function slotPicker(mode){
  let h = `<p style="margin-bottom:12px;opacity:.8">${mode==='new'?'Choose a save slot for your new game. Your progress saves at the start of every stage.':'Pick a saved game to continue from the start of the stage you reached.'}</p>`;
  P.slots.forEach((s,i)=>{
    const dis = mode==='cont' && !s;
    h += `<button class="slot" data-i="${i}" ${dis?'disabled':''}><span class="n">${i+1}</span><span>${s ? `<b>STAGE ${s.stage} · ${DIFFS[s.diff]}</b><small>Score ${s.score.toLocaleString()} · Lives ${s.lives} · ${fmtDate(s.t)}</small>` : `<b>EMPTY SLOT</b><small>${mode==='new'?'Start a fresh game here':'Nothing saved yet'}</small>`}</span></button>`;
  });
  panel(mode==='new'?'NEW GAME':'CONTINUE', h);
  document.querySelectorAll('.slot').forEach(b=>b.addEventListener('click', ()=>{
    SFX.click(); const i=+b.dataset.i, s=P.slots[i];
    if(mode==='cont'){ if(s) continueSlot(i); return; }
    if(s){ modal(`<h2>OVERWRITE?</h2><p>Slot ${i+1} has a game at Stage ${s.stage}. Start over here?</p><button class="big" data-a="y">YES, NEW GAME</button><button class="mid" data-a="n">CANCEL</button>`, {y:()=>newGame(i), n:()=>{}}); }
    else newGame(i);
  }));
}
function scoresPanel(d){
  const list = P.scores[d]||[];
  let h = `<div class="tabs">${DIFFS.map((n,i)=>`<button data-d="${i}" class="${i===d?'on':''}">${n}</button>`).join('')}</div>`;
  h += list.length ? `<table class="sc"><tr><th>#</th><th>NAME</th><th>SCORE</th><th>STAGE</th></tr>${list.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.name)}</td><td>${s.score.toLocaleString()}</td><td>${s.stage}${s.win?' ★':''}</td></tr>`).join('')}</table>` : `<p style="opacity:.7;text-align:center;padding:30px 0">No scores yet on ${DIFFS[d]}.<br>Be the first!</p>`;
  panel('TOP SCORES', h);
  document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click', ()=>{ SFX.click(); scoresPanel(+b.dataset.d); }));
}
function shopPanel(){
  let h = `<p style="margin-bottom:10px">Your gold: <span class="coins">🪙 ${P.coins.toLocaleString()}</span> — collect gold while you play and clear stages. Nothing is ever locked: every level and mode is free. Abilities are in <b>⚡ ABILITIES</b> on the main menu.</p>`;
  const cats = [...new Set(G.shop.map(s=>s.cat))];
  cats.forEach(c=>{
    h += `<div class="cat">${c.toUpperCase()}</div><div class="shop-grid">`;
    G.shop.filter(s=>s.cat===c).forEach(it=>{
      const own=P.owned.includes(it.id), eq=P.equipped[c]===it.id;
      const sw = it.swatch || `linear-gradient(90deg,${(it.colors||['#fff']).join(',')})`;
      h += `<div class="item"><div class="sw" style="background:${sw}"></div><b>${it.name}</b><small>${it.desc||''}</small>
        ${eq?`<button class="eq" disabled>✓ EQUIPPED</button>`: own?`<button data-eq="${it.id}">EQUIP</button>`:`<button class="buy" data-buy="${it.id}" ${P.coins<it.cost?'disabled style="opacity:.45"':''}>🪙 ${it.cost}</button>`}</div>`;
    });
    h += `</div>`;
  });
  h += `<div class="cat">PREMIUM PACKS</div><div class="shop-grid">`;
  (G.premium||[]).forEach(p=>{ h += `<div class="item prem"><div class="sw" style="background:${p.swatch}"></div><b>${p.name}</b><small>${p.desc}</small><button disabled>${p.price} · COMING SOON</button></div>`; });
  h += `</div><p style="opacity:.6;font-size:12px;margin-top:10px">Premium packs will be paid with PayFast before launch. Test build: not purchasable yet.</p>`;
  panel('SHOP', h);
  document.querySelectorAll('[data-buy]').forEach(b=>b.addEventListener('click', ()=>{ const it=G.shop.find(s=>s.id===b.dataset.buy); if(P.coins>=it.cost){ P.coins-=it.cost; P.owned.push(it.id); P.equipped[it.cat]=it.id; save(); SFX.pickup(); shopPanel(); } }));
  document.querySelectorAll('[data-eq]').forEach(b=>b.addEventListener('click', ()=>{ const it=G.shop.find(s=>s.id===b.dataset.eq); P.equipped[it.cat]=it.id; save(); SFX.click(); shopPanel(); }));
}

/* ---------- DOUBLE UP OR LOSS (slots, earned coins only) ---------- */
const SYM=['🍒','🍋','🔔','⭐','💎','7️⃣'], SW=[30,25,18,12,6,4], SWT=95;
const PAY3=[6,10,18,35,100,300], PAYCC=2.5, PAYC=0.6;
const PAYM={2:[0.4,0.4,0.4,0.4,0.4,0.4],3:[4,5,11,18,45,90],4:[14,23,40,75,180,450],5:[55,90,180,360,1100,3600]};
const WHEEL=[0,0.5,2,0,1,2,0,0.5,1,0,1.5,3];
const WCOL=['#2a1a4a','#3a6bff','#ff2bd6','#2a1a4a','#20c070','#ff7b1c','#2a1a4a','#3a6bff','#20c070','#2a1a4a','#a066ff','#ffd23f'];
let sTab=0, sBet=10, sPend=0, sSpin=false, sDbl=0, wheelRot=0;
function sPick(){ let r=Math.random()*SWT; for(let i=0;i<SYM.length;i++){ r-=SW[i]; if(r<0) return i; } return 0; }
function slotsBack(){ if(sSpin) return; if(sPend>0){ P.coins+=sPend; sPend=0; save(); } toMenu(); }
function slotsPanel(){
  const names=['CLASSIC 3','MEGA 5','LUCKY WHEEL'];
  let m='';
  if(sTab===0) m=`<div class="reels">${[0,1,2].map(i=>`<div class="reel" id="r${i}">${SYM[[5,4,3][i]]}</div>`).join('')}</div>`;
  if(sTab===1) m=`<div class="reels five">${[0,1,2,3,4].map(i=>`<div class="reel" id="r${i}">${SYM[i%6]}</div>`).join('')}</div>`;
  if(sTab===2){ const grad=WHEEL.map((_,i)=>`${WCOL[i]} ${i*30}deg ${(i+1)*30}deg`).join(','); m=`<div class="wheel-box"><div class="wheel-ptr"></div><div class="wheel" id="wh" style="background:conic-gradient(${grad});transform:rotate(${wheelRot}deg)"><div class="wheel-lbl">${WHEEL.map((v,i)=>`<span style="transform:rotate(${i*30+15}deg);transform-origin:18px 104px">${v?'x'+v:'✕'}</span>`).join('')}</div></div></div>`; }
  const pt = sTab===0? `3 in a row: 🍒x6 · 🍋x10 · 🔔x18 · ⭐x35 · 💎x100 · 7️⃣x300<br>🍒🍒 first two: x2.5 · 🍒 first: x0.6` :
             sTab===1? `Match from the left — any 2: x0.4<br>3 / 4 / 5 in a row: 🍒 4/14/55 · 🍋 5/23/90 · 🔔 11/40/180<br>⭐ 18/75/360 · 💎 45/180/1100 · 7️⃣ 90/450/3600` :
             `Spin the wheel: win x0.5 up to x3 your bet, or lose it (✕).`;
  const h=`<div class="slot-wrap">
    <div class="tabs" style="width:100%">${names.map((n,i)=>`<button data-st="${i}" class="${i===sTab?'on':''}">${n}</button>`).join('')}</div>
    <div class="slot-coins coins">🪙 <span id="slC">${P.coins.toLocaleString()}</span></div>
    ${m}
    <div class="bets">${[10,25,50,100].map(b=>`<button data-bet="${b}" class="${b===sBet?'on':''}">BET ${b}</button>`).join('')}</div>
    <div class="slot-msg" id="slMsg">${sPend>0?'':'Good luck!'}</div>
    <button class="big casino" id="slSpin" style="width:100%">🎰 SPIN · 🪙${sBet}</button>
    <div class="dbl hidden" id="dbl"><div>WIN <b class="coins" id="dAmt">0</b> — <b>DOUBLE UP OR LOSS?</b></div><div class="coin" id="coinEl">?</div>
      <div class="row" style="width:100%"><button class="mid" id="dH">HEADS (x2)</button><button class="mid" id="dT">TAILS (x2)</button></div><button class="big" id="dC" style="width:100%">COLLECT</button></div>
    <div class="paytable">${pt}</div>
    <p style="font-size:11px;opacity:.55;text-align:center;font-family:Segoe UI,sans-serif">Uses coins you earned by playing only. Coins can't be bought for this. Just for fun: on average the machines keep about 8% of what's bet.</p>
  </div>`;
  panel('DOUBLE UP OR LOSS', h, slotsBack);
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{ if(sSpin||sPend>0) return; SFX.click(); sTab=+b.dataset.st; slotsPanel(); });
  document.querySelectorAll('[data-bet]').forEach(b=>b.onclick=()=>{ if(sSpin||sPend>0) return; SFX.click(); sBet=+b.dataset.bet; slotsPanel(); });
  $('#slSpin').onclick=slotSpin;
  $('#dH').onclick=()=>dblFlip(0); $('#dT').onclick=()=>dblFlip(1); $('#dC').onclick=dblCollect;
  if(sPend>0) showDbl();
}
function sMsg(t,cls){ const e=$('#slMsg'); if(e){ e.textContent=t; e.className='slot-msg '+(cls||''); } }
function sCoins(){ const e=$('#slC'); if(e) e.textContent=P.coins.toLocaleString(); }
function slotSpin(){
  if(sSpin||sPend>0) return;
  if(P.coins<sBet){ sMsg('Not enough coins — play to earn more!','lose'); SFX.bump(); return; }
  P.coins-=sBet; save(); sCoins(); sSpin=true; $('#pBack').disabled=true; $('#slSpin').disabled=true; sMsg('Spinning…'); SFX.click();
  if(sTab===2){ const seg=Math.floor(Math.random()*WHEEL.length); const target=(360-(seg*30+15))%360; wheelRot += 360*5 + ((target-(wheelRot%360))+360)%360; $('#wh').style.transform=`rotate(${wheelRot}deg)`;
    let k=0; const tick=setInterval(()=>{ SFX.blip(); if(++k>24) clearInterval(tick); },140);
    setTimeout(()=>finishSpin(Math.floor(sBet*WHEEL[seg]), WHEEL[seg]? 'x'+WHEEL[seg]+'!' : ''),3800); return; }
  const n=sTab===0?3:5, res=Array.from({length:n},sPick), els=[...Array(n)].map((_,i)=>$('#r'+i));
  els.forEach(e=>{ e.classList.add('spin'); e.classList.remove('win'); });
  const iv=setInterval(()=>els.forEach((e,i)=>{ if(e.classList.contains('spin')) e.textContent=SYM[Math.floor(Math.random()*6)]; }),70);
  els.forEach((e,i)=>setTimeout(()=>{ e.classList.remove('spin'); e.textContent=SYM[res[i]]; SFX.bump(); if(i===n-1){ clearInterval(iv); evalReels(res,els); } }, 600+i*(n===3?350:250)));
}
function evalReels(r,els){
  let mult=0, hl=0;
  if(r.length===3){ if(r[0]===r[1]&&r[1]===r[2]){ mult=PAY3[r[0]]; hl=3; } else if(r[0]===0&&r[1]===0){ mult=PAYCC; hl=2; } else if(r[0]===0){ mult=PAYC; hl=1; } }
  else { let k=1; while(k<5&&r[k]===r[0]) k++; if(k>=2){ mult=PAYM[k][r[0]]; hl=k; } }
  for(let i=0;i<hl;i++) els[i].classList.add('win');
  finishSpin(Math.floor(sBet*mult), mult>=20?'JACKPOT!':mult?'x'+mult:'');
}
function finishSpin(win,label){
  sSpin=false; const pb=$('#pBack'); if(pb) pb.disabled=false; const sb=$('#slSpin'); if(sb) sb.disabled=false;
  if(win>0){ sPend=win; sDbl=0; SFX.clear(); sMsg(`${label} YOU WIN ${win} 🪙`,'win'); showDbl(); }
  else { SFX.over(); sMsg('No win this time','lose'); }
}
function showDbl(){ const d=$('#dbl'); if(!d) return; d.classList.remove('hidden'); $('#dAmt').textContent=sPend; $('#slSpin').disabled=true;
  const can=sDbl<5; $('#dH').disabled=!can; $('#dT').disabled=!can; if(!can) sMsg('Max 5 double-ups — collect your coins!','win'); }
function dblFlip(pickSide){
  if(sPend<=0) return; const c=$('#coinEl'); c.classList.remove('flip'); void c.offsetWidth; c.classList.add('flip'); $('#dH').disabled=$('#dT').disabled=$('#dC').disabled=true; SFX.power();
  const side=Math.random()<0.5?0:1;
  setTimeout(()=>{ c.textContent=side?'T':'H'; $('#dC').disabled=false;
    if(side===pickSide){ sPend*=2; sDbl++; SFX.clear(); sMsg(`DOUBLED! ${sPend} 🪙`,'win'); showDbl(); }
    else { sMsg(`LOSS! The coin was ${side?'TAILS':'HEADS'}`,'lose'); SFX.hurt(); sPend=0; $('#dbl').classList.add('hidden'); $('#slSpin').disabled=false; } },900);
}
function dblCollect(){ if(sPend<=0) return; P.coins+=sPend; sMsg(`Collected ${sPend} 🪙`,'win'); sPend=0; save(); sCoins(); SFX.pickup(); $('#dbl').classList.add('hidden'); $('#slSpin').disabled=false; }

/* ---------- game flow ---------- */
function writeSlot(){ P.slots[run.slot] = {stage:run.stage, score:run.score, lives:run.lives, diff:P.diff, t:Date.now(), extra:run.extra}; save(); }
function newGame(i){
  run.slot=i; run.stage=1; run.score=0; run.lives=startLives(); run.extra={started:Date.now()}; writeSlot();
  starterKit();
  if(!P.tutDone) startTutorial(false); else beginStage();
}
function continueSlot(i){
  const s=P.slots[i]; run.slot=i; run.stage=s.stage; run.score=s.score; run.lives=s.lives; run.extra=JSON.parse(JSON.stringify(s.extra||{})); P.diff=s.diff; save(); beginStage();
}
function resetAbilities(){ cntKey=''; $('#hudCounter').className='ctr hidden'; abLock.fill(0); abBadge.fill(null); abActive.fill(false); coinsFly.length=0; run.coinsStage=0; run.dropN=0; }
function startTutorial(practice){
  run.tutorial=true; run.practice=practice; run.score=0; run.lives=G.lives; tutIdx=0; tutSeen.clear(); resetAbilities();
  enterPlay(); G.startStage(0, API); tutShow(); toast('TUTORIAL');
}
function beginStage(){
  run.stageT0=performance.now();
  run.tutorial=false; resetAbilities(); enterPlay(); $('#tut').classList.add('hidden');
  G.startStage(run.stage, API); toast('STAGE '+run.stage);
  run.doom=doomLimit(); run.doomPend=0;
  const intro = (P.diff===2 && run.stage===4 ? 'NO MERCY — THE EXPERT CLOCK STARTS!' : null) || (G.stageIntro && G.stageIntro[run.stage]) || (API.boss ? (G.bossName||'BOSS STAGE!') : (G.contentIntro && G.contentIntro[API.content]) || null);
  if(intro) setTimeout(()=>{ if(state==='play') toast(intro); }, 1500);
}
function enterPlay(){ closeModal(); show(null); hudEl.classList.remove('hidden'); state='play'; updHud(); updAbilities(0); fitNames(); last=performance.now(); }
function pauseGame(){
  if(state!=='play') return; state='paused'; joy.active=false; joyEl.classList.add('hidden'); releaseHolds();
  modal(`<h2>PAUSED</h2><p>${run.tutorial?'Tutorial':'Stage '+run.stage+' · '+DIFFS[P.diff]}</p><button class="big" data-a="r">▶ RESUME</button><button class="mid" data-a="shop">🛒 ABILITY SHOP</button><button class="mid" data-a="s">${P.sound?'🔊 SOUND ON':'🔇 SOUND OFF'}</button><button class="mid" data-a="set">⚙️ SETTINGS</button><button class="mid" data-a="h">HOW TO PLAY</button><button class="mid" data-a="e" style="color:#ff6b8a">END GAME</button>`,
    {r:resumeGame, shop:()=>{ flushCoins(); shopModal(pauseAgain,'◀ BACK'); }, s:()=>{P.sound=!P.sound;save();pauseAgain();}, set:()=>settingsModal(pauseAgain), h:()=>{ modal(`<h2>HOW TO PLAY</h2><div style="text-align:left;max-height:50vh;overflow:auto;font-family:Segoe UI,sans-serif;font-size:14px">${G.howto}${HOW_BUTTONS()}</div><button class="big" data-a="b">BACK</button>`, {b:pauseAgain}); }, e:endGamePrompt});
}
function pauseAgain(){ state='play'; pauseGame(); }
function resumeGame(){ closeModal(); state='play'; last=performance.now(); }
function endGamePrompt(){
  if(state==='play'){ state='paused'; }
  if(NET.on){ modal(`<h2>LEAVE THE GAME?</h2><p>This ends the 2-player game for both of you.</p><button class="big" data-a="y">LEAVE</button><button class="mid" data-a="n">KEEP PLAYING</button>`, {y:()=>netQuit(), n:resumeGame}); return; }

  else if(o.e==='ncont' && NET.role==='guest'){ state='modal'; netContinue(); }
  else if(o.e==='npay' && NET.role==='host'){ netResume(o.name||'P2'); }
  else if(o.e==='nresume' && NET.role==='guest'){ NET.waitPay=false; closeModal(); state='play'; last=performance.now(); toast('💰 '+(o.payer||'')+' PAID — KEEP GOING!'); }
  else if(o.e==='nshop' && NET.role==='host'){ netShopTime(); toast('PARTNER IS BUYING GOLD…'); }
  else if(o.e==='ngive'){ toast('PARTNER GAVE UP — YOU CAN STILL PAY'); }
  else if(o.e==='nnext' && NET.role==='guest'){ clearTimeout(NET.advT); closeModal(); run.stage=o.stage; Math.random=mpSeeded(o.seed); netBegin(); }
  else if(o.e==='nwin' && NET.role==='guest'){ netResult(o.idx); }
  else if(o.e==='nquit'){ netStop(); state='modal'; modal(`<h2>YOUR PARTNER LEFT</h2><p>The 2-player game has ended.</p><button class="big" data-a="r">🔁 BACK TO ROOM</button><button class="mid" data-a="m">MENU</button>`,{r:()=>mpRoom(), m:()=>{ mpLeave(); toMenu(); }}); }
}
// --- direct phone-to-phone link (WebRTC). If it can't connect in 6 s we fall back to Supabase messages (slower).
function netRtc(isHost){
  try{
    const pc=new RTCPeerConnection({iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]}); NET.peer=pc;
    pc.onicecandidate=e=>{ if(e.candidate) mpSend({e:'rtc',c:e.candidate}); };
    const setup=dc=>{ NET.dc=dc; dc.onopen=()=>{ NET.rtcOk=true; toast('⚡ DIRECT LINK'); }; dc.onmessage=m=>{ try{ netRecv(JSON.parse(m.data)); }catch(e){} }; };
    if(isHost){ setup(pc.createDataChannel('g',{ordered:false,maxRetransmits:0})); pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>mpSend({e:'rtc',sdp:pc.localDescription})); }
    else pc.ondatachannel=e=>setup(e.channel);
  }catch(e){}
}
function netRtcMsg(m){ const pc=NET.peer; if(!pc) return; try{
  if(m.sdp){ pc.setRemoteDescription(m.sdp).then(()=>{ if(m.sdp.type==='offer') return pc.createAnswer().then(a=>pc.setLocalDescription(a)).then(()=>mpSend({e:'rtc',sdp:pc.localDescription})); }); }
  else if(m.c){ pc.addIceCandidate(m.c).catch(()=>{}); } }catch(e){} }
function netPick(){ const ids2=Object.keys(MP.players).sort((a,b)=>MP.players[a].t-MP.players[b].t); if(ids2.length!==2){ mpRoom(); return; }
  const sv=(P.coop||{})[G.id]; const go=(stage,diff,score)=>{ const seed=Math.floor(mpRealRandom()*1e9); const hn=MP.players[ids2[0]].name, gn=MP.players[ids2[1]].name; mpSend({e:'coop',seed,stage,hn,gn,diff,score}); netStart(seed,stage,hn,gn,diff,score); };
  modal(`<h2>🎮 PLAY TOGETHER</h2><p>Play the whole game together, stage 1 to ${G.stages}.</p><p>Difficulty:</p><button class="mid" data-a="e">🟢 BEGINNER — new game</button><button class="mid" data-a="h">🟠 HARD — new game</button><button class="mid" data-a="x">🔴 EXPERT — new game</button>${sv?`<button class="big" data-a="c">▶ CONTINUE TOGETHER · Stage ${sv.stage} · ${DIFFS[sv.diff]}</button>`:''}<button class="mid" data-a="b">◀ BACK</button>`,
    {e:()=>go(1,0,0), h:()=>go(1,1,0), x:()=>go(1,2,0), c:()=>go(sv.stage,sv.diff,sv.score||0), b:()=>mpRoom()}); }
function netSave(){ if(NET.role!=='host') return; P.coop=P.coop||{}; P.coop[G.id]={stage:run.stage,diff:P.diff,score:run.score,t:Date.now()}; save(); }
function netStart(seed,stage,hostName,guestName,diff,score){
  NET.on=true; NET.role=MP.host?'host':'guest'; NET.names=[hostName,guestName]; NET.fbT=0; NET.lastSnap=null; MP.on=false; MP.coop=true;
  MP.prevDiff=P.diff; P.diff=diff||0; run.stage=stage; run.score=score||0; run.lives=startLives(); run.extra={}; Math.random=mpSeeded(seed);
  netRtc(NET.role==='host'); if(window.RMXL) RMXL.setBusy(true);
  let n=3; const tick=()=>{ modal(`<h2>🎮 PLAY TOGETHER</h2><p><b style="color:#00e5ff">P1 ${esc(hostName)}</b> + <b style="color:#ff3bd4">P2 ${esc(guestName)}</b></p><p>You are <b>${NET.role==='host'?'P1':'P2'}</b> · ${DIFFS[P.diff]} · Stage ${run.stage}</p><div class="stat">${n}</div>`,{}); if(n--<=0){ closeModal(); netBegin(); } else setTimeout(tick,1000); }; tick();
}
function netBegin(){ beginStage(); }
function netTick(dt){ // runs every frame while playing together
  if(!NET.on) return; NET.fbT-=dt; NET.sendT-=dt;
  if(NET.role==='host'){ if(NET.sendT<=0){ NET.sendT=NET.rtcOk?0.05:0.1; const s=G.netState?G.netState():{}; netSendFast({e:'snap',s,l:run.lives,sc:run.score}); } }
  else { if(NET.sendT<=0){ NET.sendT=NET.rtcOk?0.05:0.1; const k={}; ['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyA','KeyD','KeyW','KeyS','Space'].forEach(c=>{ if(keys[c]) k[c]=1; }); const d=joy.active?Input.dir():null; netSendFast({e:'in',k,j:d}); }
    if(NET.lastSnap){ const sn=NET.lastSnap; NET.lastSnap=null; try{ G.netApply&&G.netApply(sn.s); }catch(e){} if(run.lives!==sn.l||run.score!==sn.sc){ run.lives=sn.l; run.score=sn.sc; updHud(); } }
    G.netTick && G.netTick(dt); }
}
function netStageEnd(win){
  state='modal'; flushCoins();
  if(!win){ netContinue(); return; }
  if(NET.role==='host') netSendRel({e:'nclear'});
  run.stage++; if(NET.role==='host') netSave();
  if(run.stage>G.stages){ if(NET.role==='host'){ P.coop[G.id]=null; save(); } netQuit('🏆 YOU BEAT ALL '+G.stages+' STAGES TOGETHER!'); return; }
  const coins = Math.round((20 + Math.min(run.stage,60)*1.5) * (1 + P.diff*0.5)); P.coins+=coins; save(); updCoins();
  let n=4; clearTimeout(NET.advT);
  const tick=()=>{ if(!NET.on) return; modal(`<h2>STAGE ${run.stage-1} CLEAR!</h2><p>Great teamwork! +${coins} 🪙 each</p><div class="stat">${run.score.toLocaleString()}</div><p>Stage ${run.stage} starts in <b>${n}</b>…</p><button class="mid" data-a="q">LEAVE (progress saved)</button>`,{q:()=>netQuit()});
    if(n--<=0){ closeModal(); if(NET.role==='host'){ const seed=Math.floor(mpRealRandom()*1e9); netSendRel({e:'nnext',stage:run.stage,seed}); Math.random=mpSeeded(seed); netBegin(); } }
    else NET.advT=setTimeout(tick,1000); };
  tick();
}
// out of lives: either player may pay gold to continue (cost grows with stage); nobody pays in 30 s = game over
function netContCost(){ return Math.round((60 + run.stage*4) * (1 + P.diff*0.5)); }
function netContinue(){
  if(NET.role==='host'){ netSendRel({e:'ncont'}); clearTimeout(NET.contT); NET.contT=setTimeout(()=>{ if(NET.on&&NET.waitPay){ NET.waitPay=false; netSendRel({e:'nover'}); netGameOver(); } },30000); }
  NET.waitPay=true; netContinueShow();
}
function netShopTime(){ if(NET.role!=='host'||!NET.waitPay) return; clearTimeout(NET.contT); NET.contT=setTimeout(()=>{ if(NET.on&&NET.waitPay){ NET.waitPay=false; netSendRel({e:'nover'}); netGameOver(); } },120000); }
function netContinueShow(){ if(!NET.on||!NET.waitPay) return; const cost=netContCost(), can=P.coins>=cost;
  modal(`<h2>OUT OF LIVES!</h2><p>Either player can pay to keep going together.</p><button class="big" data-a="p" ${can?'':'disabled'}>💰 CONTINUE · ${cost.toLocaleString()} 🪙</button><p style="font-size:13px">You have ${P.coins.toLocaleString()} 🪙${can?'':' — not enough'}</p><button class="mid" data-a="s" style="background:linear-gradient(90deg,#ffd23f,#ff9f1c);color:#14061f">🛒 BUY GOLD</button><button class="mid" data-a="g">GIVE UP</button>`,
    {s:()=>{ if(NET.role==='host') netShopTime(); else netSendRel({e:'nshop'}); goldStore(()=>netContinueShow(),'🛒 BUY GOLD TO CONTINUE'); },
     p:()=>{ if(P.coins<cost){ netContinueShow(); return; } P.coins-=cost; save(); updCoins(); if(NET.role==='host') netResume(MP.name); else { netSendRel({e:'npay',name:MP.name}); modal(`<h2>PAID ✔</h2><p>Continuing…</p>`,{}); } }, g:()=>{ netSendRel({e:'ngive'}); if(NET.role==='host'){ clearTimeout(NET.contT); NET.waitPay=false; netSendRel({e:'nover'}); netGameOver(); } else modal(`<h2>WAITING…</h2><p>Your partner can still pay to continue.</p>`,{}); }});
}
function netResume(payer){ if(NET.role!=='host'||!NET.waitPay) return; clearTimeout(NET.contT); NET.waitPay=false; run.lives=G.lives; updHud(); if(G.netRevive) G.netRevive(); else if(G.respawn) G.respawn(); netSendRel({e:'nresume',payer}); closeModal(); state='play'; last=performance.now(); toast('💰 '+payer+' PAID — KEEP GOING!'); }
function netGameOver(){ state='modal'; if(NET.role==='host'){ P.coop=P.coop||{}; P.coop[G.id]=null; save(); }
  modal(`<h2>GAME OVER</h2><p>You reached stage ${run.stage} together.</p><div class="stat">${run.score.toLocaleString()}</div><button class="big" data-a="r">🔁 BACK TO ROOM</button><button class="mid" data-a="q">LEAVE</button>`,{r:()=>{ netStop(); mpRoom(); }, q:()=>netQuit()}); }
function netResult(idx){ state='modal'; const meIdx=NET.role==='host'?0:1; const t= idx===meIdx?'🏆 YOU WIN!': idx===-1?'🤝 DRAW!':'🏁 '+esc(NET.names[idx]||'P'+(idx+1))+' WINS!';
  if(idx===meIdx){ P.coins+=50; save(); }
  modal(`<h2>${t}</h2><p>${idx===meIdx?'+50 🪙':''}</p><button class="big" data-a="r">🔁 BACK TO ROOM</button><button class="mid" data-a="q">LEAVE</button>`,{r:()=>{ netStop(); mpRoom(); }, q:()=>netQuit()}); }
function netStop(){ NET.on=false; MP.coop=false; try{ NET.dc&&NET.dc.close(); NET.peer&&NET.peer.close(); }catch(e){} NET.dc=null; NET.peer=null; NET.rtcOk=false; Math.random=mpRealRandom; P.diff=MP.prevDiff; if(window.RMXL) RMXL.setBusy(false); }
function netQuit(msg){ netSendRel({e:'nquit'}); netStop(); mpLeave(); if(msg) modal(`<h2>${msg}</h2><button class="big" data-a="m">MENU</button>`,{m:toMenu}); else toMenu(); }

// ===== GOLD STORE (cash gold packs) — PAY-1. Payments are not switched on yet: PAY.buy() is the ONE place to connect PayFast / Google Play Billing later.
const PAY = { enabled:false,
  buy(pack, done){ if(!PAY.enabled){ toast('💳 GOLD PURCHASES OPEN SOON'); SFX.bump(); return; } /* later: start PayFast / Play Billing checkout here, then on success: */ P.coins+=pack.gold; save(); updCoins(); toast('+'+pack.gold.toLocaleString()+' 🪙 ADDED'); SFX.coin(); done&&done(); } };
function goldStore(back, title){
  const rows=GOLD_PACKS.map((g,i)=>`<div class="abrow gold"><div class="ic">💰</div><div class="tx"><b>${g.gold.toLocaleString()} GOLD</b>${i===2?'Best value':''}</div><button data-gp="${i}" ${PAY.enabled?'':'style="opacity:.75"'}>${g.price}${PAY.enabled?'':' · SOON'}</button></div>`).join('');
  modal(`<h2>${title||'🛒 BUY GOLD'}</h2><div class="abshop"><div class="bal">🪙 <b class="coins">${P.coins.toLocaleString()}</b> GOLD</div>${rows}<p class="note">${PAY.enabled?'Secure payment. Gold is added straight away.':'Gold purchases open soon. You can still earn gold free by playing.'}</p></div><button class="mid" data-a="b">◀ BACK</button>`,{b:back});
  document.querySelectorAll('[data-gp]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); PAY.buy(GOLD_PACKS[+b.dataset.gp], ()=>goldStore(back,title)); }));
}
