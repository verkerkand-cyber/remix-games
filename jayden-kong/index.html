<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05030f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="build" content="BUILD-JK-2.0 · 2026-10-19">
<title>Jayden Kong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:#fff;font-family:'Orbitron','Segoe UI',system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;overflow:hidden}
#game{position:absolute;left:0;top:0;display:block}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;color:#fff}
/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;z-index:20;overflow-y:auto}
.screen.dim{background:rgba(3,2,10,.55)}
#screen-loading{background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--a) 22%,transparent),var(--bg) 70%);z-index:60}
.logo{font-size:clamp(34px,9vw,68px);font-weight:900;letter-spacing:.06em;text-align:center;line-height:1.05;
  background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px color-mix(in srgb,var(--a) 70%,transparent))}
.tag{opacity:.8;margin-top:8px;letter-spacing:.2em;font-size:12px;text-align:center;text-transform:uppercase}
.loadbar{width:min(320px,80vw);height:10px;border-radius:6px;background:rgba(255,255,255,.08);margin-top:34px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.loadbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 0 16px var(--b);transition:width .12s}
.tapstart{margin-top:26px;font-size:16px;letter-spacing:.25em;animation:blink 1.1s infinite;opacity:0}
@keyframes blink{50%{opacity:.25}}
.menu-card{width:min(440px,94vw);display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:18px;border-radius:20px;
  background:rgba(8,6,22,.72);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(6px);box-shadow:0 0 40px color-mix(in srgb,var(--a) 25%,transparent)}
.menu-card .logo{font-size:clamp(30px,8vw,46px);margin-bottom:2px}
.diff{display:flex;gap:6px;background:rgba(255,255,255,.06);padding:5px;border-radius:14px}
.diff button{flex:1;padding:10px 4px;border-radius:10px;background:transparent;font-size:13px;font-weight:700;letter-spacing:.08em;opacity:.65}
.diff button.on{background:linear-gradient(90deg,var(--a),var(--b));opacity:1;box-shadow:0 0 14px color-mix(in srgb,var(--b) 60%,transparent);color:#050510}
.big{padding:15px;border-radius:14px;font-size:17px;font-weight:800;letter-spacing:.12em;background:linear-gradient(90deg,var(--a),var(--b));color:#060612;box-shadow:0 0 18px color-mix(in srgb,var(--a) 50%,transparent)}
.big:disabled{opacity:.35;box-shadow:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mid{padding:13px 8px;border-radius:12px;font-size:13px;font-weight:700;letter-spacing:.08em;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}
.mid:hover,.big:hover{filter:brightness(1.15)}
.meta{display:flex;justify-content:space-between;font-size:12px;opacity:.8;padding:0 4px}
.ver{font-size:10px;text-align:center;letter-spacing:.1em;display:flex;flex-direction:column;align-items:center;gap:2px}
.ver .bld{opacity:.45}
/* ---------- support / contact ---------- */
.suplink{background:rgba(255,255,255,.06);border:1px solid color-mix(in srgb,var(--b) 50%,transparent);color:var(--b);font-size:11px;letter-spacing:.04em;padding:9px 12px;border-radius:10px;margin-top:4px}
.supaddr{font-family:'Segoe UI',system-ui,sans-serif;font-size:17px;font-weight:700;padding:12px;border-radius:10px;background:rgba(255,255,255,.08);color:var(--b);word-break:break-all;user-select:text;-webkit-user-select:text}
a.suplnk{display:block;text-decoration:none;color:#fff;text-align:center}
.supnote{font-size:12px!important;opacity:.6!important}
/* ---------- panels ---------- */
.panel{width:min(560px,96vw);max-height:92vh;display:flex;flex-direction:column;border-radius:20px;background:rgba(8,6,22,.92);border:1px solid rgba(255,255,255,.14);overflow:hidden}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.panel-h h2{flex:1;font-size:18px;letter-spacing:.12em;color:var(--b)}
.back{padding:8px 14px;border-radius:10px;background:rgba(255,255,255,.1);font-size:13px}
.panel-b{padding:16px;overflow-y:auto;font-family:'Segoe UI',system-ui,sans-serif;line-height:1.55;font-size:15px}
.panel-b h3{font-family:'Orbitron',sans-serif;color:var(--a);font-size:14px;letter-spacing:.1em;margin:14px 0 6px}
.panel-b h3:first-child{margin-top:0}
.panel-b ul{padding-left:20px}.panel-b li{margin:3px 0}
.panel-b p{margin:6px 0}
.key{display:inline-block;padding:1px 7px;border-radius:5px;background:rgba(255,255,255,.14);font-family:monospace;font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:8px;border-radius:9px;background:rgba(255,255,255,.07);font-size:12px;font-weight:700}
.tabs button.on{background:var(--b);color:#050510}
table.sc{width:100%;border-collapse:collapse;font-size:14px}
table.sc td,table.sc th{padding:7px 6px;text-align:left;border-bottom:1px solid rgba(255,255,255,.07)}
table.sc th{font-size:11px;opacity:.6;letter-spacing:.1em}
table.sc tr:first-child td{color:var(--a);font-weight:700}
.slot{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;margin-bottom:10px;text-align:left;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);font-family:'Segoe UI',system-ui,sans-serif}
.slot b{font-family:'Orbitron',sans-serif;font-size:14px;color:var(--b)}
.slot .n{font-family:'Orbitron',sans-serif;font-size:22px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:rgba(255,255,255,.1);flex:none}
.slot small{opacity:.7;display:block;font-size:13px}
.slot:disabled{opacity:.35}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{padding:12px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;gap:6px}
.item .sw{height:46px;border-radius:10px}
.item b{font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:.05em}
.item small{opacity:.7;font-size:12px;line-height:1.3;min-height:30px}
.item button{padding:8px;border-radius:9px;font-size:12px;font-weight:700;background:rgba(255,255,255,.12)}
.item button.buy{background:linear-gradient(90deg,var(--a),var(--b));color:#050510}
.item button.eq{background:#1c3;color:#031}
.item.prem{border-color:#ffd24a55;background:rgba(255,210,74,.06)}
.cat{font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:.14em;opacity:.8;margin:16px 0 8px;color:var(--a)}
.cat:first-child{margin-top:0}
.coins{color:#ffd24a;font-weight:800}
/* ---------- HUD: top strip + ability bar. The game canvas is fitted into the space left over, so nothing covers play ---------- */
#hud{position:absolute;inset:0;z-index:10;pointer-events:none}
#hudTop{position:absolute;left:0;right:0;top:0;height:46px;display:flex;gap:14px;align-items:center;justify-content:center;padding:0 90px 0 12px;background:rgba(5,4,16,.92);border-bottom:1px solid rgba(255,255,255,.12);font-size:13px;font-weight:700;white-space:nowrap;letter-spacing:.05em;pointer-events:auto}
#hudTop span{opacity:.6;font-weight:400;font-size:10px;margin-right:4px}
#hudLives{color:var(--a)}
#hudCoinBox{transition:transform .15s}
#hudCoinBox.bump{transform:scale(1.3)}
.hbtn{pointer-events:auto;background:rgba(5,4,16,.65);border:1px solid rgba(255,255,255,.25);border-radius:12px;font-weight:800;letter-spacing:.08em}
#btnEnd{position:absolute;top:7px;right:8px;padding:8px 11px;font-size:11px;color:#ff6b8a;border-color:#ff6b8a88}
@media (max-width:480px){#hudTop{gap:9px;font-size:12px;padding:0 74px 0 8px;justify-content:flex-start}#hudTop span{display:none}#btnEnd{padding:8px 9px}}
#bar{position:absolute;display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(5,4,16,.92);pointer-events:auto;touch-action:none}
#bar{left:0;right:0;top:46px;height:84px;padding:0 12px;flex-direction:row;border-bottom:2px solid color-mix(in srgb,var(--b) 55%,transparent);box-shadow:0 6px 18px rgba(0,0,0,.5)}
#abilities{display:flex;gap:12px}
.barbtns{display:flex;gap:10px}
.bbtn{width:54px;height:54px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.bbtn small{font-size:8px;letter-spacing:.08em;margin-top:4px;opacity:.75}
#btnShopIn{border-color:#ffd24a99;background:rgba(255,210,74,.12)}
#btnShopIn.flash{animation:shopflash .5s 4}
@keyframes shopflash{50%{background:#ffd24a;color:#000;box-shadow:0 0 20px #ffd24a}}
.ab{position:relative;width:60px;height:60px;border-radius:50%;background:rgba(5,4,16,.7);border:2px solid var(--b);font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px color-mix(in srgb,var(--b) 45%,transparent);touch-action:none;flex:none}
.ab .cnt{position:absolute;right:-5px;top:-5px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--b);color:#050510;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 0 8px var(--b)}
.ab .kb{position:absolute;right:-7px;bottom:4px;font-size:10px;padding:1px 5px;border-radius:6px;background:#fff;color:#000;font-weight:800;font-family:monospace}
.ab .nm{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);font-size:7px;letter-spacing:.06em;opacity:.7;white-space:nowrap;font-weight:700;pointer-events:none}
.ab.active{background:color-mix(in srgb,var(--b) 45%,#000);box-shadow:0 0 22px var(--b)}
.ab.empty{border-color:rgba(120,110,150,.5);box-shadow:none}
.ab.empty .ic{opacity:.3}
.ab.empty .cnt{background:#e8503a;color:#fff;box-shadow:none}
.ab.empty::after{content:'';position:absolute;left:8px;right:8px;top:50%;height:3px;border-radius:2px;background:#e8503a;transform:rotate(-45deg)}
.ab.lock .ic{opacity:.5}
@media (hover:none){.ab .kb{display:none}}
@media (max-width:420px){.ab{width:54px;height:54px;font-size:23px}#abilities{gap:9px}.bbtn{width:48px;height:48px}.barbtns{gap:7px}}
/* gold coins flying to the counter */
#tut{position:absolute;left:50%;transform:translateX(-50%);width:min(520px,calc(100vw - 24px));padding:12px 14px;border-radius:14px;background:rgba(5,4,16,.9);border:2px solid var(--a);box-shadow:0 0 22px color-mix(in srgb,var(--a) 50%,transparent);font-family:'Segoe UI',system-ui,sans-serif;font-size:15px;line-height:1.4;pointer-events:auto}
#tut{top:calc(52px + env(safe-area-inset-top));bottom:auto;z-index:6}
.lay-side #tut{transform:none;max-width:none;right:auto}
#tut .tt span{color:#ffd23f}
#tut button#tutSkip{font-size:12px;padding:7px 10px;background:var(--a);color:#000;font-weight:800}
#tut .tt{font-family:'Orbitron',sans-serif;font-size:11px;color:var(--a);letter-spacing:.14em;margin-bottom:4px;display:flex;justify-content:space-between}
#tut button{font-size:10px;padding:4px 8px;border-radius:7px;background:rgba(255,255,255,.14)}
#toast{position:absolute;top:calc(130px + 8%);left:50%;transform:translateX(-50%);font-size:clamp(20px,5vw,34px);font-weight:900;letter-spacing:.1em;text-shadow:0 0 18px var(--a);opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none}
#joy{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.04);transform:translate(-50%,-50%);pointer-events:none;z-index:9}
#joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:color-mix(in srgb,var(--b) 50%,transparent);box-shadow:0 0 14px var(--b)}
/* ---------- modal ---------- */
#modal{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(3,2,10,.7);padding:16px}
.mbox{width:min(400px,94vw);padding:22px;border-radius:20px;background:rgba(10,8,26,.96);border:1px solid rgba(255,255,255,.16);text-align:center;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 40px color-mix(in srgb,var(--a) 30%,transparent)}
.mbox h2{font-size:24px;letter-spacing:.1em;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.mbox p{font-family:'Segoe UI',system-ui,sans-serif;opacity:.85;line-height:1.45}
.mbox .stat{font-size:28px;font-weight:900}
.mbox input{padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:#fff;font-family:inherit;font-size:18px;text-align:center;letter-spacing:.1em;text-transform:uppercase}
.choice{padding:12px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);text-align:left;font-family:'Segoe UI',system-ui,sans-serif}
.choice b{font-family:'Orbitron',sans-serif;color:var(--b);font-size:13px;display:block}
.sndbtn{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);font-size:20px;z-index:25}
/* ---------- slots ---------- */
.slot-wrap{display:flex;flex-direction:column;gap:12px;align-items:center;font-family:'Orbitron',sans-serif}
.slot-coins{font-size:18px}
.reels{display:flex;gap:8px;padding:14px;border-radius:18px;background:linear-gradient(180deg,#1a0f33,#0b0718);border:2px solid var(--a);box-shadow:0 0 24px color-mix(in srgb,var(--a) 45%,transparent),inset 0 0 30px rgba(0,0,0,.8)}
.reel{width:64px;height:80px;border-radius:10px;background:linear-gradient(180deg,#fff 0%,#e8e8f4 50%,#c8c8dc 100%);display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:inset 0 6px 10px rgba(0,0,0,.35),inset 0 -6px 10px rgba(0,0,0,.35)}
.reels.five .reel{width:50px;height:66px;font-size:32px}
.reel.spin{animation:rblur .09s linear infinite}
.reel.win{box-shadow:0 0 18px #ffd23f,inset 0 0 12px #ffd23f}
@keyframes rblur{50%{transform:translateY(3px);filter:blur(1.5px)}}
.bets{display:flex;gap:6px}
.bets button{padding:8px 12px;border-radius:9px;background:rgba(255,255,255,.08);font-size:12px;font-weight:700}
.bets button.on{background:var(--b);color:#050510}
.slot-msg{min-height:26px;font-size:16px;font-weight:800;text-align:center;letter-spacing:.06em}
.slot-msg.win{color:#ffd23f;text-shadow:0 0 12px #ffd23f}
.slot-msg.lose{color:#ff6b8a}
.wheel-box{position:relative;width:240px;height:240px}
.wheel{width:240px;height:240px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 26px var(--a);transition:transform 3.6s cubic-bezier(.12,.8,.18,1)}
.wheel-lbl{position:absolute;left:50%;top:50%;width:0;height:0}
.wheel-lbl span{position:absolute;left:-18px;top:-104px;width:36px;text-align:center;font-size:13px;font-weight:900;color:#fff;text-shadow:0 1px 3px #000}
.wheel-ptr{position:absolute;left:50%;top:-12px;margin-left:-12px;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:24px solid #fff;filter:drop-shadow(0 0 6px var(--a));z-index:2}
.coin{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c8,#ffd23f 45%,#b8860b);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#6b4a00;box-shadow:0 0 22px #ffd23f}
.coin.flip{animation:cflip .9s ease-in-out}
@keyframes cflip{0%{transform:rotateY(0) scale(1)}50%{transform:rotateY(900deg) scale(1.3)}100%{transform:rotateY(1800deg) scale(1)}}
.dbl{display:flex;flex-direction:column;gap:8px;align-items:center;padding:12px;border-radius:14px;border:1px dashed #ffd23f88;width:100%}
.paytable{font-family:'Segoe UI',sans-serif;font-size:12px;opacity:.75;text-align:center;line-height:1.5}
.upg{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);margin-bottom:8px}
.upg .ic{font-size:26px;width:40px;text-align:center}
.upg .tx{flex:1;font-size:13px}
.upg .tx b{font-family:'Orbitron',sans-serif;font-size:12px;display:block}
.pips{display:flex;gap:4px;margin-top:4px}.pips i{width:16px;height:6px;border-radius:3px;background:rgba(255,255,255,.15)}.pips i.on{background:var(--b);box-shadow:0 0 6px var(--b)}
.upg button{padding:8px 10px;border-radius:9px;font-size:12px;font-weight:700;background:linear-gradient(90deg,var(--a),var(--b));color:#050510}
.upg button:disabled{opacity:.4}
.casino{background:linear-gradient(90deg,#ffd23f,#ff7b1c,#ff2bd6)!important;color:#1a0610!important}

/* ---------- ability shop ---------- */
.mid.abil{background:linear-gradient(90deg,color-mix(in srgb,var(--b) 30%,transparent),color-mix(in srgb,var(--a) 30%,transparent));border-color:var(--b)}
.mbox{max-height:92vh;overflow-y:auto}
.mbox.wide{width:min(480px,96vw)}
.abshop{display:flex;flex-direction:column;gap:8px;text-align:left;font-family:'Segoe UI',system-ui,sans-serif}
.abshop .bal{text-align:center;font-family:'Orbitron',sans-serif;font-size:17px;padding:8px;border-radius:10px;background:rgba(255,210,74,.08);border:1px solid #ffd24a55}
.abrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid color-mix(in srgb,var(--b) 40%,transparent)}
.abrow .ic{font-size:26px;width:38px;text-align:center;flex:none}
.abrow .tx{flex:1;font-size:12px;line-height:1.3;opacity:.9}
.abrow .tx b{display:block;font-family:'Orbitron',sans-serif;font-size:12px;color:var(--b);letter-spacing:.05em}
.abrow .have{font-family:'Orbitron',sans-serif;font-size:11px;opacity:.8;display:block;margin-top:2px}
.abrow button{flex:none;min-width:74px;padding:10px 8px;border-radius:10px;font-size:12px;font-weight:800;background:linear-gradient(90deg,var(--a),var(--b));color:#050510;font-family:'Orbitron',sans-serif}
.abrow button:disabled{background:rgba(255,255,255,.1);color:#8d8aa8}
.abrow.free{border-style:dashed;opacity:.8}
.abrow.gold{border-color:#ffd24a66;background:rgba(255,210,74,.05)}
.abshop .cat{margin:8px 0 0}
.abshop .note{font-size:11px;opacity:.6;text-align:center}

/* v1.4: abilities at the top, glow when ready */
.ab.ready{animation:abpulse 1.4s infinite}
@keyframes abpulse{50%{box-shadow:0 0 24px var(--b),0 0 6px #fff inset}}
.ab .nm{bottom:-12px;font-size:8px;opacity:.9}
/* big counter chip in the bar (Sky Shield ammo) */
.ctr{flex:1;min-width:0;max-width:170px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 8px;border-radius:14px;border:2px solid #36d6ff;background:rgba(54,214,255,.1);line-height:1}
.ctr span{font-size:10px;letter-spacing:.14em;opacity:.8}
.ctr b{font-size:24px;font-weight:900;margin-top:4px;color:#fff;white-space:nowrap}
.ctr.low{border-color:#ffe14a;background:rgba(255,225,74,.12)}.ctr.low b{color:#ffe14a}
.ctr.empty{border-color:#ff3b3b;background:rgba(255,59,59,.18);animation:ctrblink .5s infinite}.ctr.empty b{color:#ff3b3b;font-size:17px}
@keyframes ctrblink{50%{opacity:.45}}
@media (max-width:420px){.ctr b{font-size:19px}.ctr span{font-size:9px}.ctr{padding:5px 4px}}

/* ---------- 1-minute story ending ---------- */
#screen-ending{background:linear-gradient(180deg,rgba(3,2,10,.85),rgba(3,2,10,.35) 30%,rgba(3,2,10,.35) 70%,rgba(3,2,10,.9));z-index:50;justify-content:flex-start;padding:0;overflow:hidden}
.crawl{position:absolute;inset:0;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
.crawl-in{position:absolute;left:50%;width:min(560px,90vw);transform:translate(-50%,100vh);animation:crawl 58s linear forwards;text-align:center;font-family:'Segoe UI',system-ui,sans-serif;font-size:clamp(17px,4.4vw,22px);line-height:1.6}
@keyframes crawl{to{transform:translate(-50%,-100%)}}
.crawl-in p{margin:0 0 26px;text-shadow:0 2px 8px #000}
.crawl-in h3{font-family:'Orbitron',sans-serif;color:var(--b);letter-spacing:.14em;margin:40px 0 18px;font-size:clamp(18px,5vw,26px)}
.endlogo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(40px,11vw,76px);line-height:1.05;margin-bottom:50px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.endthe{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(36px,10vw,64px);margin:70px 0 20px;color:#fff;text-shadow:0 0 24px var(--a)}
.endthanks{opacity:.8}
.endskip{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:3;padding:10px 16px;border-radius:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);font-size:13px;font-weight:800;letter-spacing:.1em}
.endbar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.08)}
.endbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b))}

/* ---------- v1.6 finale ---------- */
#fw{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#screen-ending .crawl,#screen-ending .endbar,#screen-ending .endskip{z-index:2}
#screen-ending .endskip{z-index:10;pointer-events:auto}#screen-ending .crawl,#screen-ending #fw,#screen-ending .finale{pointer-events:none}
.finale{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px;transition:opacity 1.2s, transform 1.2s}
.finale.out{opacity:0;transform:scale(1.15);pointer-events:none}
.medal{width:170px;height:170px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:100px;background:radial-gradient(circle at 35% 30%,#fff8,transparent 45%),radial-gradient(circle,color-mix(in srgb,var(--mc) 60%,#000),#000 75%);border:5px solid var(--mc);box-shadow:0 0 40px var(--mc),0 0 120px color-mix(in srgb,var(--mc) 60%,transparent);animation:medalIn 1.4s cubic-bezier(.2,1.6,.4,1) both, medalGlow 1.6s 1.4s ease-in-out infinite}
.medal span{filter:drop-shadow(0 4px 10px #000)}
@keyframes medalIn{0%{transform:scale(0) rotate(-540deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes medalGlow{50%{box-shadow:0 0 70px var(--mc),0 0 200px var(--mc)}}
.fin-t1{font-family:'Orbitron',sans-serif;letter-spacing:.5em;font-size:14px;opacity:0;animation:fadeUp .8s 1.1s forwards}
.fin-t2{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(40px,11vw,80px);line-height:1;background:linear-gradient(90deg,var(--a),#fff,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;animation:fadeUp .8s 1.4s forwards, shine 3s 2s linear infinite;background-size:200% 100%}
.fin-t3{font-family:'Orbitron',sans-serif;font-weight:900;letter-spacing:.2em;font-size:clamp(15px,4.5vw,24px);opacity:0;animation:fadeUp .8s 1.9s forwards;text-shadow:0 0 20px currentColor}
.fin-stats{display:flex;gap:22px;margin-top:10px;opacity:0;animation:fadeUp .8s 2.5s forwards}
.fin-stats div{display:flex;flex-direction:column;align-items:center}.fin-stats b{font-family:'Orbitron',sans-serif;font-size:22px}.fin-stats span{font-size:10px;letter-spacing:.2em;opacity:.7}
.fin-rare{font-family:'Segoe UI',sans-serif;font-style:italic;opacity:0;animation:fadeUp .8s 3.2s forwards;color:#ffd23f}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes shine{to{background-position:-200% 0}}
.end-d2 .medal{width:200px;height:200px;font-size:120px}
.endsub{font-family:'Orbitron',sans-serif;letter-spacing:.3em;font-size:13px;margin:-30px 0 50px}
.endmedal{font-size:80px;margin:10px 0 20px;filter:drop-shadow(0 0 20px #ffd23f)}
#screen-ending{background:#03020a}
#screen-ending .crawl{background:transparent}

/* ---------- finish / claim form ---------- */
.claimcode{font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.2em;padding:10px;border-radius:12px;border:2px dashed #ffd23f;background:rgba(255,210,74,.08)}
.claimcode b{font-size:30px;letter-spacing:.25em;color:#ffd23f}
.clok{display:flex;gap:8px;align-items:flex-start;text-align:left;font-family:'Segoe UI',sans-serif;font-size:13px;opacity:.85}

/* 4-ability games: compact bar on phones */
@media (max-width:480px){
  .ab4 #bar{padding:0 8px;gap:6px}

  .ab4 .ab{width:46px;height:46px;font-size:20px}

}

/* ===== v2 SIDE LAYOUT (Andrew, Oct 2026): abilities in a column on the RIGHT, game to the left =====
   Bigger buttons, readable names, and a live countdown ring + seconds on any ability that is running. */
.lay-side #bar{left:auto;right:0;top:46px;bottom:0;width:var(--side,88px);height:auto;padding:12px 0 calc(10px + env(safe-area-inset-bottom));flex-direction:column;justify-content:flex-start;gap:10px;border-bottom:0;border-left:2px solid color-mix(in srgb,var(--b) 55%,transparent);box-shadow:-6px 0 18px rgba(0,0,0,.5)}

.lay-side #hudCounter{margin:6px 0 0;max-width:80px;width:80px;flex:none;padding:6px 2px}
.lay-side .ctr b{font-size:17px}.lay-side .ctr span{font-size:8px;letter-spacing:.06em;text-align:center}
.lay-side .barbtns{margin-top:auto;flex-direction:column;gap:8px}

@media (max-width:420px){ .lay-side{--side:80px} .lay-side .ab,.lay-side.ab4 .ab{width:58px;height:58px;font-size:25px} .lay-side #abilities{gap:20px} .lay-side #hudCounter{width:74px;max-width:74px} .lay-side .bbtn{width:58px;height:44px} }
@media (max-height:640px){ .lay-side #abilities{gap:16px} .lay-side .ab,.lay-side.ab4 .ab{width:52px;height:52px;font-size:22px} }
/* running ability: countdown ring + big seconds */
.ab .tm{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;text-shadow:0 0 6px #000,0 0 3px #000;pointer-events:none}
.ab.timing{background:conic-gradient(var(--b) calc(var(--p,1)*360deg), rgba(5,4,16,.85) 0);box-shadow:0 0 26px var(--b);animation:none}
.ab.timing .tm{display:flex}.ab.timing .ic{opacity:.35}
.ab.timing.ending{animation:abend .35s infinite}
@keyframes abend{50%{box-shadow:0 0 4px #ff3b3b;border-color:#ff3b3b}}

/* ===== v3 LAYOUT (Andrew, 15 Oct 2026) =====
   Abilities: a column on the LEFT, hugging the game's left edge (outside the play area).
   Score, stage, lives, gold, the game counter and every running ability timer: a see-through strip
   laid slightly over the TOP of the game, tinted with the game's own colour so it doesn't pull your eye. */
.lay-side #bar{right:auto;width:var(--side,88px);bottom:auto;border-left:0;border-right:2px solid color-mix(in srgb,var(--b) 30%,transparent);
  background:color-mix(in srgb,var(--bg) 78%,transparent);box-shadow:none;border-radius:0}
.lay-side #hudTop{right:auto;height:auto;min-height:34px;padding:4px 66px 4px 8px;flex-wrap:wrap;justify-content:flex-start;gap:4px 12px;font-size:12px;
  background:linear-gradient(color-mix(in srgb,var(--bg) 55%,transparent),color-mix(in srgb,var(--bg) 25%,transparent));border-bottom:0;opacity:.88}
.lay-side #hudTop .hs b{font-weight:800}
.lay-side #btnEnd{top:4px;right:6px;padding:5px 9px;font-size:10px;background:color-mix(in srgb,var(--bg) 50%,transparent)}
#hudRow2{display:none}
.lay-side #hudRow2{display:flex;flex-basis:100%;flex-wrap:wrap;gap:5px;align-items:center}
.lay-side #hudRow2:not(:has(.fx)):not(:has(.ctr:not(.hidden))){display:none}
.lay-side #hudCounter{flex:none;flex-direction:row;gap:6px;max-width:none;width:auto;margin:0;padding:2px 9px;border-radius:10px;border-width:1px;background:color-mix(in srgb,var(--bg) 40%,transparent)}
.lay-side #hudCounter span{font-size:9px;letter-spacing:.06em;opacity:.8}.lay-side #hudCounter b{font-size:14px}
#hudFx{display:flex;flex-wrap:wrap;gap:5px}
.fx{font-style:normal;display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:800;border:1px solid color-mix(in srgb,var(--b) 70%,transparent);background:color-mix(in srgb,var(--b) 22%,transparent)}
.fx.end{animation:abend .35s infinite}
.lay-side #toast{transform:translateX(-50%)}
@media (max-width:480px){ .lay-side #hudTop{gap:3px 9px;padding:3px 58px 3px 6px;font-size:11px} .lay-side #hudTop span{display:none} .lay-side #hudCounter span{display:inline} }

/* arcade navigation row on the main menu */
.gnav{display:flex;gap:6px;margin-top:10px;width:100%}
.gnav .gn{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:4px;padding:10px 6px;border-radius:12px;font-size:11px;font-weight:800;letter-spacing:.04em;text-decoration:none;color:#fff;background:rgba(255,255,255,.06);border:1px solid color-mix(in srgb,var(--a) 50%,transparent);white-space:nowrap;overflow:hidden}
.gnav .gn span{overflow:hidden;text-overflow:ellipsis}
.gnav .gn.all{flex:0 0 auto;padding:10px 10px;color:var(--a)}

.fx.doom{background:#ff3b3b33;border-color:#ff3b3b;color:#ffd0d0}

/* ===== SHELL-LAYOUT-2 (v1.5, Andrew 20 Oct 2026) =====
   Action buttons (FIRE / JUMP / BOMB…) = big round buttons in #actbar at the bottom of the screen.
   Consumable abilities + SHOP + PAUSE = compact see-through column (#bar) on the screen edge, middle height.
   All sizes come from JS (geo()) as CSS variables, so the ⚙️ SETTINGS sliders resize them live. */
#actbar{display:none}
#app.lay2 #bar{left:0;top:0;right:auto;bottom:auto;width:var(--cw);height:auto;padding:var(--cp) 0;flex-direction:column;align-items:center;justify-content:flex-start;gap:0;
  background:color-mix(in srgb,var(--bg) 50%,transparent);border:1px solid color-mix(in srgb,var(--b) 30%,transparent);border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.35)}
#app.lay2 #abilities{flex-direction:column;align-items:center;gap:calc(var(--nmh) + var(--cg))}
#app.lay2 #bar .ab{width:var(--cb);height:var(--cb);font-size:calc(var(--cb)*.46);border-width:2px}
#app.lay2 #bar .ab .nm{bottom:auto;top:calc(100% + 1px);font-size:var(--nmf);line-height:var(--nmh);max-width:calc(var(--cw) + 4px);overflow:hidden;opacity:1;letter-spacing:.02em}
#app.lay2 #bar .ab .cnt{min-width:calc(var(--cb)*.42);height:calc(var(--cb)*.42);font-size:calc(var(--cb)*.24);right:calc(var(--cb)*-.12);top:calc(var(--cb)*-.12);padding:0 3px}
#app.lay2 #bar .ab .tm{font-size:calc(var(--cb)*.34)}
#app.lay2 #bar .ab .kb{font-size:9px;right:-6px;bottom:0}
#app.lay2 .barbtns{margin-top:calc(var(--nmh) + var(--cg));flex-direction:column;gap:var(--cg)}
#app.lay2.nocons .barbtns{margin-top:0}
#app.lay2 .bbtn{width:var(--cb);height:var(--sb);font-size:calc(var(--sb)*.4);border-radius:12px}
#app.lay2 .bbtn small{display:block;font-size:var(--nmf);margin-top:1px;letter-spacing:.02em}
#app.lay2 #actbar{display:flex;position:absolute;left:0;top:0;gap:var(--ag);pointer-events:auto;touch-action:none}
#app.lay2 #actbar .ab{width:var(--as);height:var(--as);flex-direction:column;gap:1px;border-width:3px;font-size:calc(var(--as)*.38);
  background:radial-gradient(circle at 50% 32%,color-mix(in srgb,var(--b) 38%,rgba(5,4,16,.8)),rgba(5,4,16,.82) 72%);
  box-shadow:0 0 16px color-mix(in srgb,var(--b) 55%,transparent),inset 0 -5px 12px rgba(0,0,0,.45);transition:transform .06s}
#app.lay2 #actbar .ab .ic{line-height:1}
#app.lay2 #actbar .ab .nm{position:static;transform:none;font-size:max(8px,calc(var(--as)*.12));line-height:1.1;opacity:.95;letter-spacing:.03em;max-width:calc(var(--as) - 12px);overflow:hidden;white-space:nowrap}
#app.lay2 #actbar .ab.ready{animation:none}
#app.lay2 #actbar .ab.down{transform:scale(.92);background:color-mix(in srgb,var(--b) 60%,#000);box-shadow:0 0 26px var(--b)}
#app.lay2 #actbar .ab .cnt:empty{display:none}
#app.lay2 #actbar .ab .cnt{right:-2px;top:-2px}
#app.lay2 #actbar .ab .kb{right:50%;transform:translateX(50%);bottom:-8px}
#app.lay2 #actbar .ab .tm{font-size:calc(var(--as)*.3)}
#mpBars{bottom:calc(var(--actH,0px) + 8px)!important}
/* settings page */
.setprevw{display:flex;flex-direction:column;align-items:center;gap:3px}
.setprevw canvas{border-radius:10px;border:2px solid rgba(255,255,255,.25);background:#000}
.setprevw small{font-size:9px;letter-spacing:.2em;opacity:.6}
.setgrp{text-align:left;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid color-mix(in srgb,var(--b) 35%,transparent);display:flex;flex-direction:column;gap:6px}
.seth{font-size:12px;letter-spacing:.12em;color:var(--b);font-weight:800}
.seth small{display:block;font-size:10px;letter-spacing:.02em;color:#fff;opacity:.7;font-weight:400;font-family:'Segoe UI',system-ui,sans-serif;margin-top:2px}
.setl{font-size:11px;letter-spacing:.1em;opacity:.85;display:flex;justify-content:space-between}
.setl b{color:var(--a)}
.sl{position:relative;height:36px;touch-action:none;cursor:pointer}
.sl i{position:absolute;left:14px;right:14px;top:16px;height:5px;border-radius:3px;background:rgba(255,255,255,.15)}
.sl b{position:absolute;left:14px;top:16px;height:5px;border-radius:3px;width:calc((100% - 28px)*var(--f,0));background:linear-gradient(90deg,var(--a),var(--b))}
.sl em{position:absolute;top:5px;left:calc(14px + (100% - 28px)*var(--f,0) - 13px);width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 0 10px var(--b);pointer-events:none}
.slr{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.1em;opacity:.55;margin-top:-4px;padding:0 4px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 3px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);font-size:11px;font-weight:700;letter-spacing:.03em}
.seg button.on{background:var(--b);color:#050510;border-color:var(--b)}
.setnote{font-size:12px!important;opacity:.7!important}
/* the column / action bar background never blocks the game: only the buttons themselves take taps */
#app.lay2 #bar,#app.lay2 #actbar{pointer-events:none}
#app.lay2 #bar button,#app.lay2 #actbar button{pointer-events:auto}
.sethd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sethd .mid{padding:9px 12px;flex:none}
.setr{display:flex;align-items:center;gap:6px}

.setr .sl{flex:1}
.setgrp{gap:5px;padding:8px 10px}
.mbox .row .mid{font-size:11px;padding:11px 4px}

<!-- BUILD-JK-2.0 · 2026-10-19 · shell v1.5 SHELL-LAYOUT-2 -->
<div id="app" class="lay-top">

  <div id="joy" class="hidden"><i></i></div>

      <div class="logo" id="mTitle"></div>
      <div class="meta"><span>BEST <b id="mBest">—</b></span><span class="coins">🪙 <span id="mCoins">0</span></span></div>

      <button class="big" id="btnNew">NEW GAME</button>

      <div class="ver" id="ver"></div>

  </div>

<script>
/* JAYDEN KONG 2.0 — Andrew's own climbing game, ported into the Remix Arcade shell.
   Floors 1-20 are the ORIGINAL game, unchanged (layouts, barrels, drones, jump/climb feel, art, sounds, abilities,
   prize wheel, floor card, ending). Floors 21-100 are new floors built from the same pieces; every 10th is a
   boss floor (pull the bolts to open Pip's cage). Real 2-player co-op (NET-1): two climbers, shared lives. */

function layoutTower(){
  const ground=H-26;
  SUMMIT_Y=HUD_H+42;
  const topG=SUMMIT_Y+100;
  CENTERS=[ground];
  for(let i=1;i<=TOPG;i++) CENTERS[i]=Math.round(ground-(ground-topG)*i/TOPG);
}

/* ══════════════ levels ══════════════ */
const NAMES=["SCRAPYARD","BOLT WORKS","THE FOUNDRY","RIVET ROW","BOILER ROOM","COOLING STACKS",
 "CONVEYOR DECK","THE CATWALKS","SMELTER","GEARWORKS","HIGH GANTRY","CRANE DECK","THE FLUE",
 "PISTON HALL","SCRAP HEAP","THE SPIRE","STORM DECK","RUSTED CROWN","THE AERIE","JAYDEN'S ROOST"];
const NA=["IRON","NEON","STORM","RUST","CHROME","EMBER","FROST","THUNDER","SHADOW","COPPER","STEAM","VOLT","COBALT","SULPHUR","GRAVEL","TITAN"];
const NB=["TOWER","DECK","STACK","SPIRE","WORKS","GANTRY","FORGE","VAULT","LADDERS","HEIGHTS","FURNACE","CATWALK","YARD","CHIMNEY","RIGGING","BELFRY"];
// 5 gaps. Ladders on one beam are >=120px apart and >=72px from the beam above/below.
const LAYOUTS=[
 [[340],[200],[60,304],[192],[288]],
 [[240],[160,372],[296],[380],[240]],
 [[212],[104,380],[280],[124],[196]],
 [[92,352],[192],[60],[380],[160]],
 [[140],[296],[68],[180,368],[256]],
 [[336],[128],[244],[96,392],[268]],
 [[352],[132],[208,344],[120],[228]],
 [[268],[132,388],[56],[352],[176]]
];
// difficulty tiers — the arcade's EASY / HARD / EXPERT are the original NORMAL / PRO / EXPERT
const DIFFS={
  normal:{name:"NORMAL", spd:1.00, rate:1.00, chaser:0, wild:0,   run:1.95, col:"#37d6c4", desc:"learn the ropes"},
  pro:   {name:"PRO",    spd:1.78, rate:0.47, chaser:2, wild:-1,  run:2.25, col:"#ffc12b", desc:"very hard"},
  expert:{name:"EXPERT", spd:2.31, rate:0.33, chaser:3, wild:-2,  run:2.55, col:"#e8503a", desc:"extreme"}
};
const DKEYS=['normal','pro','expert'];
let diffKey="normal";
function D(){ return DIFFS[diffKey]; }
function rng(seed){ let a=seed>>>0; return ()=>{ a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function floorName(i){ if(i<=ORIG) return NAMES[i-1]; if(i===TOTAL) return "THE LAST ROOST"; const R=rng(i*31+7); return NA[Math.floor(R()*NA.length)]+" "+NB[Math.floor(R()*NB.length)]; }

function makeLevel(i,boss){
  const d=D();
  if(i<=ORIG){                                         // ── the original 20 floors, exactly ──
    const t=(i-1)/(ORIG-1);
    return { n:i, name:NAMES[i-1], topg:4, tilt:12, layout:LAYOUTS[(i-1)%LAYOUTS.length], dir:(i%2)?1:-1,
      spd:(1.05+t*1.05)*d.spd,
      rate:Math.max(26, Math.round((132-t*86)*d.rate)), minSpawn:40,
      chasers: Math.min(4, (i<3?0 : i<8?1 : i<15?2 : 3) + (i>=2?d.chaser:0)),
      wildEvery: (i<4&&d.wild>=0)?0 : Math.max(2,(i<9?5 : i<15?4 : 3)+d.wild),
      chSpd:Math.min(1.34,.62+i*.035),
      bonus: 5000+Math.round(t*40)*100, bolts:0, rage:false, seed:0 };
  }
  // ── floors 21-100: new floors from the same pieces. Each one a bit harder than the one before. ──
  const di=DKEYS.indexOf(diffKey), s=(i-ORIG)/(TOTAL-ORIG), f20=makeLevel(ORIG,false);
  const topg=(boss||i===TOTAL)?5 : i>=60?5 : (i>=35&&i%3===0)?5:4;
  return { n:i, name:floorName(i), topg, tilt:12+Math.round(s*4), layout:null, dir:(i%2)?1:-1,
    spd:f20.spd*(1+(di===0?0.42:0.15)*s),
    rate:Math.round(f20.rate-(di===0?12:0)*s), minSpawn:di===0?40:Math.round(40-6*s),
    chasers:Math.min(5, f20.chasers+Math.floor(s*(di===0?2.99:1.99)))-(boss?1:0),
    wildEvery:di===0?(s>0.5?2:3):2,
    chSpd:1.34+s*(di===0?0.22:0.26),
    bonus:9000+(i-ORIG)*50, bolts:boss?(i===TOTAL?4:3):0, rage:!!boss, seed:i*7919+di*104729+101, s };
}
function tutLevel(){ const c=makeLevel(1,false); c.spd=0.8; c.rate=240; c.minSpawn=200; c.chasers=0; c.wildEvery=0; c.name="PRACTICE"; return c; }

let GIRDERS=[], LADDERS=[], BOSS={x:0,y:0,roll:1}, PIP={x:0,y:0}, LAY=[];
const sy=(g,x)=> (x<g.x1||x>g.x2)?null:g.y1+(g.y2-g.y1)*(x-g.x1)/(g.x2-g.x1);
function girderBelow(x,y){ let b=null;
  for(let i=0;i<GIRDERS.length;i++){ const s=sy(GIRDERS[i],x); if(s===null) continue;
    if(s>=y-1&&(b===null||s<b.y)) b={i,y:s}; } return b; }

// ladder layout for a new floor — same rules as Andrew's 8 layouts, mixing in his own pieces
function genLadders(c){
  const R=rng(c.seed), out=[], top=GIRDERS[TOPG], bx=(top.y2>top.y1)?46:402;
  for(let g=0;g<=TOPG;g++){
    const summit=g===TOPG, lo=summit?140:56, hi=summit?308:392, prev=g>0?out[g-1]:[];
    const ok=(x,list)=> x>=lo&&x<=hi && prev.every(p=>Math.abs(p-x)>=72) && list.every(q=>Math.abs(q-x)>=120) && (g!==TOPG-1||Math.abs(x-bx)>=64);
    let xs=null;
    if(R()<0.5){                                     // one of the original layout pieces
      const row=LAYOUTS[Math.floor(R()*LAYOUTS.length)][summit?4:Math.floor(R()*4)];
      if(!(g===TOPG-1&&row.length>1)){ const t=[]; if(row.every(x=>{ const k=ok(x,t); t.push(x); return k; })) xs=row.slice(); }
    }
    if(!xs){
      const n=(!summit&&g!==TOPG-1&&R()<0.42-0.3*c.s)?2:1; xs=[]; let tries=0;
      while(xs.length<n&&tries<300){ tries++;
        let x=lo+Math.round(R()*(hi-lo)/4)*4;
        if(prev.length&&R()<0.4+0.5*c.s){ const p=prev[0]; x=p<224? hi-Math.round(R()*22)*4 : lo+Math.round(R()*22)*4; }
        if(ok(x,xs)) xs.push(x); }
      if(!xs.length) for(let x=lo;x<=hi;x+=4) if(ok(x,[])){ xs=[x]; break; }
    }
    out.push(xs.sort((a,b)=>a-b));
  }
  return out;
}
function buildLevel(c){
  TOPG=c.topg; TILT=c.tilt; layoutTower();

  for(let i=1;i<=TOPG;i++){
    const t=TILT*c.dir*(i%2?1:-1);
    const yAt=x=>(CENTERS[i]-t)+(2*t)*x/448;
    // the DOWNHILL end stops short of the screen, so the drop happens in view
    const x1=t>0?0:44, x2=t>0?404:448;
    GIRDERS.push({x1,y1:yAt(x1),x2,y2:yAt(x2)});
  }
  GIRDERS.push({x1:SX1,y1:SUMMIT_Y,x2:SX2,y2:SUMMIT_Y});
  LAY=c.layout||genLadders(c);
  LADDERS=[];
  LAY.forEach((xs,gap)=>xs.forEach(x=>LADDERS.push({
    x,lo:gap,hi:gap+1,yBottom:sy(GIRDERS[gap],x),yTop:sy(GIRDERS[gap+1],x)})));

  const roll=top.y2>top.y1?1:-1;           // gears roll downhill from Jayden
  const bx=roll>0?46:402;

  const tl=LAY[TOPG][0];

}
function makeBolts(c){
  const out=[]; if(!c.bolts) return out;
  const R=rng(c.seed+55), gis=c.bolts===4?[1,2,4,TOPG]:[1,3,TOPG];
  gis.forEach(gi=>{ const g=GIRDERS[gi]; let best=null;
    for(let k=0;k<60;k++){ const x=Math.round(g.x1+40+R()*(g.x2-g.x1-80));
      if(LADDERS.some(L=>(L.lo===gi||L.hi===gi)&&Math.abs(L.x-x)<34)) continue;
      if(gi===TOPG&&Math.abs(x-BOSS.x)<120) continue;
      best=x; break; }
    if(best===null) best=Math.round((g.x1+g.x2)/2);
    out.push({x:best,y:sy(g,best),gi,got:false}); });

}

function tornadoLift(p){
  if(p.tor==null){                                  // set up the whole trip once
    const to=Math.min(GIRDERS.length-1,(p.gi||0)+2), g=GIRDERS[to];
    // pick a guaranteed-safe landing x well inside the target girder, then its surface y
    let lx=Math.max(g.x1+16,Math.min(g.x2-16,p.x));
    if(g.x2-g.x1<40) lx=(g.x1+g.x2)/2;
    p.tor={to,lx,ly:sy(g,lx),sx:p.x,sy:p.y,dur:70,t:70};
    p.state="air"; p.ladder=null; p.lock=0; p.lockL=null; p.vy=0; p.safe=40;
  }
  const T=p.tor; T.t--;
  const prog=1-(T.t/T.dur), ease=prog*prog*(3-2*prog);
  p.y=T.sy+(T.ly-T.sy)*ease;
  p.x=T.sx+(T.lx-T.sx)*ease+Math.sin(S.tick/2.4)*4*(1-prog);
  p.tornadoT--;
  if(T.t<=0||p.tornadoT<=0){                       // land firmly on the pre-chosen spot
    p.gi=T.to; p.x=T.lx; p.y=T.ly;
    p.state="ground"; p.vy=0; p.safe=40; p.ladder=null; p.lock=0; p.lockL=null; p.jbuf=0; p.coy=0;

}

/* ══════════════ input (original: drag anywhere = stick, tap = jump, 2nd finger = jump now) ══════════════ */
const DEAD=11, MAXR=52;
const PTR=[new Map(),new Map()], STICK=[{},{}];
function cssScale(){ try{ const c=document.getElementById('game'); const r=c.getBoundingClientRect(); if(r.width>10) return r.width/W; }catch(e){} return 0.69; }
function ptrDown(pi,id,x,y){
  const m=PTR[pi]; const p=S&&S.pl[pi];
  const second=m.size>0&&U.mode==='play';
  const rec={sx:x,sy:y,x,y,t:Date.now(),moved:false,jumped:false};
  if(second&&p){ p.pulse=4; rec.jumped=true; }
  m.set(id,rec);
}
function ptrMove(pi,id,x,y){
  const m=PTR[pi], p=m.get(id); if(!p) return;
  const k=pi?0.69:cssScale();
  p.x=x; p.y=y;
  let dx=(p.x-p.sx)*k, dy=(p.y-p.sy)*k; const r=Math.hypot(dx,dy);
  if(r>DEAD) p.moved=true;
  if(r>MAXR){ p.sx+=(dx*(1-MAXR/r))/k; p.sy+=(dy*(1-MAXR/r))/k; }
}
function ptrUp(pi,id,x,y){
  const m=PTR[pi], p=m.get(id); if(!p) return;
  if(x!==undefined) ptrMove(pi,id,x,y);
  m.delete(id);
  if(p.jumped) return;
  if(!p.moved&&Date.now()-p.t<260) handleTap(p.x,p.y,pi);
}
function readStick(pi){
  const st=STICK[pi]; st.L=st.R=st.U=st.D=0; st.on=false;
  const pl=S&&S.pl[pi], k=pi?0.69:cssScale();
  for(const p of PTR[pi].values()){
    if(!p.moved) continue;
    const dx=(p.x-p.sx)*k, dy=(p.y-p.sy)*k, ax=Math.abs(dx), ay=Math.abs(dy);
    const onLadder=pl&&pl.state==="climb";
    if(onLadder){                            // climbing: any real up/down wins, even mid-diagonal
      if(ay>DEAD*.6){ if(dy<0) st.U=1; else st.D=1; }
      else if(ax>DEAD){ if(dx<0) st.L=1; else st.R=1; }
    } else if(ax>DEAD||ay>DEAD){             // walking: strictly one axis
      if(ax>=ay){ if(dx<0) st.L=1; else st.R=1; }
      else      { if(dy<0) st.U=1; else st.D=1; }
    }
    st.ox=p.sx; st.oy=p.sy; st.kx=p.x; st.ky=p.y; st.on=true;
  }
  if(pi===1&&api&&api.input2){ const d=api.input2.dir(), ax=Math.abs(d.x), ay=Math.abs(d.y);   // guest joystick (2 players)
    if(onL(pl)){ if(ay>0.15){ if(d.y<0) st.U=1; else st.D=1; } else if(ax>0.24){ if(d.x<0) st.L=1; else st.R=1; } }
    else if(ax>0.24||ay>0.24){ if(ax>=ay){ if(d.x<0) st.L=1; else st.R=1; } else { if(d.y<0) st.U=1; else st.D=1; } } }
  return st;
}
function onL(p){ return !!(p&&p.state==='climb'); }
function readInputs(){
  if(!S) return;
  for(let i=0;i<S.pl.length;i++){
    const p=S.pl[i], k=i===0?api.input.keys:(api.input2?api.input2.keys:{}), st=readStick(i);
    p.PREV=p.IN;
    p.IN={left:!!(k.ArrowLeft||k.KeyA||st.L), right:!!(k.ArrowRight||k.KeyD||st.R),
          up:!!(k.ArrowUp||k.KeyW||st.U), down:!!(k.ArrowDown||k.KeyS||st.D),
          jump:!!(k.Space||k.KeyZ||k.Enter||p.pulse>0)};
    if(p.pulse>0) p.pulse--;

}

/* ══════════════ screens inside a floor: wheel → floor card → play → (ending) ══════════════ */
const M={items:[],sel:0,rects:[]};
function handleTap(x,y,pi){

  if(m==="over"&&pi===0){ const o=OY();
    for(let i=0;i<M.rects.length;i++){ const r=M.rects[i];
      if(x>=r.x&&x<=r.x+r.w&&y>=r.y+o-4&&y<=r.y+r.h+o+4){ M.sel=i; const it=M.items[i]; if(it&&it.act) it.act(); return; } } }
}

/* ── prize wheel (Andrew's original wheel, between floors) ── */
const WHEEL=[
  {t:"CLIMB",   icon:"↑",  c:"#37d6c4", act:"adv1"},
  {t:"LEAP",    icon:"⇈",  c:"#ffc12b", act:"adv2"},
  {t:"+25",     icon:"◈",  c:"#8ff4e8", act:"cred", amt:25},
  {t:"1-UP",    icon:"♥",  c:"#ff5fa2", act:"life"},
  {t:"JACKPOT", icon:"★",  c:"#ffd76b", act:"jackpot"},
  {t:"+10",     icon:"◈",  c:"#8ff4e8", act:"cred", amt:10},
  {t:"×2",      icon:"✦",  c:"#c05cff", act:"dbl"},

const W_={a:0,v:0,spin:false,pick:-1,settled:false,phase:"idle",from:1,to:1,roadT:0,banner:"",t:0};
function openWheel(){ U.mode="wheel"; Object.assign(W_,{phase:"ready",spin:false,settled:false,pick:-1,banner:"",from:stageN-1,to:stageN,roadT:0,t:0}); }
function spinWheel(){
  if(W_.spin||W_.settled) return;

const JACKPOT_GOLD=420;                         // = one of every ability at shop prices
function resolveWheel(){
  const seg=WHEEL.length, per=(Math.PI*2)/seg;
  let k=((-Math.PI/2 - W_.a)/per) % seg; k=((k%seg)+seg)%seg;
  const idx=Math.floor(k)%seg;

  const a=WHEEL[idx].act;
  if(a==="adv1"){ W_.banner="CLIMB — up you go!"; }
  else if(a==="adv2"){ leap=true; W_.banner="LEAP! start 2 girders up!"; }
  else if(a==="life"){ if(api.lives<MAX_LIVES) api.setLives(api.lives+1); W_.banner="1-UP — extra life!"; }
  else if(a==="cred"){ const amt=WHEEL[idx].amt; api.addCoins(amt); W_.banner="+"+amt+" gold!"; }
  else if(a==="jackpot"){
    if(!api.extra.jp){ api.extra.jp=1; api.addCoins(JACKPOT_GOLD); W_.banner="JACKPOT! gold for EVERY ability!"; }
    else { api.addCoins(25); W_.banner="+25 gold!"; } }
  else if(a==="dbl"){ scoreMul=2; W_.banner="×2 — this floor scores double!"; }
  else if(a==="back"){ U.mode="clown"; U.clownT=0; S.bonus=0; sfx(160,.3,"sawtooth",.06); return; }
  sfx(880,.14,"square",.05); later(()=>blip(1174,.16),150);
  W_.roadT=0;
}
function finishWheel(){
  if(leap){ leap=false;                        // LEAP: everyone starts on girder 2
    S.pl.forEach(p=>{ const g=GIRDERS[2]; const x=Math.max(g.x1+20,Math.min(g.x2-20,p.x)); p.x=x; p.y=sy(g,x); p.gi=2; p.state="ground"; p.safe=40; }); }
  toCard();
}
function stepWheel(){
  W_.t++;
  const anyJump=S.pl.some(p=>hit(p,"jump"));
  if(W_.phase==="ready"&&(anyJump||W_.t>360)) spinWheel();        // spins by itself after 6 s
  if(W_.spin){
    const seg=WHEEL.length, per=(Math.PI*2)/seg, before=Math.floor(W_.a/per);
    W_.a+=W_.v; W_.v*=0.991; W_.v-=0.00022;
    if(Math.floor(W_.a/per)!==before) sfx(1200,.02,"square",.03);

/* ══════════════ gears / chasers / player (original) ══════════════ */
function spawnGear(){
  S.throwN++;
  const wild=cfg.wildEvery>0 && S.throwN%cfg.wildEvery===0, d=BOSS.roll;
  const gx=BOSS.x+d*24;
  S.gears.push({x:gx,y:sy(GIRDERS[TOPG],gx)-9,gi:TOPG,dir:d,vy:0,drift:d*.3,
    from:-1,falling:true,spin:0,scored:false,wild,dead:false});
  sfx(wild?200:150,.09,"sawtooth",.04);
}
function dropGear(g,drift){
  if(g.gi===0){ g.dead=true; return; }
  g.from=g.gi; g.falling=true; g.vy=.5; g.drift=drift;
  g.x=Math.max(9,Math.min(W-9,g.x));
}
function stepGear(g){
  const spd=cfg.spd*(g.wild?1.4:1);
  g.spin+=g.dir*.15;
  if(g.falling){
    const prevB=g.y+9;
    g.vy+=GRAV*1.1; g.y+=g.vy;
    g.x=Math.max(9,Math.min(W-9,g.x+g.drift));
    const newB=g.y+9;
    let L=null;
    for(let i=0;i<GIRDERS.length;i++){
      if(i===g.from) continue;
      const s=sy(GIRDERS[i],g.x); if(s===null) continue;
      if(s>=prevB-2 && s<=newB && (L===null||s<L.y)) L={i,y:s};
    }
    if(L){
      g.y=L.y-9; g.vy=0; g.falling=false; g.gi=L.i; g.from=-1; g.drift=0;
      const gd=GIRDERS[L.i];
      if(gd.y2!==gd.y1) g.dir=gd.y2>gd.y1?1:-1;
      else g.dir = g.x>W/2 ? -1 : 1;
      thud();
    }
    if(g.y>H+40) g.dead=true;
    return;
  }
  const gd=GIRDERS[g.gi];
  if(g.gi===0){
    g.x+=g.dir*spd;
    const s=sy(gd,g.x); if(s!==null) g.y=s-9;
    if(g.x<-14 || g.x>W+14){ g.dead=true; }
    return;
  }
  const nx=g.x+g.dir*spd;
  const pastEnd = nx<gd.x1 || nx>gd.x2 || nx<9 || nx>W-9;
  if(pastEnd){
    g.x=Math.max(9,Math.min(W-9, g.dir>0?Math.min(gd.x2,W-9):Math.max(gd.x1,9)));
    const s=sy(gd,g.x); if(s!==null) g.y=s-9;
    dropGear(g,g.dir*.35);
    return;
  }
  g.x=nx;
  for(const o of S.gears){
    if(o===g || o.falling || o.gi!==g.gi) continue;
    const ahead=(g.dir>0 && o.x>g.x) || (g.dir<0 && o.x<g.x);
    if(ahead && Math.abs(o.x-g.x)<22) g.x = o.x - g.dir*22;
  }
  const s=sy(gd,g.x); if(s!==null) g.y=s-9;
  if(!g.wild) for(const L of LADDERS)
    if(L.hi===g.gi && Math.abs(g.x-L.x)<spd && Math.random()<.09
       && !S.gears.some(o=>o!==g && !o.falling && o.gi===g.gi-1 && Math.abs(o.x-L.x)<40)){
      dropGear(g,0); return; }
}
function nearestL(gi,up,x){ let b=null,bd=1e9;
  for(let i=0;i<LADDERS.length;i++){ const L=LADDERS[i]; if((up?L.lo:L.hi)!==gi) continue; const d=Math.abs(L.x-x); if(d<bd){bd=d;b=i;} } return b; }
function chaseTarget(c){
  if(S.pl.length===1) return S.pl[0];
  let b=S.pl[0],bd=1e9; for(const p of S.pl){ const d=Math.abs(p.gi-c.gi)*1000+Math.abs(p.x-c.x); if(d<bd){bd=d;b=p;} } return b;

function stepChaser(c){
  if(c.delay>0){ c.delay--; return; }
  c.anim+=.12;
  if(c.state==="climb"){ const L=LADDERS[c.ladder]; c.x=L.x;
    if(c.goUp){ c.y-=c.spd; if(c.y<=L.yTop){ c.y=L.yTop; c.gi=L.hi; c.state="walk"; } }
    else { c.y+=c.spd; if(c.y>=L.yBottom){ c.y=L.yBottom; c.gi=L.lo; c.state="walk"; } }
    return; }
  const pl=chaseTarget(c), pg=pl.gi; let target=pl.x, use=null, up=false;
  if(pg>c.gi){ use=nearestL(c.gi,true,c.x); up=true; }
  else if(pg<c.gi){ use=nearestL(c.gi,false,c.x); up=false; }

function stepPlayer(p){
  if(p.lock>0) p.lock--;

  if(p.jbuf>0) p.jbuf--;
  if(p.state==="ground") p.coy=COYOTE; else if(p.coy>0) p.coy--;
  // still let you jump a few frames after stepping off a beam
  if(p.state==="air"&&p.vy>0&&p.coy>0&&p.jbuf>0){
    p.vy=JUMP; p.jbuf=0; p.coy=0; sfx(520,.09,"square",.045); }
  if(p.state==="climb"){ const L=LADDERS[p.ladder]; p.x=L.x;
    if(p.IN.up){ p.y-=CLIMB; p.anim+=.25; }
    if(p.IN.down){ p.y+=CLIMB; p.anim+=.25; }
    if(p.y<=L.yTop){ p.y=L.yTop; p.state="ground"; p.gi=L.hi; p.lockL=p.ladder; p.ladder=null; p.lock=14; p.safe=16; }
    else if(p.y>=L.yBottom){ p.y=L.yBottom; p.state="ground"; p.gi=L.lo; p.lockL=p.ladder; p.ladder=null; p.lock=14; p.safe=16; }
    return; }
  p.vx=0;
  const run=D().run;
  if(p.IN.left){ p.vx=-run; p.face=-1; }
  if(p.IN.right){ p.vx=run; p.face=1; }
  p.x=Math.max(8,Math.min(W-8,p.x+p.vx));
  if(p.vx&&p.state==="ground"){ p.anim+=.2; if(tut&&!SIM&&(p.walked+=Math.abs(p.vx))>60) evnt('move'); }
  if(p.state==="ground"){
    if(p.IN.up) for(let li=0;li<LADDERS.length;li++){ const L=LADDERS[li];
      if(p.lock>0&&li===p.lockL) continue;          // don't re-grab the one just left
      if(Math.abs(p.x-L.x)<18&&p.y>L.yTop+4&&p.y<=L.yBottom+12){ p.state="climb"; p.ladder=li; p.x=L.x; p.y-=2; p.safe=8; evnt('climb'); return; } }
    if(p.IN.down) for(let li=0;li<LADDERS.length;li++){ const L=LADDERS[li];
      if(p.lock>0&&li===p.lockL) continue;
      if(Math.abs(p.x-L.x)<18&&Math.abs(p.y-L.yTop)<12){ p.state="climb"; p.ladder=li; p.x=L.x; p.y+=3; p.safe=8; return; } }
    if(p.jbuf>0 && (p.landT|0)<=0){ p.vy=JUMP; p.state="air"; p.jbuf=0; p.coy=0; sfx(520,.09,"square",.045); }
  }
  if(p.landT>0) p.landT--;

    p.vy+=GRAV; const prev=p.y; p.y+=p.vy;
    if(p.vy>0){ const L=girderBelow(p.x,prev);

    else { for(let i=0;i<GIRDERS.length;i++){ const s=sy(GIRDERS[i],p.x); if(s===null) continue;
        const u=s+GT;
        if(u<prev-12 && p.y-PH<u && prev-PH>=u-2){ p.y=u+PH; p.vy=.4; } } }
    if(p.y>H+30) loseLife(p);

    const g=GIRDERS[p.gi], s=g?sy(g,p.x):null;

    else { const L=girderBelow(p.x,p.y-4);

  }
}
function loseLife(p){

  if(!S) return;
  const who=(all||S.deadP<0||!net())?S.pl:[S.pl[S.deadP]];
  S.dying=false; S.hitT=0; S.deadP=-1; S.freezeT=0;

function collide(){
  if(S.hitT>0||S.winT>0) return;
  for(const p of S.pl){ collideP(p); if(S.hitT>0||S.winT>0) return; }
}
function collideP(p){
  if(p.safe>0){ p.safe--; }                      // brief grace after ladder transitions
  const climbing=p.state==="climb";
  const frozen=S.freezeT>0||p.glitchT>0||p.tornadoT>0||p.shieldT>0;   // phase through everything
  for(const g of S.gears){ if(g.dead) continue;
    const dx=Math.abs(g.x-p.x);
    if(p.hammerT>0&&dx<26&&Math.abs(g.y-(p.y-11))<24){ g.dead=true; addScore(300,g.x,g.y); say("+300"); sfx(880,.1,"square",.05); if(!SIM) api.fx.burst(g.x,g.y,'#ffb020',10,180,.4,3); continue; }
    // "cleared" = your feet are genuinely above this barrel, judged FRESH every frame.
    const cleared=p.y<=g.y-14;
    if(!g.scored&&cleared&&dx<12){ g.scored=true; addScore(100,g.x,g.y-14); sfx(740,.07,"triangle",.045); evnt('hop'); }
    if(p.safe>0||frozen) continue;
    if(climbing){
      const onMy=p.ladder!==null&&Math.abs(g.x-LADDERS[p.ladder].x)<11;
      if(g.falling&&onMy&&g.y>p.y-20&&g.y<p.y-2){ loseLife(p); return; }
    } else if(!cleared){
      if(dx<9&&g.y>p.y-18&&g.y<p.y+12){ loseLife(p); return; }
    } }
  for(const c of S.chasers){ if(c.delay>0) continue;
    const dx=Math.abs(c.x-p.x);
    if(p.hammerT>0&&dx<26&&Math.abs((c.y-11)-(p.y-11))<26){ addScore(500,c.x,c.y-14); say("+500"); sfx(980,.12,"square",.05);
      Object.assign(c,makeChaser(0),{delay:210}); continue; }
    if(p.safe>0||frozen) continue;
    if(dx<PBW+6&&(p.y-20)<(c.y-4)&&(c.y-24)<(p.y-4)){ loseLife(p); return; } }

  for(const b of S.bolts){ if(b.got) continue;
    if(Math.abs(b.x-p.x)<14&&Math.abs(b.y-p.y)<22&&!climbing){ b.got=true; S.stun=90; S.shakeT=20;
      addScore(1000,b.x,b.y-20); sfx(220,.25,"sawtooth",.07); later(()=>blip(660,.12),120);
      say(boltsLeft()?"BOLT! "+boltsLeft()+" TO GO":"PIP'S CAGE IS OPEN!"); if(!SIM){ api.fx.burst(b.x,b.y-8,'#ffd76b',22,220,.6,4); api.fx.shake(8); } } }
  if(p.state==="ground"&&p.gi===GIRDERS.length-1&&Math.abs(p.x-PIP.x)<20&&p.tornadoT<=0){
    if(boltsLeft()){ if(S.tick-S.hint>90){ S.hint=S.tick; say("PULL ALL THE BOLTS FIRST!"); } return; }
    p.hammerT=0; p.big=false;                 // no hammering the queen — it vanishes on rescue
    S.winT=130; S.won=true; addScore(S.bonus,PIP.x,PIP.y-30);
    sfx(660,.1); later(()=>blip(880,.12),110); later(()=>blip(1174,.2),230); }
}

/* ══════════════ update ══════════════ */
function updatePlay(){
  S.tick++; if(!SIM&&msgT>0) msgT--;
  if(S.winT>0){ S.winT--;
    if(S.winT===0&&!SIM) floorWon();
    return; }
  for(const p of S.pl){
    if(p.hammerT>0){ p.hammerT--; if(p.hammerT<=0) p.big=false; }
    if(p.glitchT>0) p.glitchT--;
    if(p.shieldT>0) p.shieldT--;
  }
  if(S.shakeT>0) S.shakeT--;
  if(S.freezeT>0) S.freezeT--;
  if(S.hitT>0){ S.hitT--; if(S.hitT===0&&S.dying){ S.dying=false; deathDone(); if(SIM) return; } }
  for(const p of S.pl){ if(p.tornadoT>0) tornadoLift(p); else if(S.hitT===0&&!S.dying) stepPlayer(p); }
  const frozen=S.freezeT>0;               // FREEZE FRAME: everything but you stops
  if(S.hitT===0&&!frozen){
    if(S.stun>0) S.stun--;
    else if(--S.spawnT<=0){ spawnGear(); S.spawnT=Math.max(cfg.minSpawn,cfg.rate+((Math.random()*26)|0)); if(cfg.rage) S.rage2=14; }
    if(S.rage2>0&&--S.rage2===0&&S.stun<=0) spawnGear();
    for(const c of S.chasers) stepChaser(c);
  }
  if(!frozen) for(const g of S.gears) stepGear(g);
  S.gears=S.gears.filter(g=>!g.dead);
  collide();
  // bonus counts down as you climb, but running out NEVER costs a life
  if(S.tick%45===0&&S.hitT===0&&S.bonus>0){ S.bonus=Math.max(0,S.bonus-100); }
}
function floorWon(){
  if(!tut&&(stageN===ORIG||stageN===TOTAL)){ U.mode='ending'; U.endT=0; return; }
  clearFloor();
}
function clearFloor(){ if(S.cleared) return; S.cleared=true; lastCleared=stageN; U.mode='gone'; api.stageClear(); }
function step(){
  readInputs();
  const m=U.mode;
  if(m==="play") updatePlay();
  else if(m==="card"){ S.tick++; if(--U.cardT<=0) U.mode="play"; if(S.pl.some(p=>hit(p,"jump"))) U.cardT=0; }
  else if(m==="wheel"){ S.tick++; stepWheel(); }
  else if(m==="clown"){ S.tick++; U.clownT++; if((U.clownT>60&&S.pl.some(p=>hit(p,"jump")))||U.clownT>260) toCard(); }
  else if(m==="ending"){ S.tick++; U.endT++; if(S.pl.some(p=>hit(p,"jump"))&&U.endT>60) U.endT=Math.max(U.endT,340); if(U.endT>340) clearFloor(); }
  else if(m==="over"){ S.tick++; const p=S.pl[0];
    if(hit(p,"up")) M.sel=(M.sel+M.items.length-1)%M.items.length;
    if(hit(p,"down")) M.sel=(M.sel+1)%M.items.length;
    if(hit(p,"jump")){ const it=M.items[M.sel]; if(it&&it.act) it.act(); } }
  else S.tick++;
  if(m!=="play"&&msgT>0) msgT--;
  // shell top strip: the original BONUS read-out (bolts on boss floors)
  const cnt=S.bolts.length?'B'+boltsLeft():'C'+S.bonus;
  if(cnt!==lastCnt){ lastCnt=cnt; if(S.bolts.length) api.counter('🔩 BOLTS',(S.bolts.length-boltsLeft())+'/'+S.bolts.length,boltsLeft()?'':'low'); else api.counter('⏱ BONUS',String(S.bonus),S.bonus<1500?'low':''); }
}
function openOver(){
  U.mode="over"; M.sel=0;
  M.items=[{l:"CONTINUE  ·  3 lives, keep score",act:()=>{ api.setLives(3); api.extra.cont=(api.extra.cont||0)+1; restartFloor(); }},
           {l:"END RUN  ·  save score",act:()=>{ U.mode='gone'; api.loseLife(); }}];
}

function drawPlayer(p){
  const t=tk(), x=p.x|0,y=p.y|0;
  if(S&&S.hitT>0&&S.deadP===p.i&&(t>>2)%2) return;
  const step=Math.floor(p.anim)%2, climbing=p.state==="climb", off=(p.vx||climbing)?step:0, f=p.face;
  const two=S&&S.pl.length>1&&p.i!==undefined;
  ctx.save(); ctx.translate(x,y);
  if(two){ ctx.save(); ctx.globalAlpha=.35; ctx.fillStyle=p.i?P2C:P1C; ctx.shadowColor=p.i?P2C:P1C; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.ellipse(0,-15,13,18,0,0,6.284); ctx.fill(); ctx.restore(); }
  ctx.fillStyle="#243055";
  rr(-6,-9+(off?0:1),5,10,2.5); ctx.fill(); rr(1,-9+(off?1:0),5,10,2.5); ctx.fill();
  const sc=suitCols(p), bg=ctx.createLinearGradient(0,-22,0,-6);
  bg.addColorStop(0,sc[0]); bg.addColorStop(1,sc[1]);
  ctx.fillStyle=bg; rr(-8,-22,16,16,6); ctx.fill();
  ctx.save(); ctx.shadowColor="#8ff4e8"; ctx.shadowBlur=8; ctx.fillStyle="#eafffb";
  ctx.beginPath(); ctx.arc(0,-14,3,0,6.284); ctx.fill(); ctx.restore();
  ctx.fillStyle="#eef4ff";
  if(climbing){ rr(-11,-22+(step?3:0),4,10,2); ctx.fill(); rr(7,-22+(step?0:3),4,10,2); ctx.fill(); }
  else if(p.hammerT>0){ const sw=(t>>3)%2;
    rr(f>0?7:-11,-(sw?26:18),4,10,2); ctx.fill();
    ctx.save(); ctx.shadowColor="#ffd76b"; ctx.shadowBlur=p.big?14:8; ctx.fillStyle="#cfd6e6";
    if(p.big){ const hx=f>0?11:-27, hy=-(sw?44:8);
      rr(hx,hy,18,12,3); ctx.fill(); ctx.fillStyle="#9aa4bd"; rr(hx,hy+8,18,4,2); ctx.fill(); }
    else { const hx=f>0?12:-18, hy=-(sw?36:14); rr(hx,hy,10,7,2); ctx.fill(); }
    ctx.restore(); }
  else { rr(-11,-19+(off?1:0),4,9,2); ctx.fill(); rr(7,-19-(off?1:0),4,9,2); ctx.fill(); }
  const hg=ctx.createLinearGradient(0,-30,0,-20);
  hg.addColorStop(0,"#f4f8ff"); hg.addColorStop(1,"#c8d4ee");
  ctx.fillStyle=hg; ctx.beginPath(); ctx.arc(0,-25,7,0,6.284); ctx.fill();
  ctx.fillStyle="#12203c"; rr(-5+(f>0?1:-1),-27,8,5,2.5); ctx.fill();
  ctx.fillStyle=p.i===1?"#ff8ae0":"#37d6c4"; ctx.beginPath(); ctx.arc((f>0?2:-2),-24.5,1.6,0,6.284); ctx.fill();
  ctx.restore();
  // above-head countdown for whichever timed ability is active
  let atimer=0, acol="#ffd76b";
  if(p.hammerT>0){ atimer=p.hammerT; acol="#8ff4e8"; }
  else if(p.glitchT>0){ atimer=p.glitchT; acol="#c05cff"; }
  else if(S&&S.freezeT>0&&p.i===0){ atimer=S.freezeT; acol="#7fe6ff"; }
  else if(p.shieldT>0){ atimer=p.shieldT; acol="#ffd76b"; }
  let ly=y-40;
  if(atimer>0){ const secs=Math.ceil(atimer/60), yy=y-38, xx=x;
    ctx.save();
    ctx.fillStyle="rgba(10,8,22,.8)"; rr(xx-13,yy-13,26,17,5); ctx.fill();
    ctx.strokeStyle=acol; ctx.lineWidth=1.5; rr(xx-13,yy-13,26,17,5); ctx.stroke();
    txt(secs+"s",xx,yy-1,secs<=2?"#ff5fa2":acol,12,"center");
    ctx.restore(); ly=y-56; }
  if(two&&net()){ const nm=String(net().names[p.i]||('P'+(p.i+1))).slice(0,10).toUpperCase(); const o=S.pl[1-p.i]; if(p.i===1&&o&&Math.abs(o.x-p.x)<70&&Math.abs(o.y-p.y)<30) ly-=13;
    ctx.save(); ctx.font="800 11px system-ui,sans-serif"; ctx.textAlign="center"; ctx.lineWidth=3; ctx.strokeStyle="rgba(0,0,0,.8)";
    ctx.strokeText(nm,x,ly); ctx.fillStyle=p.i?P2C:P1C; ctx.fillText(nm,x,ly); ctx.restore(); }
}

    for(let k=-2;k<=2;k++){ ctx.beginPath(); ctx.moveTo(PIP.x+k*6,PIP.y-40); ctx.lineTo(PIP.x+k*6,PIP.y); ctx.stroke(); }

    if(p.tornadoT>0){ const tx=p.x|0, ty=p.y|0;

    if(p.shieldT>0){ const px2=p.x|0, py2=(p.y-13)|0;

function drawRoadStrip(y){
  const n=TOTAL, pad=24, span=W-pad*2;
  const pos=i=>pad+span*(i-1)/(n-1);
  ctx.strokeStyle="#2a2440"; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(pos(1),y); ctx.lineTo(pos(n),y); ctx.stroke();
  const from=W_.from, to=W_.to;
  const e=Math.min(1,W_.roadT/40), ease=e<.5?2*e*e:1-Math.pow(-2*e+2,2)/2;
  const cur=from+(to-from)*ease;
  for(let i=1;i<=n;i++){ const x=pos(i);
    ctx.fillStyle = i<=to ? "#37d6c4" : "#3a3358";
    ctx.beginPath(); ctx.arc(x,y,i%10===0?3.4:1.6,0,6.284); ctx.fill(); }
  const tx=pos(cur), hop=Math.sin(ease*Math.PI)*(to>from?-14:8);
  ctx.save(); ctx.beginPath(); ctx.arc(tx,y-10+hop,9,0,6.284); ctx.clip();
  if(headReady) ctx.drawImage(head,tx-9,y-19+hop,18,18);
  ctx.restore();
  ctx.strokeStyle="#ffc12b"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(tx,y-10+hop,9,0,6.284); ctx.stroke();
  txt("FLOOR "+Math.round(cur),W/2,y+24,"#8d8aa8",11,"center");
}
function drawGamble(){

  const g=ctx.createRadialGradient(W/2,H*0.4,20,W/2,H*0.4,H*0.6);
  g.addColorStop(0,"#241a3c"); g.addColorStop(1,"#07050f");

  const won=W_.phase==="result";

  for(let i=0;i<bulbs;i++){
    const a=i/bulbs*Math.PI*2, lx=cx+Math.cos(a)*(R+16), ly=cy+Math.sin(a)*(R+16);
    const on=((i+(t>>2))%3===0);

    ctx.fillStyle="#0a0812"; ctx.textAlign="center";

    ctx.font="800 12px system-ui,sans-serif"; ctx.fillText(WHEEL[i].t,0,13);
    ctx.textAlign="left"; ctx.restore();
  }
  ctx.fillStyle="#1b1630"; ctx.beginPath(); ctx.arc(cx,cy,22,0,6.284); ctx.fill();
  ctx.strokeStyle="#ffd76b"; ctx.lineWidth=3; ctx.stroke();
  ctx.fillStyle="#ffd76b"; ctx.font="800 14px system-ui,sans-serif"; ctx.textAlign="center";
  ctx.fillText("JK",cx,cy+5); ctx.textAlign="left";
  const flick=W_.spin? Math.sin(t*0.9)*3*Math.min(1,W_.v*4) : 0;
  ctx.save(); ctx.translate(cx,cy-R-14); ctx.rotate(flick*Math.PI/180);
  ctx.fillStyle="#ff3b6b"; ctx.strokeStyle="#0a0812"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(-13,-2); ctx.lineTo(13,-2); ctx.lineTo(0,22); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle="#ffd0dc"; ctx.beginPath(); ctx.arc(0,-4,4,0,6.284); ctx.fill();
  ctx.restore();
  const byy=cy+R+40;
  if(W_.phase==="ready"){
    const pulse=(t>>3)%2;
    ctx.save(); ctx.shadowColor="#37d6c4"; ctx.shadowBlur=pulse?22:10;
    ctx.fillStyle=pulse?"#37d6c4":"#2bbcae"; rr(cx-110,byy,220,54,16); ctx.fill();
    ctx.restore();

  } else if(W_.phase==="spinning"){
    txt("spinning…",cx,byy+30,"#c8c4e6",18,"center");
  } else if(W_.phase==="result"&&W_.pick>=0){

    c.save(); c.translate(k.x,k.y); c.shadowColor='#ffd24a'; c.shadowBlur=12;
    const g=c.createRadialGradient(-2,-3,1,0,0,10); g.addColorStop(0,'#fff6c8'); g.addColorStop(.5,'#ffd23f'); g.addColorStop(1,'#b8860b');
    c.fillStyle=g; c.beginPath(); c.ellipse(0,0,w,10,0,0,Math.PI*2); c.fill();
    c.shadowBlur=0; c.strokeStyle='#8a5a00'; c.lineWidth=1.5; c.beginPath(); c.ellipse(0,0,w*0.62,6.2,0,0,Math.PI*2); c.stroke(); c.restore(); }
}

/* ---------- input ---------- */
const keys = {}; const joy = {active:false, id:null, sx:0, sy:0, x:0, y:0};
const joyEl = $('#joy');
window.addEventListener('keydown', e => {
  audioInit();
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if(keys[e.code]) return; keys[e.code] = true;
  if(state==='play'){
    if(e.code==='Escape' || e.code==='KeyP'){ pauseGame(); return; }
    if(e.code==='KeyB'){ inGameShop(); return; }
    G.abilities.forEach((a,i)=>{ if(e.code===a.key) useAbility(i); });
    G.onKey && G.onKey(e.code, true);
  } else if(state==='paused' && (e.code==='Escape'||e.code==='KeyP')) resumeGame();
});
window.addEventListener('keyup', e => { keys[e.code] = false; if(state==='play') G.onKey && G.onKey(e.code,false); });
window.addEventListener('blur', ()=>{ for(const k in keys) keys[k]=false; if(state==='play'&&!NET.on) pauseGame(); });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && state==='play' && !NET.on) pauseGame(); });
const Input = {
  keys,
  dir(){
    let x=0,y=0;
    if(keys.ArrowLeft||keys.KeyA) x-=1; if(keys.ArrowRight||keys.KeyD) x+=1;
    if(keys.ArrowUp||keys.KeyW) y-=1; if(keys.ArrowDown||keys.KeyS) y+=1;
    if(joy.active){ const dx=joy.x-joy.sx, dy=joy.y-joy.sy, m=Math.hypot(dx,dy); if(m>12){ x=dx/Math.max(m,50); y=dy/Math.max(m,50); } }
    return {x,y};
  },
  dir4(){ const d=Input.dir(); if(Math.abs(d.x)<0.2 && Math.abs(d.y)<0.2) return null; if(Math.abs(d.x)>Math.abs(d.y)) return d.x>0?'R':'L'; return d.y>0?'D':'U'; },
  touch: false
};
function onDown(e){
  audioInit();
  if(state!=='play') return;
  if(e.target.closest && e.target.closest('button,#tut,#bar,#actbar,#hudTop')) return;
  if(e.pointerType !== 'mouse') Input.touch = true;
  const g = toGame(e.clientX, e.clientY);
  if(G.joystick && e.pointerType!=='mouse' && !joy.active){
    joy.active=true; joy.id=e.pointerId; joy.sx=joy.x=e.clientX; joy.sy=joy.y=e.clientY;
    joyEl.style.left=e.clientX+'px'; joyEl.style.top=e.clientY+'px'; joyEl.classList.remove('hidden'); joyEl.firstElementChild.style.transform='';
  }
  if(NET.on&&NET.role==='guest'){ if(!(G.joystick&&joy.active&&joy.id===e.pointerId)) netSendRel({e:'ptr',t:'down',x:g.x,y:g.y}); return; }
  G.onPointer && G.onPointer('down', g.x, g.y, e.pointerId, e.pointerType);
}
function onMove(e){
  if(state!=='play') return;
  if(joy.active && e.pointerId===joy.id){
    joy.x=e.clientX; joy.y=e.clientY; let dx=joy.x-joy.sx, dy=joy.y-joy.sy; const m=Math.hypot(dx,dy);
    if(m>50){dx=dx/m*50;dy=dy/m*50;} joyEl.firstElementChild.style.transform=`translate(${dx}px,${dy}px)`;
  }
  const g = toGame(e.clientX, e.clientY);
  if(NET.on&&NET.role==='guest'){ if(G.joystick&&joy.active&&joy.id===e.pointerId) return; if(e.buttons||e.pointerType!=='mouse'){ NET.pmT=(NET.pmT||0); const now=performance.now(); if(now-NET.pmT>50){ NET.pmT=now; netSendFast({e:'ptr',t:'move',x:g.x,y:g.y}); } } return; }
  G.onPointer && G.onPointer('move', g.x, g.y, e.pointerId, e.pointerType, e.buttons);
}
function onUp(e){
  if(joy.active && e.pointerId===joy.id){ joy.active=false; joyEl.classList.add('hidden'); }
  if(state!=='play') return;
  const g = toGame(e.clientX, e.clientY);
  if(NET.on&&NET.role==='guest'){ if(!(G.joystick&&joy.id===e.pointerId&&!e.__fwd)) netSendRel({e:'ptr',t:'up',x:g.x,y:g.y}); return; }
  G.onPointer && G.onPointer('up', g.x, g.y, e.pointerId, e.pointerType);
}
window.addEventListener('pointerdown', onDown); window.addEventListener('pointermove', onMove);
window.addEventListener('pointerup', onUp); window.addEventListener('pointercancel', onUp);
window.addEventListener('contextmenu', e=>e.preventDefault());

/* ---------- run state ---------- */
let state = 'loading'; // loading, menu, play, paused, modal
const run = {slot:0, stage:1, score:0, lives:3, tutorial:false, practice:false, coinsStage:0, dropN:0, time:0, extra:{}};
const abLock = G.abilities.map(()=>0); const abBadge = G.abilities.map(()=>null); const abActive = G.abilities.map(()=>false);

const API = {
  get diff(){ return P.diff; }, get diffName(){ return DIFFS[P.diff]; },
  get stage(){ return run.stage; }, get score(){ return run.score; }, get lives(){ return run.lives; },
  get tutorial(){ return run.tutorial; },
  // ---- 100-stage difficulty ----
  // level: EASY stage N = level N. HARD starts at level 50, EXPERT at level 100 (and climb to 199).
  // BEGINNER stage N = level N (stage 50 = HARD level). HARD stage N = level N+49.
  // EXPERT starts at HARD stage 80 (level 129), stays there for 3 stages, then jumps +14 levels EVERY stage.
  get level(){ if(run.tutorial) return 1; const s=run.stage; return P.diff===0? s : P.diff===1? s+49 : 128+s+Math.max(0,s-3)*14; },
  // dk: smooth difficulty 0..4 (level 1 = 0, level 50 = 1 = old HARD, level 100 = 2 = old EXPERT)
  get dk(){ return (API.level-1)/49.5; },
  // dv([easy,hard,expert], cap): value smoothly scaled by level; past old EXPERT it keeps rising at half speed
  // dv([easy,hard,expert], cap, expertCap): keeps climbing past the 3rd value at full speed.
  // On EXPERT the (much higher) expertCap applies, so Expert keeps getting harder until it's unbeatable.
  dv(arr, cap, xcap){ const k=API.dk; let v;
    if(k<=1) v=arr[0]+(arr[1]-arr[0])*k; else if(k<=2) v=arr[1]+(arr[2]-arr[1])*(k-1); else v=arr[2]+(arr[2]-arr[1])*(k-2);
    if(P.diff===2 && xcap!==undefined) cap=xcap;
    // cap = the limit it never passes (a max for rising values, a min for falling values)
    if(cap!==undefined) v = arr[2]>=arr[0] ? Math.min(cap,v) : Math.max(cap,v); return v; },
  get boss(){ return !run.tutorial && run.stage%(P.diff===2?5:10)===0; },
  // content: which stage design to use. 0 = tutorial, 3 = boss design (every 10th stage),
  // 1 = basic design, 2 = advanced design (mixed in from level 4, most stages from level 40)
  get content(){ if(run.tutorial) return 0; if(API.boss) return 3; if(P.diff===2) return 2; const L=API.level; if(L<=3) return 1; if(L>=40) return run.stage%4===1?1:2; return run.stage%2?1:2; },
  input: Input, fx: FX, sfx: SFX, W: G.w, H: G.h,
  // addScore(points, x, y, quiet): with a position, gold coins can pop out there.
  // quiet = no floating "+10" text (used for pellets / blocks).
  addScore(n, x, y, quiet){
    run.score += Math.round(n);
    if(x!==undefined){ lastX=x; lastY=y; if(!quiet) FX.text(x,y,'+'+Math.round(n), G.theme.b, 15);
      if(run.dropN<COIN_CAP && Math.random() < Math.min(1, n/(G.coinPts||100))){ run.dropN++; spawnCoin(x,y,1); } }
    updHud();
  },
  // bonus gold for special moves: pops out at the last scoring spot
  addCoins(n){ for(let i=0;i<n;i++) spawnCoin(lastX+(Math.random()-.5)*20, lastY, 1); },
  setLives(n){ run.lives = n; updHud(); },
  loseLife(){
    if(run.tutorial){ toast('TRY AGAIN!'); G.respawn && G.respawn(); return; }
    run.lives--; updHud(); SFX.hurt(); FX.shake(10); FX.flash('#f24',.35);
    if(run.lives<=0) setTimeout(gameOver, 900); else { toast('LIFE LOST'); G.respawn && G.respawn(); }
  },
  stageClear(){ if(state!=='play') return; if(run.tutorial){ tutFinish(); return; } stageClear(); },
  gameOver(){ if(state==='play') setTimeout(gameOver, 600); },
  event(name){ tutEvent(name); },
  toast(t){ toast(t); },
  cos(cat){ const id = P.equipped[cat]; return G.shop.find(s=>s.id===id) || G.shop.find(s=>s.cat===cat); },
  badge(i, txt){ abBadge[i]=txt; },
  setActive(i, on){ abActive[i]=on; },
  resetCooldown(i){ abLock[i]=0; },
  useAb(i){ useAbility(i); },
  // big always-visible counter in the top bar (e.g. Sky Shield ammo). level: '', 'low' or 'empty'
  counter(label, value, level){ setCounter(label, value, level); mpCounter(value); },
  choice(title, opts, cb){ showChoice(title, opts, cb); },
  get extra(){ return run.extra; },
  saveNow(){ if(!run.tutorial) writeSlot(); },
  rand: Math.random
};
G.api = API;

/* ---------- HUD + ability bar ---------- */
const hudEl=$('#hud'), abWrap=$('#abilities'), actWrap=$('#actbar');
/* Action buttons (layout 2): holding one = holding its keyboard key (e.g. FIRE = Space), so hold-to-fire games keep
   firing while your thumb stays on it. Many games also edge-detect that key and call useAbility() themselves; while the
   button is held that 2nd call is ignored, so one press is still exactly ONE action (a tap works exactly as before). */
const held={};   // ability id -> Set of pointer ids holding its action button
let shellUse=false, blockedN=0;
const gameUse=G.useAbility;
G.useAbility=function(id){ if(!shellUse && held[id] && held[id].size){ blockedN++; return false; } return gameUse.apply(this, arguments); };
function holdOn(a, pid){ const s=held[a.id]||(held[a.id]=new Set()); s.add(pid); if(a.key) keys[a.key]=true; }
function holdOff(a, pid){ const s=held[a.id]; if(!s) return; if(pid===undefined) s.clear(); else s.delete(pid); if(!s.size && a.key) keys[a.key]=false; }
function releaseHolds(){ ACT.forEach(i=>{ const a=G.abilities[i]; holdOff(a); abEls[i].classList.remove('down'); }); }
const abEls=G.abilities.map((a,i)=>{
  const isAct=ACT.includes(i);
  const b=document.createElement('button'); b.className='ab'+(isAct?' act':''); b.title=a.name+(a.desc?' — '+a.desc:'');
  b.innerHTML=`<span class="ic">${a.icon}</span><div class="cnt"></div><div class="kb">${a.keyLabel||''}</div><div class="nm">${a.name}</div><div class="tm"></div>`;
  b.addEventListener('pointerdown', e=>{ e.preventDefault(); e.stopPropagation(); audioInit();
    if(isAct){ try{ b.setPointerCapture(e.pointerId); }catch(_){} b.classList.add('down'); if(state==='play') holdOn(a, e.pointerId); }
    useAbility(i); if(G.onAbilityDown) G.onAbilityDown(a.id); });
  b.addEventListener('pointerup', e=>{ e.stopPropagation(); if(isAct){ holdOff(a, e.pointerId); b.classList.remove('down'); } if(G.onAbilityUp) G.onAbilityUp(a.id); });
  if(isAct){ const off=e=>{ if(held[a.id]&&held[a.id].has(e.pointerId)){ holdOff(a, e.pointerId); b.classList.remove('down'); if(G.onAbilityUp) G.onAbilityUp(a.id); } };
    b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off); }
  (isAct?actWrap:abWrap).appendChild(b); return b;
});
// long ability names (e.g. THUNDER BUBBLE) shrink to fit their button instead of being cut off
function fitNames(){ if(!SIDE || hudEl.classList.contains('hidden')) return;
  abEls.forEach(b=>{ const n=b.querySelector('.nm'); n.style.fontSize=''; const mw=n.clientWidth, sw=n.scrollWidth;
    if(mw>0 && sw>mw+1){ const fs=parseFloat(getComputedStyle(n).fontSize)||9; n.style.fontSize=Math.max(6, fs*mw/sw*0.97)+'px'; } }); }
window.addEventListener('resize', fitNames);
function useAbility(i){
  if(state!=='play') return; const a=G.abilities[i];
  if(abLock[i]>0) return;
  const paid = a.cd>0 && !run.tutorial;
  if(paid && have(a)<=0){ toast('NO '+a.name+' LEFT'); SFX.bump(); flashShop(); return; }
  if(NET.on&&NET.role==='guest'){ if(paid){ P.abil[a.id]=have(a)-1; save(); } abLock[i]=a.cd>0?1:0; netSendRel({e:'ab',id:a.id}); return; }
  let used; shellUse=true; try{ used=G.useAbility(a.id); } finally{ shellUse=false; }
  if(used!==false){
    if(paid){ P.abil[a.id]=have(a)-1; save(); if(P.abil[a.id]===0) setTimeout(()=>{ if(state==='play') toast('BUY MORE IN 🛒 SHOP'); },900); }
    abLock[i] = a.cd>0 ? 1 : 0; tutEvent('ab_'+a.id);
  }
}
function flashShop(){ const b=$('#btnShopIn'); b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash'); }
function updAbilities(dt){
  const fx=[];
  G.abilities.forEach((a,i)=>{
    if(abLock[i]>0) abLock[i]=Math.max(0,abLock[i]-dt);
    const el=abEls[i], cnt=el.querySelector('.cnt');
    let label, empty=false;
    if(a.cd===0) label = abBadge[i]!==null ? abBadge[i] : (SIDE ? '' : '∞');   // big action buttons: no ∞ badge (shown only when the game sets one)
    else if(run.tutorial) label='FREE';
    else { const h=have(a); label=h; empty=h<=0; }
    if(cnt.textContent!==String(label)) cnt.textContent=label;
    el.classList.toggle('empty', empty);
    el.classList.toggle('ready', !empty && abLock[i]<=0 && !abActive[i]);
    el.classList.toggle('active', !!abActive[i]);
    // live countdown for abilities that last a while (game reports {left,total[,unit]} via G.abTime)
    let r=null; try{ r = G.abTime ? G.abTime(a.id) : null; }catch(e){ r=null; } const tm=el.querySelector('.tm');
    if(r && r.left>0){ el.classList.add('timing'); el.classList.toggle('ending', r.left<=1.5 && r.unit===undefined && !r.label); el.style.setProperty('--p', Math.max(0,Math.min(1,r.left/r.total)));
      const txt = r.label ? r.label : r.unit!==undefined ? Math.ceil(r.left)+r.unit : (r.left<9.95? r.left.toFixed(1) : Math.ceil(r.left))+'s'; if(tm.textContent!==txt) tm.textContent=txt; }
    else if(el.classList.contains('timing')){ el.classList.remove('timing','ending'); tm.textContent=''; }
    if(r && r.left>0) fx.push(`<em class="fx${r.left<=1.5&&r.unit===undefined&&!r.label?' end':''}">${a.icon} ${r.label ? r.label : r.unit!==undefined ? Math.ceil(r.left)+r.unit : (r.left<9.95? r.left.toFixed(1) : Math.ceil(r.left))+'s'}</em>`);
  });
  if(!run.tutorial&&run.doom!==undefined&&isFinite(run.doom)) fx.unshift(`<em class="fx doom${run.doom<5?' end':''}">⏳ EXPERT ${run.doom<9.95?Math.max(0,run.doom).toFixed(1):Math.ceil(run.doom)}s</em>`);
  const fh=fx.join(''); if(fh!==fxKey){ fxKey=fh; $('#hudFx').innerHTML=fh; }
}
